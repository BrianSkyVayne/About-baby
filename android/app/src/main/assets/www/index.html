<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asisten Bayi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Figtree:wght@400;500;650&display=swap">
<style>
/* Tata letak: satu kolom sempit seperti buku saku KIA, navigasi bawah untuk jempol, kartu tingkat sebagai satu-satunya elemen berwarna kuat. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17282a;
  --muted: #566a6b;
  --line: #d9e0dc;
  --accent: #1f6f6a;
  --accent-ink: #ffffff;
  --accent-soft: #e2efec;
  --lv1: #2e7d4f; --lv1-bg: #e5f2ea;
  --lv2: #8a6400; --lv2-bg: #fbf1d6;
  --lv3: #b0480f; --lv3-bg: #fbe7da;
  --lv4: #b3232a; --lv4-bg: #fbe2e2;
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1a1b; --surface: #172526; --ink: #e4ecea; --muted: #9db0ae; --line: #2a3b3c;
  --accent: #5fb8b0; --accent-ink: #0b1414; --accent-soft: #1d3434;
  --lv1: #7fd1a0; --lv1-bg: #183326; --lv2: #e8c25a; --lv2-bg: #352c12;
  --lv3: #f39a62; --lv3-bg: #3a2516; --lv4: #ff8b8b; --lv4-bg: #3d1c1e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1a1b; --surface: #172526; --ink: #e4ecea; --muted: #9db0ae; --line: #2a3b3c;
  --accent: #5fb8b0; --accent-ink: #0b1414; --accent-soft: #1d3434;
  --lv1: #7fd1a0; --lv1-bg: #183326; --lv2: #e8c25a; --lv2-bg: #352c12;
  --lv3: #f39a62; --lv3-bg: #3a2516; --lv4: #ff8b8b; --lv4-bg: #3d1c1e;
  color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 650; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.05rem; font-family: var(--font-body); font-weight: 650; }
p { margin: 0; }
a { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
button, .btn { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; min-height: 44px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 650; }
.btn-ghost { background: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.5; cursor: default; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; box-sizing: border-box; }
textarea { min-height: 96px; resize: vertical; }
label { font-weight: 500; }

/* Header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 650; font-size: 1.15rem; }
.child-chip { font-size: 0.875rem; color: var(--muted); text-decoration: none; }

/* Navigasi bawah */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 0.72rem; font-weight: 500; }
nav.bottom a svg { width: 22px; height: 22px; }
nav.bottom a span { white-space: nowrap; line-height: 1.2; }
nav.bottom a[aria-current="page"] { color: var(--accent); font-weight: 650; }

/* Daftar menu */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.list a { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; text-decoration: none; color: var(--ink); border-top: 1px solid var(--line); }
.list a:first-child { border-top: 0; }
.list a .t { font-weight: 650; }
.list a .s { color: var(--muted); font-size: 0.875rem; }
.list a .chev { color: var(--muted); flex: none; }
.list a > div { min-width: 0; }

/* Tingkat */
.lv { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 650; font-size: 0.875rem; }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.lv-1 { color: var(--lv1); background: var(--lv1-bg); }
.lv-2 { color: var(--lv2); background: var(--lv2-bg); }
.lv-3 { color: var(--lv3); background: var(--lv3-bg); }
.lv-4 { color: var(--lv4); background: var(--lv4-bg); }
.result { border-radius: var(--radius); padding: 16px; border: 1px solid var(--line); background: var(--surface); }
.result.r-1 { border-left: 6px solid var(--lv1); }
.result.r-2 { border-left: 6px solid var(--lv2); }
.result.r-3 { border-left: 6px solid var(--lv3); }
.result.r-4 { border-left: 6px solid var(--lv4); }
.result h2 { font-size: 1.4rem; }
.result .lv { align-self: flex-start; }
.diff { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.diff:first-of-type { border-top: 0; padding-top: 0; }
.diff-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.freq { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.levels-key { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: start; }

/* Pertanyaan */
.q { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.q:first-child { border-top: 0; padding-top: 0; }
.q .help { font-size: 0.85rem; color: var(--muted); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-width: 72px; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 650; }
.seg.col { flex-direction: column; }
.seg.col button { text-align: left; }
.num-in { display: flex; gap: 8px; align-items: center; }
.num-in input { max-width: 140px; }

/* Sumber */
.src { font-size: 0.8rem; color: var(--muted); }
.src a { color: var(--muted); }
.tag { display: inline-block; font-size: 0.7rem; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; vertical-align: 1px; }
ul.items { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 10px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 650; font-size: 0.8rem; }

/* Hitung napas */
.counter { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-block: 8px; }
.ring { position: relative; width: min(64vw, 240px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c-bg { fill: none; stroke: var(--line); stroke-width: 10; }
.ring .c-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .big { font-family: var(--font-display); font-size: 3.2rem; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1; }
.tap { width: 100%; min-height: 96px; font-size: 1.15rem; font-weight: 650; }

/* Milestone */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { flex: none; min-height: 44px; padding: 6px 12px; border-radius: 999px; font-size: 0.875rem; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; }
.check input { width: 22px; height: 22px; min-height: 0; flex: none; margin-top: 2px; accent-color: var(--accent); }

/* Tanya */
.answer { white-space: pre-wrap; }
.skeleton { height: 14px; border-radius: 6px; background: var(--line); }
.banner { border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); font-size: 0.9rem; }
.banner.warn { background: var(--lv2-bg); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; z-index: 30; max-width: calc(100% - 32px); }
/* Alur satu pertanyaan per layar */
.progress { display: flex; flex-direction: column; gap: 6px; }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width 0.2s ease; }
.qbig { font-family: var(--font-display); font-size: 1.35rem; font-weight: 650; line-height: 1.3; text-wrap: balance; }
.answers { display: flex; flex-direction: column; gap: 10px; }
.answers button { min-height: 52px; text-align: left; padding: 12px 16px; font-size: 1.02rem; }
.answers button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 650; }
.toggle { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; min-height: 52px; padding: 12px 14px; }
.toggle .box { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); margin-top: 1px; display: grid; place-items: center; }
.toggle[aria-pressed="true"] { border-color: var(--lv4); background: var(--lv4-bg); }
.toggle[aria-pressed="true"] .box { border-color: var(--lv4); background: var(--lv4); }
.toggle[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.navrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.main-msg { font-size: 1.08rem; }
.cta { font-weight: 650; }
details.review summary { cursor: pointer; font-weight: 650; min-height: 44px; display: flex; align-items: center; }
.review-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.review-row > div { min-width: 0; }
.review-row button { flex: none; min-height: 44px; padding: 4px 10px; font-size: 0.875rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

      <div class="skeleton" style="width:75%"></div>
      <p class="muted small">Membuka database pengetahuan…</p>
    </div>
  </div>
</div>

"default":{"level":2,"title":"Pantau","text":"Belum ada tanda bahaya dengue. Demam punya banyak penyebab, dan DBD hanya bisa dipastikan lewat pemeriksaan darah oleh dokter.","src":["who_dengue"]},"differentials":[],"care":[{"t":"Pastikan anak cukup minum dan pantau tanda bahaya setiap hari, terutama saat demam mulai turun.","src":["kemenkes_dbd"]}],"escalate":["Nyeri perut","Muntah terus-menerus","Perdarahan","Lemas atau gelisah","Tangan kaki dingin"]},{"id":"kuning","order":8,"title":"Kuning bayi baru lahir","short":"Ikterus pada bayi usia 0–2 bulan","needsAge":true,"danger":["awal","telapak"],"questions":[{"id":"awal","text":"Kuning sudah tampak dalam 24 jam pertama setelah lahir?","type":"yn"},{"id":"telapak","text":"Telapak tangan atau telapak kaki ikut kuning?","type":"yn"},{"id":"urin","text":"Urin berwarna gelap atau tinja pucat (keputihan/abu-abu)?","type":"yn"},{"id":"lama","text":"Kuning masih ada setelah usia 2 minggu?","type":"yn"},{"id":"malas","text":"Bayi malas menyusu atau sangat mengantuk sampai sulit dibangunkan untuk menyusu?","type":"yn"}],"rules":[{"id":"r-awal","when":{"yes":"awal"},"level":4,"text":"Kuning dalam 24 jam pertama termasuk tanda bahaya bayi baru lahir WHO, dan menurut AAP kadar bilirubinnya perlu diperiksa segera.","src":["who_newborn","aap_bili"]},{"id":"r-telapak","when":{"yes":"telapak"},"level":4,"text":"Telapak tangan atau kaki yang kuning termasuk tanda bahaya bayi baru lahir WHO.","src":["who_newborn"]},{"id":"r-malas-nb","when":{"all":[{"yes":"malas"},{"age":["\u003c=",28]}]},"level":4,"text":"Tidak mau menyusu dengan baik termasuk tanda bahaya bayi baru lahir WHO.","src":["who_newborn"]},{"id":"r-malas","when":{"all":[{"yes":"malas"},{"age":[">",28]}]},"level":3,"text":"Malas menyusu disertai kuning perlu diperiksakan hari ini.","src":["aap_bili"]},{"id":"r-urin","when":{"yes":"urin"},"level":3,"text":"Menurut AAP, urin gelap atau tinja pucat bisa menandakan gangguan hati atau saluran empedu, sehingga perlu pemeriksaan bilirubin direk. Periksakan hari ini.","src":["aap_bili"]},{"id":"r-lama","when":{"yes":"lama"},"level":3,"text":"Kuning yang menetap lewat usia 2 minggu perlu diperiksa bilirubin total dan direk.","src":["medstar_bili","aap_bili"]}],"default":{"level":2,"title":"Pantau","text":"Tidak ada tanda bahaya dari jawaban Anda. Sampaikan kuningnya ke bidan atau dokter saat kontrol; AAP menganjurkan semua bayi diperiksa bilirubin di usia 24–48 jam. Menyusu sering membantu.","src":["aap_bili","newborn_intake"]},"differentials":[],"care":[{"t":"Susui 8–12 kali dalam 24 jam.","src":["newborn_intake","aap_bili"]}],"escalate":["Kuning menjalar sampai telapak tangan/kaki","Urin gelap atau tinja pucat","Malas menyusu atau sulit dibangunkan","Kuning masih ada setelah 2 minggu"]},{"id":"neonatus","order":9,"title":"Cek bayi baru lahir","short":"Tanda bahaya WHO untuk bayi usia 0–28 hari","needsAge":false,"danger":["menyusu","kejang","napas","tarikan","gerak","kuning"],"questions":[{"id":"menyusu","text":"Tidak mau atau tidak bisa menyusu dengan baik?","type":"yn"},{"id":"kejang","text":"Kejang, atau pernah kejang?","type":"yn"},{"id":"napas","text":"Napas lebih dari 60 kali per menit (dihitung 60 detik)?","type":"yn"},{"id":"tarikan","text":"Dada tertarik ke dalam dengan kuat saat bernapas?","type":"yn"},{"id":"gerak","text":"Tidak bergerak sendiri (hanya bergerak bila dirangsang, atau tidak sama sekali)?","type":"yn"},{"id":"suhu","text":"Suhu tubuh (°C)","type":"number","unit":"°C","step":0.1,"optional":true},{"id":"kuning","text":"Kuning dalam 24 jam pertama, atau telapak tangan/kaki kuning?","type":"yn"}],"rules":[{"id":"r-any","when":{"any":[{"yes":"menyusu"},{"yes":"kejang"},{"yes":"napas"},{"yes":"tarikan"},{"yes":"gerak"},{"yes":"kuning"},{"num":["suhu",">=",37.5]},{"all":[{"num":["suhu",">",0]},{"num":["suhu","\u003c",35.5]}]}]},"level":4,"text":"Ada tanda bahaya bayi baru lahir menurut WHO. Menurut WHO, satu tanda saja sudah cukup untuk dibawa ke fasilitas kesehatan.","src":["who_newborn"]}],"default":{"level":1,"title":"Tidak ada tanda bahaya WHO","text":"Tidak ada tanda bahaya bayi baru lahir dari jawaban Anda.","src":["who_newborn"]},"differentials":[],"care":[{"t":"Bayi baru lahir menyusu 8–12 kali dalam 24 jam.","src":["newborn_intake"]},{"t":"Mulai hari ke-5, umumnya minimal 6 popok basah sehari.","src":["newborn_intake"]},{"t":"Kebanyakan bayi kembali ke berat lahir di hari ke-10 sampai ke-14.","src":["newborn_intake"]},{"t":"Rawat tali pusat tetap bersih dan kering.","src":["who_cord"]}],"escalate":[]}],"guides":[{"id":"asi","order":1,"title":"ASI","sections":[{"h":"Rekomendasi WHO","items":[{"t":"Mulai menyusu dalam 1 jam pertama setelah lahir.","src":["who_bf"]},{"t":"ASI saja selama 6 bulan pertama, tanpa makanan atau minuman lain, termasuk air.","src":["who_bf","cdc_milestones"]},{"t":"Lanjutkan menyusu bersama MPASI sampai 2 tahun atau lebih, sesuai permintaan bayi.","src":["who_bf"]}]},{"h":"Tanda asupan cukup (bayi baru lahir)","items":[{"t":"Menyusu 8–12 kali dalam 24 jam.","src":["newborn_intake"]},{"t":"Mulai hari ke-5: minimal 6 popok basah sehari.","src":["newborn_intake"]},{"t":"Berat turun di hari-hari awal itu normal; kebanyakan bayi kembali ke berat lahir di hari ke-10–14. Penurunan 10% atau lebih perlu dievaluasi.","src":["newborn_intake"]}]}]},{"id":"mpasi","order":2,"title":"MPASI","sections":[{"h":"Pedoman WHO 2023","items":[{"t":"Mulai MPASI di usia 6 bulan (180 hari) sambil tetap menyusu.","src":["who_cf"]},{"t":"Makanan hewani (daging, ikan, telur) setiap hari.","src":["who_cf"]},{"t":"Hindari makanan dan minuman tinggi gula, garam, lemak trans, dan pemanis non-gula; batasi jus.","src":["who_cf"]},{"t":"Ikuti tanda lapar dan kenyang anak (responsive feeding).","src":["who_cf"]},{"t":"Tanpa ASI: usia 6–11 bulan boleh susu formula atau susu hewani; usia 12–23 bulan susu hewani, follow-up formula tidak direkomendasikan WHO. Sebagian perhimpunan gastroenterologi anak tidak setuju dengan poin susu hewani ini.","src":["who_cf","jpgn2024"]}]},{"h":"Tabel praktis (Kemenkes)","table":{"head":["Usia","Tekstur","Frekuensi","Porsi per makan"],"rows":[["6–8 bulan","Lumat / bubur kental","2–3× makan + 1–2× selingan","Mulai 2–3 sdm sampai ½ mangkuk 250 ml"],["9–11 bulan","Cincang halus/kasar, finger food","3–4× makan + 1–2× selingan","½ sampai ¾ mangkuk"],["12–23 bulan","Makanan keluarga","3–4× makan + 1–2× selingan","¾ sampai 1 mangkuk"]]},"src":["mpasi_kemenkes"]},{"h":"Keamanan makanan","items":[{"t":"Madu dilarang sebelum usia 12 bulan dalam bentuk apa pun, termasuk yang dimasak atau dioleskan ke dot (risiko botulisme bayi). Ibu menyusui yang makan madu tidak menularkan spora lewat ASI.","src":["honey"]},{"t":"Usia 12 bulan ke atas: jus tidak perlu. Bila diberi, maksimal ±120 ml jus buah 100% per hari; hindari minuman manis lain.","src":["cdc_milestones"]}]}]},{"id":"suplemen","order":3,"title":"Vitamin & suplemen","sections":[{"h":"Vitamin D","items":[{"t":"400 IU per hari untuk bayi sampai usia 1 tahun (bayi ASI atau ASI sebagian, mulai hari-hari pertama); 600 IU per hari di atas 1 tahun.","src":["aap_vitd"]},{"t":"IDAI menganjurkan vitamin D sejak lahir dengan dosis yang sama.","src":["idai_vitd"]}]},{"h":"Zat besi (rekomendasi IDAI)","items":[{"t":"Bayi cukup bulan: 2 mg/kgBB/hari, usia 4 bulan–2 tahun, maksimal 15 mg/hari.","src":["idai_besi"]},{"t":"Bayi berat lahir rendah (\u003c 2.500 g): 3 mg/kgBB/hari, usia 1 bulan–2 tahun.","src":["idai_besi"]},{"t":"AAP: bayi ASI 1 mg/kgBB/hari mulai 4 bulan sampai makanan kaya besi masuk; skrining anemia di usia 12 bulan.","src":["aap_vitd"]},{"t":"Suplementasi besi rutin untuk semua bayi ASI masih diperdebatkan; beberapa lembaga di Kanada, Inggris, Eropa, dan Selandia Baru tidak menganjurkannya secara rutin. Untuk Indonesia ikuti IDAI dan konsultasikan ke dokter.","src":["dga_iron"]}]},{"h":"Vitamin A (gratis, program Kemenkes)","items":[{"t":"Diberikan setiap Februari dan Agustus di posyandu atau puskesmas.","src":["kemenkes_vita"]},{"t":"Kapsul biru 100.000 IU untuk bayi 6–11 bulan (1 kali). Kapsul merah 200.000 IU untuk anak 12–59 bulan (2 kali setahun) dan ibu nifas.","src":["kemenkes_vita"]}]}]},{"id":"tidur","order":4,"title":"Tidur aman","sections":[{"h":"Rekomendasi AAP 2022","items":[{"t":"Telentang setiap kali tidur sampai usia 1 tahun. Miring dan tengkurap tidak aman.","src":["aap_sleep"]},{"t":"Alas datar, keras, tidak miring. Area tidur kosong: tanpa selimut longgar, bantal, bumper, atau boneka.","src":["aap_sleep"]},{"t":"Sekamar dengan orang tua tetapi tidak seranjang, idealnya minimal 6 bulan pertama.","src":["aap_sleep"]},{"t":"Hindari tempat tidur miring, bedong atau selimut berpemberat, dan tidur di sofa atau kursi.","src":["aap_sleep"]},{"t":"Tummy time saat bayi bangun dan diawasi, sejak pulang dari rumah sakit.","src":["aap_sleep"]}]},{"h":"Durasi tidur (WHO, termasuk tidur siang)","table":{"head":["Usia","Tidur per hari"],"rows":[["0–3 bulan","14–17 jam"],["4–11 bulan","12–16 jam"],["1–2 tahun","11–14 jam"],["3–4 tahun","10–13 jam"]]},"src":["who_activity"]}]},{"id":"layar","order":5,"title":"Layar & aktivitas","sections":[{"h":"WHO 2019","table":{"head":["Usia","Aktivitas","Layar"],"rows":[["\u003c 1 tahun","Aktif beberapa kali sehari; tummy time minimal 30 menit/hari bagi yang belum bisa bergerak sendiri","Tidak dianjurkan"],["1–2 tahun","Minimal 180 menit/hari","1 tahun: tidak dianjurkan; 2 tahun: maksimal 1 jam"],["3–4 tahun","Minimal 180 menit/hari, 60 menit di antaranya intensitas sedang–berat","Maksimal 1 jam"]]},"src":["who_activity"]},{"h":"Catatan","items":[{"t":"Jangan biarkan anak terikat di stroller, kursi makan, atau gendongan lebih dari 1 jam sekaligus.","src":["who_activity"]},{"t":"CDC: layar tidak dianjurkan di bawah 2 tahun kecuali video call dengan keluarga.","src":["cdc_milestones"]}]}]},{"id":"tersedak","order":6,"title":"Tersedak","sections":[{"h":"Bayi di bawah 1 tahun yang tidak bisa menangis atau batuk","items":[{"t":"1. Telungkupkan bayi di lengan Anda, kepala lebih rendah dari dada, lalu beri 5 tepukan di punggung di antara tulang belikat.","src":["medline_choke","acep_choke"]},{"t":"2. Bila belum keluar, balikkan bayi telentang dan beri 5 tekanan dada dengan 2 jari di tengah tulang dada.","src":["medline_choke"]},{"t":"3. Ulangi bergantian sampai benda keluar. Bila bayi tidak sadar, panggil bantuan dan mulai RJP.","src":["medline_choke","acep_choke"]},{"t":"Jangan lakukan hentakan perut pada bayi di bawah 1 tahun, dan jangan mencolok jari ke mulut bila bendanya tidak terlihat.","src":["acep_choke"]}]},{"h":"Anak 1 tahun ke atas","items":[{"t":"Bila anak masih bisa batuk kuat, biarkan ia terus batuk.","src":["redcross_choke"]},{"t":"Bila tidak bisa bernapas, bicara, atau batuk: 5 tepukan punggung lalu 5 hentakan perut, bergantian.","src":["redcross_choke"]}]}]},{"id":"gigi","order":7,"title":"Tumbuh gigi","sections":[{"h":"Yang perlu dihindari (FDA)","items":[{"t":"Jangan pakai gel atau obat oles benzokain untuk anak di bawah 2 tahun.","src":["fda_teething"]},{"t":"Jangan pakai kalung atau gelang tumbuh gigi (amber, kayu, dan lainnya) karena risiko tercekik dan tersedak.","src":["fda_jewelry"]}]},{"h":"Kontrol gigi","items":[{"t":"Kontrol pertama ke dokter gigi saat gigi pertama tumbuh atau menjelang usia 12 bulan.","src":["gigi_idai"]}]}]},{"id":"bbl","order":8,"title":"Bayi baru lahir","sections":[{"h":"Skrining","items":[{"t":"SHK (Skrining Hipotiroid Kongenital): 2–3 tetes darah tumit di usia 48–72 jam, gratis di fasilitas kesehatan. Bila positif, diobati sebelum usia 1 bulan.","src":["kemenkes_shk"]},{"t":"Skrining pendengaran: sebelum usia 1 bulan; bila tidak lolos, diagnosis sebelum 3 bulan dan intervensi sebelum 6 bulan.","src":["jcih"]}]},{"h":"Perawatan","items":[{"t":"Tali pusat dirawat bersih dan kering.","src":["who_cord"]},{"t":"Kuning: AAP menganjurkan semua bayi diperiksa bilirubin di usia 24–48 jam. Kuning dalam 24 jam pertama, urin gelap, atau tinja pucat perlu diperiksa.","src":["aap_bili"]}]}]},{"id":"tumbuh","order":9,"title":"Pertumbuhan","sections":[{"h":"Stunting (standar WHO)","items":[{"t":"Stunting: panjang/tinggi badan menurut umur di bawah −2 SD median WHO; stunting berat di bawah −3 SD.","src":["stunting"]},{"t":"Ukur panjang berbaring untuk anak di bawah 2 tahun, tinggi berdiri untuk 2 tahun ke atas.","src":["stunting"]},{"t":"Ukur tinggi juga, bukan hanya berat. Masa paling menentukan adalah sejak kehamilan sampai usia 2 tahun.","src":["stunting"]}]}]},{"id":"aman","order":10,"title":"Pencegahan cedera","sections":[{"h":"WHO","items":[{"t":"Anak usia 0–4 tahun punya angka tenggelam tertinggi. Risiko naik saat anak dekat air tanpa pengawasan aktif orang dewasa.","src":["who_drowning"]},{"t":"Penyebab utama kematian akibat cedera pada anak: kecelakaan lalu lintas, tenggelam, luka bakar, jatuh, dan keracunan.","src":["who_injury"]},{"t":"Simpan obat, bahan kimia, dan pembersih terkunci dan jauh dari jangkauan anak.","src":["cdc_milestones"]}]}]},{"id":"ibu","order":11,"title":"Kesehatan ibu","sections":[{"h":"Baby blues atau depresi pascapersalinan?","table":{"head":["","Baby blues","Depresi pascapersalinan"],"rows":[["Kejadian","Sekitar 8 dari 10 ibu","Sekitar 1–2 dari 10 ibu"],["Mulai","2–3 hari setelah melahirkan","Beberapa minggu sampai 1 tahun setelah melahirkan"],["Lama","Sampai ± 2 minggu","Berbulan-bulan atau lebih"],["Gejala","Mood naik-turun, cemas, menangis, sulit tidur","Lebih berat: putus asa, kehilangan minat, mudah marah, sulit konsentrasi, pikiran menyakiti bayi"]]},"src":["ppd"]},{"h":"Kapan mencari bantuan","items":[{"t":"Gejala lebih dari 2 minggu, makin berat, atau mengganggu merawat diri dan bayi: hubungi dokter, bidan, atau psikolog.","src":["ppd"]},{"t":"Ada pikiran menyakiti diri atau bayi: cari bantuan hari ini.","src":["ppd"]}]}]},{"id":"skrining","order":12,"title":"Skrining perkembangan","sections":[{"h":"Jadwal (AAP)","items":[{"t":"Skrining perkembangan umum di usia 9, 18, dan 24 atau 30 bulan.","src":["cdc_autism"]},{"t":"Skrining autisme (misalnya M-CHAT-R) di usia 18 dan 24 bulan untuk semua anak.","src":["cdc_autism"]}]}]}],"milestones":[{"id":"m02","months":2,"label":"2 bulan","d":{"sosial":["Tenang saat diajak bicara atau digendong","Melihat wajah Anda","Tampak senang saat Anda mendekat","Tersenyum saat diajak bicara atau disenyumi"],"bahasa":["Bersuara selain menangis","Bereaksi terhadap suara keras"],"kognitif":["Memperhatikan Anda saat bergerak","Melihat mainan beberapa detik"],"gerak":["Mengangkat kepala saat tengkurap","Menggerakkan kedua tangan dan kedua kaki","Membuka tangan sebentar"]}},{"id":"m04","months":4,"label":"4 bulan","d":{"sosial":["Tersenyum sendiri untuk menarik perhatian","Terkekeh saat diajak bercanda","Melihat, bergerak, atau bersuara untuk mendapat perhatian"],"bahasa":["Bersuara \"oooo\", \"aahh\"","Membalas saat diajak bicara","Menoleh ke arah suara Anda"],"kognitif":["Membuka mulut saat melihat payudara/botol bila lapar","Memperhatikan tangannya sendiri"],"gerak":["Kepala tegak stabil saat digendong","Memegang mainan yang diletakkan di tangannya","Mengayunkan tangan ke arah mainan","Memasukkan tangan ke mulut","Bertumpu pada siku saat tengkurap"]}},{"id":"m06","months":6,"label":"6 bulan","d":{"sosial":["Mengenali orang yang dikenal","Suka melihat dirinya di cermin","Tertawa"],"bahasa":["Bergantian bersuara dengan Anda","Meniup bibir (\"raspberry\")","Memekik"],"kognitif":["Memasukkan benda ke mulut untuk mengenalinya","Meraih mainan yang diinginkan","Menutup bibir tanda tidak mau makan lagi"],"gerak":["Berguling dari tengkurap ke telentang","Bertumpu dengan lengan lurus saat tengkurap","Bertumpu pada tangan saat duduk"]}},{"id":"m09","months":9,"label":"9 bulan","d":{"sosial":["Malu atau takut pada orang asing","Menunjukkan beberapa ekspresi wajah","Menoleh saat dipanggil namanya","Bereaksi saat Anda pergi","Tersenyum atau tertawa saat main cilukba"],"bahasa":["Bersuara \"mamama\", \"bababa\"","Mengangkat tangan minta digendong"],"k /* Mesin penilaian Asisten Bayi (berorientasi objek).
   Dipakai di halaman web, aplikasi Android (WebView), dan tes Node. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /** Empat tingkat triase + catatan. */
  class Level {
    constructor(value, key, name, action) { this.value = value; this.key = key; this.name = name; this.action = action; Object.freeze(this); }
    static of(v) { return Level.ALL[v] || Level.ALL[1]; }
  }
  Level.ALL = {
    0: new Level(0, "info", "Catatan", ""),
    1: new Level(1, "umum", "Umum", "Bisa dirawat di rumah sambil dipantau."),
    2: new Level(2, "pantau", "Pantau", "Perhatikan beberapa jam ke depan."),
    3: new Level(3, "periksa", "Periksa hari ini", "Bawa ke dokter, puskesmas, atau bidan hari ini."),
    4: new Level(4, "igd", "Segera ke IGD", "Bawa ke IGD atau fasilitas kesehatan terdekat sekarang.")
  };

  /** Menilai satu kondisi aturan terhadap jawaban dan konteks (usia). */
  class ConditionEvaluator {
    constructor(answers, ctx) { this.answers = answers || {}; this.ctx = ctx || {}; }
    static compare(a, op, b) {
      switch (op) { case ">": return a > b; case ">=": return a >= b; case "<": return a < b; case "<=": return a <= b; case "==": return a === b; default: return false; }
    }
    static toNumber(v) {
      if (v === null || v === undefined || v === "") return NaN;
      return typeof v === "number" ? v : parseFloat(String(v).replace(",", "."));
    }
    test(c) {
      if (!c || typeof c !== "object") return false;
      const a = this.answers;
      if ("yes" in c) return a[c.yes] === "ya";
      if ("no" in c) return a[c.no] === "tidak";
      if ("eq" in c) return a[c.eq[0]] === c.eq[1];
      if ("num" in c) { const n = ConditionEvaluator.toNumber(a[c.num[0]]); return Number.isFinite(n) && ConditionEvaluator.compare(n, c.num[1], c.num[2]); }
      if ("age" in c) { const d = this.ctx.ageDays; return typeof d === "number" && Number.isFinite(d) && ConditionEvaluator.compare(d, c.age[0], c.age[1]); }
      if ("all" in c) return c.all.every(x => this.test(x));
      if ("any" in c) return c.any.some(x => this.test(x));
      if ("not" in c) return !this.test(c.not);
      if ("count" in c) return c.count.of.filter(x => this.test(x)).length >= c.count.min;
      return false;
    }
    /** Id pertanyaan yang dirujuk sebuah kondisi. */
    static refs(c, out) {
      out = out || [];
      if (!c || typeof c !== "object") return out;
      if ("yes" in c) out.push(c.yes);
      else if ("no" in c) out.push(c.no);
      else if ("eq" in c) out.push(c.eq[0]);
      else if ("num" in c) out.push(c.num[0]);
      else if ("all" in c) c.all.forEach(x => ConditionEvaluator.refs(x, out));
      else if ("any" in c) c.any.forEach(x => ConditionEvaluator.refs(x, out));
      else if ("not" in c) ConditionEvaluator.refs(c.not, out);
      else if ("count" in c) c.count.of.forEach(x => ConditionEvaluator.refs(x, out));
      return out;
    }
  }

  /** Hasil penilaian yang siap ditampilkan. */
  class Assessment {
    constructor(props) { Object.assign(this, props); Object.freeze(this); }
    get levelInfo() { return Level.of(this.level); }
    get isUrgent() { return this.level >= 4; }
  }

  /** Penilai gejala untuk satu definisi checker dari basis pengetahuan. */
  class SymptomChecker {
    constructor(def) { this.def = def; }
    get id() { return this.def.id; }
    get title() { return this.def.title; }
    get dangerIds() { return this.def.danger || []; }
    visibleQuestions(answers, ctx) {
      const ev = new ConditionEvaluator(answers, ctx);
      return (this.def.questions || []).filter(q => !q.showIf || ev.test(q.showIf));
    }
    /** Pertanyaan tanda bahaya (ditanyakan bersama di langkah pertama) dan sisanya (satu per layar). */
    split(answers, ctx) {
      const vis = this.visibleQuestions(answers, ctx);
      const d = new Set(this.dangerIds);
      return { danger: vis.filter(q => d.has(q.id)), rest: vis.filter(q => !d.has(q.id)) };
    }
    assess(answers, ctx) {
      const visible = new Set(this.visibleQuestions(answers, ctx).map(q => q.id));
      const clean = {};
      Object.keys(answers || {}).forEach(k => { if (visible.has(k) && answers[k] !== undefined && answers[k] !== "") clean[k] = answers[k]; });
      const ev = new ConditionEvaluator(clean, ctx);
      const def = this.def;
      const matched = (def.rules || []).filter(r => ev.test(r.when));
      const graded = matched.filter(r => r.level > 0).sort((a, b) => b.level - a.level);
      const notes = matched.filter(r => r.level === 0);
      const fallback = def.default || { level: 1, title: "Umum", text: "", src: [] };
      const level = graded.length ? graded[0].level : fallback.level;

      let differentials = (def.differentials || []).filter(d => d.when && ev.test(d.when));
      if (level <= 2) differentials = (def.differentials || []).filter(d => d.baseline).concat(differentials.filter(d => !d.baseline));

      const src = new Set();
      const add = l => (l || []).forEach(s => src.add(s));
      if (!graded.length) add(fallback.src);
      graded.forEach(r => add(r.src)); notes.forEach(r => add(r.src)); differentials.forEach(d => add(d.src)); (def.care || []).forEach(c => add(c.src));

      return new Assessment({
        level,
        headline: graded.length ? Level.of(level).name : (fallback.title || Level.of(level).name),
        summary: graded.length ? null : fallback.text,
        summarySrc: graded.length ? [] : (fallback.src || []),
        reasons: graded, notes, differentials,
        care: def.care || [], escalate: def.escalate || [],
        sources: Array.from(src),
        answered: Object.keys(clean).length
      });
    }
  }

  /** Perhitungan usia. */
  class Age {
    static days(birth, today) {
      if (!birth) return null;
      const b = new Date(birth + "T00:00:00");
      const t = today ? new Date(today + "T00:00:00") : new Date();
      if (isNaN(b)) return null;
      const tt = new Date(t.getFullYear(), t.getMonth(), t.getDate());
      const d = Math.round((tt - b) / 86400000);
      return d >= 0 ? d : null;
    }
    static label(days) {
      if (days === null || days === undefined) return "";
      if (days < 31) return days + " hari";
      const months = Math.floor(days / 30.4375);
      if (months < 24) return months + " bulan";
      const y = Math.floor(months / 12), m = months % 12;
      return y + " tahun" + (m ? " " + m + " bulan" : "");
    }
    static monthsSince(dateStr, today) {
      const a = new Date(dateStr + "T00:00:00"), b = today ? new Date(today + "T00:00:00") : new Date();
      if (isNaN(a)) return Infinity;
      return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    }
  }

  /** Penjaga anti-halusinasi: setiap pernyataan wajib bersumber terdaftar. */
  class KnowledgeValidator {
    constructor(kb) { this.kb = kb || {}; this.errors = []; }
    static honestEmpty(t) { return /belum (punya|diverifikasi|ada)|sengaja tidak|tidak memuat|belum dihitung/i.test(t || ""); }
    checkSrc(where, list, allowEmpty) {
      const sources = this.kb.sources || {};
      if (!Array.isArray(list)) { this.errors.push(where + ": src bukan array"); return; }
      if (!list.length && !allowEmpty) this.errors.push(where + ": tanpa sumber");
      list.forEach(s => { if (!sources[s]) this.errors.push(where + ": sumber tidak dikenal '" + s + "'"); });
    }
    validate() {
      const kb = this.kb, H = KnowledgeValidator.honestEmpty;
      (kb.checkers || []).forEach(c => {
        const qids = new Set((c.questions || []).map(q => q.id));
        (c.danger || []).forEach(q => { if (!qids.has(q)) this.errors.push("checker " + c.id + ": tanda bahaya tidak ada '" + q + "'"); });
        (c.rules || []).forEach(r => {
          const w = "checker " + c.id + " rule " + r.id;
          this.checkSrc(w, r.src, H(r.text));
          if (![0, 1, 2, 3, 4].includes(r.level)) this.errors.push(w + ": level tidak valid");
          ConditionEvaluator.refs(r.when).forEach(q => { if (!qids.has(q)) this.errors.push(w + ": pertanyaan tidak ada '" + q + "'"); });
        });
        this.checkSrc("checker " + c.id + " default", (c.default || {}).src, false);
        (c.differentials || []).forEach(d => this.checkSrc("checker " + c.id + " diferensial " + d.name, d.src, false));
        (c.care || []).forEach((x, i) => this.checkSrc("checker " + c.id + " care " + i, x.src, H(x.t)));
      });
      (kb.guides || []).forEach(g => (g.sections || []).forEach(s => {
        if (s.items) s.items.forEach((it, i) => this.checkSrc("panduan " + g.id + " / " + s.h + " #" + i, it.src, false));
        if (s.table) this.checkSrc("panduan " + g.id + " / " + s.h + " tabel", s.src, false);
      }));
      (kb.obat || []).forEach(o => this.checkSrc("obat " + o.id, o.src, H(o.t)));
      if (kb.imunisasi) this.checkSrc("imunisasi", kb.imunisasi.src, false);
      if (!kb.meta || !kb.meta.verifiedDate) this.errors.push("meta: verifiedDate kosong");
      return this.errors;
    }
    static validate(kb) { return new KnowledgeValidator(kb).validate(); }
  }

  return { Level, ConditionEvaluator, Assessment, SymptomChecker, Age, KnowledgeValidator };
});

  class KnowledgeBase {
    constructor() { this.clear(); }
    clear() { this.sources = {}; this.checkers = []; this.guides = []; this.milestones = []; this.obat = []; this.changelog = []; this.usulan = []; this.meta = null; this.imunisasi = null; }
    load(kb) {
      this.sources = kb.sources || {}; this.checkers = kb.checkers || []; this.guides = kb.guides || []; this.milestones = kb.milestones || [];
      this.obat = kb.obat || []; this.changelog = kb.changelog || []; this.meta = kb.meta || null; this.imunisasi = kb.imunisasi || null;
    }
    get isEmpty() { return !this.checkers.length; }
    get isStale() { return !!this.meta && Age.monthsSince(this.meta.verifiedDate) >= (this.meta.reviewMonths || 12); }
    byOrder(list) { return list.slice().sort((a, b) => (a.order || 99) - (b.order || 99)); }
    checker(id) { const d = this.checkers.find(c => c.id === id); return d ? new SymptomChecker(d) : null; }
    guide(id) { return this.guides.find(g => g.id === id) || null; }
    source(id) { return this.sources[id] || null; }
    snapshot() {
      const strip = o => { const c = { ...o }; delete c._id; return c; };
      return { sources: this.sources, checkers: this.checkers.map(strip), guides: this.guides.map(strip), milestones: this.milestones.map(strip), obat: this.obat.map(strip), imunisasi: this.imunisasi, meta: this.meta, changelog: this.changelog.map(strip) };
    }
    static parse(text) {
      let kb;
      try { kb = JSON.parse(text); } catch (e) { return { error: "File bukan JSON yang valid." }; }
      if (!kb || !Array.isArray(kb.checkers) || !kb.meta) return { error: "Isi file bukan data Asisten Bayi." };
      const errs = KnowledgeValidator.validate(kb);
      if (errs.length) return { error: "Ditolak karena ada pernyataan tanpa sumber: " + errs[0] };
      return { kb };
    }
  }

  /** Satu sesi menjawab satu penilai: langkah tanda bahaya, lalu satu pertanyaan per layar. */
  class CheckerSession {
    constructor(checker, profile) { this.checker = checker; this.profile = profile; this.answers = {}; this.step = null; this.skippedByUrgent = false; this.reset(); }
    get ctx() { return { ageDays: this.profile.ageDays }; }
    get parts() { return this.checker.split(this.answers, this.ctx); }
    reset() { this.answers = {}; this.skippedByUrgent = false; this.step = this.parts.danger.length ? "danger" : 0; }
    get assessment() { return this.checker.assess(this.answers, this.ctx); }
    get questions() { return this.parts.rest; }
    get total() { return this.questions.length + (this.parts.danger.length ? 1 : 0); }
    get position() { if (this.step === "danger") return 1; if (this.step === "result") return this.total; return this.step + 1 + (this.parts.danger.length ? 1 : 0); }
    get current() { return typeof this.step === "number" ? this.questions[this.step] : null; }
    toggleDanger(qid) { this.answers[qid] = this.answers[qid] === "ya" ? undefined : "ya"; }
    get dangerSelected() { return this.parts.danger.filter(q => this.answers[q.id] === "ya").length; }
    confirmDanger() {
      this.parts.danger.forEach(q => { if (this.answers[q.id] !== "ya") this.answers[q.id] = "tidak"; });
      if (this.assessment.isUrgent) { this.skippedByUrgent = this.questions.length > 0; this.step = "result"; return; }
      this.step = this.questions.length ? 0 : "result";
    }
    answer(qid, value) {
      this.answers[qid] = value;
      if (this.assessment.isUrgent) { this.skippedByUrgent = this.step !== "result" && typeof this.step === "number" && this.step < this.questions.length - 1; this.step = "result"; return; }
      this.next();
    }
    next() {
      if (typeof this.step !== "number") return;
      const qs = this.questions;
      const i = qs.indexOf(this.current);
      this.step = i + 1 < qs.length ? i + 1 : "result";
    }
    back() {
      if (this.step === "result") { this.step = this.questions.length ? this.questions.length - 1 : (this.parts.danger.length ? "danger" : 0); return; }
      if (typeof this.step === "number") { this.step = this.step > 0 ? this.step - 1 : (this.parts.danger.length ? "danger" : 0); }
    }
    goTo(qid) {
      if (this.parts.danger.some(q => q.id === qid)) { this.step = "danger"; return; }
      const i = this.questions.findIndex(q => q.id === qid);
      if (i >= 0) this.step = i;
    }
    get reviewRows() {
      const all = this.checker.visibleQuestions(this.answers, this.ctx);
      return all.filter(q => this.answers[q.id] !== undefined && this.answers[q.id] !== "").map(q => ({ q, label: CheckerSession.answerLabel(q, this.answers[q.id]) }));
    }
    static answerLabel(q, v) {
      if (q.type === "yn") return v === "ya" ? "Ya" : v === "tidak" ? "Tidak" : "Tidak tahu";
      if (q.type === "choice") { const o = q.options.find(x => x.v === v); return o ? o.label : v; }
      return v + (q.unit ? " " + q.unit : "");
    }
  }

  /** Penghitung napas 60 detik. Ambang WHO per usia. */
  class BreathCounter {
    constructor(onTick, onDone) { this.onTick = onTick; this.onDone = onDone; this.reset(); }
    reset() { clearInterval(this.timer); this.running = false; this.left = 60; this.count = 0; this.done = false; }
    start() {
      this.reset(); this.running = true;
      const t0 = Date.now();
      this.timer = setInterval(() => {
        this.left = Math.max(0, 60 - Math.floor((Date.now() - t0) / 1000));
        if (this.left <= 0) { clearInterval(this.timer); this.running = false; this.done = true; this.onDone(); } else this.onTick();
      }, 250);
    }
    tap() { if (this.running) this.count++; }
    static threshold(days) {
      if (days === null) return null;
      if (days <= 28) return { min: 61, label: "lebih dari 60×/menit", src: ["who_newborn"], level: 4 };
      if (days < 60) return null;
      if (days < 365) return { min: 50, label: "50×/menit atau lebih", src: ["who_imci_pneu"], level: 3 };
      if (days <= 1825) return { min: 40, label: "40×/menit atau lebih", src: ["who_imci_pneu"], level: 3 };
      return null;
    }
  }

  /** Versi online: database artifak claude.ai, tanya Claude, persetujuan usulan. */
  class CloudSource extends DataSource {
    constructor(kb, claude) { super(kb); this.claude = claude; this.db = null; this.sample = null; this.downloads = null; this.editor = false; }
    get mode() { return "db"; }
    get canAsk() { return !!this.sample; }
    get canApprove() { return this.editor; }
    get canExport() { return !!this.downloads; }
    async start(onReady, onFail) {
      const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map(n => this.claude.use(n)));
      this.db = db; this.sample = sample; this.downloads = downloads;
      this.editor = user ? await user.canEdit().catch(() => false) : false;
      if (!db) { onFail(); return; }
      const kb = this.kb, pending = new Set(["sources", "checkers", "guides", "milestones", "obat", "changelog", "usulan", "meta", "imunisasi"]);
      let ready = false;
      const timer = setTimeout(() => { if (!ready) onFail(); }, 10000);
      const settle = key => { pending.delete(key); if (!pending.size && !ready) { ready = true; clearTimeout(timer); } if (ready) onReady(); };
      const fail = () => { clearTimeout(timer); onFail(); };
      const coll = (name, apply) => db.collection(name).onSnapshot(s => { apply(s.docs.map(d => ({ ...d.data(), _id: d.id }))); settle(name); }, fail);
      coll("sources", docs => { kb.sources = Object.fromEntries(docs.map(d => { const { _id, ...r } = d; return [_id, r]; })); });
      coll("checkers", docs => { kb.checkers = docs; });
      coll("guides", docs => { kb.guides = docs; });
      coll("milestones", docs => { kb.milestones = docs; });
      coll("obat", docs => { kb.obat = docs; });
      coll("changelog", docs => { kb.changelog = docs; });
      coll("usulan", docs => { kb.usulan = docs; });
      db.doc("kb/meta").onSnapshot(s => { kb.meta = s.exists ? s.data() : null; settle("meta"); }, fail);
      db.doc("kb/imunisasi").onSnapshot(s => { kb.imunisasi = s.exists ? s.data() : null; settle("imunisasi"); }, fail);
    }
    async ask(question, ageDays, onText, signal) {
      const prompt = new AskPrompt(this.kb, ageDays).build(question);
      return this.sample(prompt, { signal, cache: false, onText });
    }
    async approve(u) {
      const coll = u.target && u.target.collection, id = u.target && u.target.id;
      if (!["checkers", "guides", "milestones", "obat", "kb", "sources"].includes(coll) || !u.patch) throw new Error("Target usulan tidak dikenali.");
      const trial = JSON.parse(JSON.stringify(this.kb.snapshot()));
      Object.assign(trial.sources, u.newSources || {});
      const put = (arr) => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = u.patch; else arr.push(u.patch); };
      if (coll === "sources") trial.sources[id] = u.patch;
      else if (coll === "kb" && id === "imunisasi") trial.imunisasi = u.patch;
      else if (trial[coll]) put(trial[coll]);
      const errs = KnowledgeValidator.validate(trial);
      if (errs.length) throw new Error("Ditolak otomatis: " + errs[0]);
      for (const [sid, s] of Object.entries(u.newSources || {})) await this.db.doc("sources/" + sid).set(s);
      await this.db.doc(coll + "/" + id).set(u.patch);
      const d = Clock.today(), stamp = d.replace(/-/g, ".");
      const v = (this.kb.meta && this.kb.meta.version) || "";
      const seq = v.startsWith(stamp) ? parseInt(v.split("-")[1] || "0", 10) + 1 : 1;
      await this.db.doc("kb/meta").update({ version: stamp + "-" + seq, verifiedDate: d });
      await this.db.doc("changelog/" + d + "-" + Date.now()).set({ date: d, title: u.title || "Pembaruan data", text: u.summary || "", by: "Disetujui pemilik", usulan: u._id });
      await this.db.doc("usulan/" + u._id).update({ status: "disetujui", decidedAt: new Date().toISOString() });
    }
    async reject(u) { await this.db.doc("usulan/" + u._id).update({ status: "ditolak", decidedAt: new Date().toISOString() }); }
    async saveQuestion(q) { await this.db.collection("usulan").add({ type: "pertanyaan", question: q, title: q.slice(0, 140), status: "baru", createdAt: new Date().toISOString() }); }
    get canExportOffline() { return !!this.downloads && !!document.getElementById("offline-tpl"); }
    async exportOffline() {
      const snap = this.kb.snapshot();
      const errs = KnowledgeValidator.validate(snap);
      if (errs.length) throw new Error("Data tidak lolos pemeriksaan: " + errs[0]);
      const tpl = JSON.parse(document.getElementById("offline-tpl").textContent);
      const kbText = JSON.stringify(snap).replace(/</g, "\\u003c");
      const html = tpl.replace("/*KB_" + "EMBED*/", () => kbText);
      await this.downloads.save({ filename: "asisten-bayi-offline-" + snap.meta.version + ".html", data: html });
    }
    async exportForApk() {
      const snap = this.kb.snapshot();
      const errs = KnowledgeValidator.validate(snap);
      if (errs.length) throw new Error("Data tidak lolos pemeriksaan: " + errs[0]);
      await this.downloads.save({ filename: "asisten-bayi-data-" + snap.meta.version + ".json", data: JSON.stringify(snap) });
    }
  }

  /** Jembatan ke kode Java di aplikasi Android. */
  class AndroidBridge {
    constructor(native) { this.native = native; this.seq = 0; this.cbs = {}; window.__androidCb = (id, ok, text) => { const f = this.cbs[id]; delete this.cbs[id]; if (f) f(ok, text); }; }
    call(method, arg) { return new Promise(resolve => { const id = ++this.seq; this.cbs[id] = (ok, text) => resolve({ ok, text }); if (arg === undefined) this.native[method](id); else this.native[method](arg, id); }); }
    getKb() { return this.native.getKb(); }
    save(text) { return this.native.save(text); }
    getUrl() { return this.native.getUrl() || ""; }
    setUrl(u) { this.native.setUrl(u); }
    open(url) { this.native.openUrl(url); }
    fetch(url) { return this.call("fetchText", url); }
    pickFile() { return this.call("pickFile"); }
    has(m) { return typeof this.native[m] === "function"; }
    setAdsAllowed(b) { if (this.has("setAdsAllowed")) this.native.setAdsAllowed(!!b); }
    get canTip() { return this.has("canTip") && !!this.native.canTip(); }
    get tipPrice() { return this.has("tipPrice") ? this.native.tipPrice() || "" : ""; }
    tip() { return this.call("tip"); }
    get version() { return this.has("appVersion") ? this.native.appVersion() : ""; }
  }

  /** Aplikasi Android: data tersimpan di perangkat, bisa dipakai tanpa internet. */
  class AndroidSource extends DataSource {
    constructor(kb, bridge) { super(kb); this.bridge = bridge; this.status = ""; }
    get mode() { return "android"; }
    get canUpdateLocal() { return true; }
    start(onReady, onFail) {
      const r = KnowledgeBase.parse(this.bridge.getKb() || "");
      if (r.error) { onFail(); return; }
      this.kb.load(r.kb); onReady();
      this.refresh(true).then(changed => { if (changed) onReady(); });
    }
    accept(text, fromUrl) {
      const r = KnowledgeBase.parse(text);
      if (r.error) { this.status = r.error; return false; }
      const cur = this.kb.meta ? String(this.kb.meta.version) : "";
      if (fromUrl && cur && String(r.kb.meta.version) <= cur) { this.status = "Data sudah terbaru (versi " + cur + ")."; return false; }
      if (!this.bridge.save(text)) { this.status = "Gagal menyimpan data di perangkat."; return false; }
      this.kb.load(r.kb); this.status = "Data diperbarui ke versi " + r.kb.meta.version + "."; return true;
    }
    async refresh(silent) {
      const url = this.bridge.getUrl();
      if (!url) { if (!silent) this.status = "Alamat file data belum diisi. Gunakan Impor file data, atau isi alamatnya."; return false; }
      const res = await this.bridge.fetch(url);
      if (!res.ok) { if (!silent) this.status = "Tidak bisa mengambil data: " + res.text; return false; }
      const before = this.status, changed = this.accept(res.text, true);
      if (silent && !changed) this.status = before;
      return changed;
    }
    async importFile() { const res = await this.bridge.pickFile(); if (!res.ok) { if (res.text) this.status = res.text; return false; } return this.accept(res.text, false); }
  }

  /** File lokal / peramban biasa: data tertanam di file, bisa diganti dengan impor file data. */
  class StaticSource extends DataSource {
    constructor(kb) { super(kb); this.status = ""; this.origin = ""; }
    get canUpdateLocal() { return true; }
    static embedded() { const el = document.getElementById("kb-embed"); return el ? el.textContent.trim() : ""; }
    static stored() { try { return localStorage.getItem("ab.kb") || ""; } catch (e) { return ""; } }
    start(onReady, onFail) {
      const pick = (...texts) => {
        let best = null;
        texts.forEach(([t, origin]) => { if (!t) return; const r = KnowledgeBase.parse(t); if (!r.error && (!best || String(r.kb.meta.version) > String(best.kb.meta.version))) best = { kb: r.kb, origin }; });
        return best;
      };
      const finish = best => { if (!best) { onFail(); return; } this.kb.load(best.kb); this.origin = best.origin; onReady(); };
      const local = pick([StaticSource.embedded(), "tertanam"], [StaticSource.stored(), "impor"]);
      if (local) { finish(local); return; }
      fetch("kb.json").then(r => (r.ok ? r.text() : "")).then(t => finish(pick([t, "kb.json"]))).catch(onFail);
    }
    importFile() {
      return new Promise(resolve => {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".json,application/json";
        inp.onchange = () => {
          const f = inp.files && inp.files[0];
          if (!f) { resolve(false); return; }
          const rd = new FileReader();
          rd.onload = () => {
            const r = KnowledgeBase.parse(String(rd.result));
            if (r.error) { this.status = r.error; resolve(false); return; }
            try { localStorage.setItem("ab.kb", String(rd.result)); } catch (e) { this.status = "Data terbaca, tetapi peramban ini tidak mengizinkan penyimpanan. Data hanya berlaku sampai halaman ditutup."; }
            this.kb.load(r.kb); this.origin = "impor";
            if (!this.status) this.status = "Data diperbarui ke versi " + r.kb.meta.version + ".";
            resolve(true);
          };
          rd.onerror = () => { this.status = "File tidak bisa dibaca."; resolve(false); };
          rd.readAsText(f);
        };
        inp.click();
      });
    }
  }

  /** Prompt "Tanya": Claude hanya boleh menjawab dari database. */
  class AskPrompt {
    constructor(kb, ageDays) { this.kb = kb; this.ageDays = ageDays; }
    database() {
      const kb = this.kb;
      return {
        sources: Object.fromEntries(Object.entries(kb.sources).map(([k, v]) => [k, (v.type === "sekunder" ? "[sekunder] " : "") + v.title])),
        penilai_gejala: kb.checkers.map(c => ({ id: c.id, judul: c.title, aturan: c.rules.map(r => ({ tingkat: Level.of(r.level).name, teks: r.text, src: r.src })), default: c.default, kemungkinan: c.differentials, perawatan: c.care, naik_tingkat: c.escalate })),
        panduan: kb.guides.map(g => ({ judul: g.title, bagian: g.sections })),
        obat: kb.obat, imunisasi: kb.imunisasi,
        perkembangan: kb.milestones.map(m => ({ usia: m.label, kemampuan: m.d }))
      };
    }
    build(question) {
      const d = this.ageDays;
      return [
        "Anda adalah asisten kesehatan bayi dan anak untuk orang tua di Indonesia. Jawab dalam Bahasa Indonesia yang tenang, jelas, dan sederhana.",
        "ATURAN WAJIB:",
        "1. Jawab HANYA dari DATABASE di bawah, jangan memakai pengetahuan lain. Bila tidak ada di database, tulis persis: \"Belum ada di database terverifikasi aplikasi ini.\" lalu sarankan konsultasi tenaga kesehatan bila menyangkut gejala.",
        "2. Setiap pernyataan fakta diberi kode sumber dalam kurung siku sesuai kunci sources, misalnya [who_newborn]. Jangan mengarang kode.",
        "3. Kalimat pertama adalah pesan utama: tingkat (Umum, Pantau, Periksa hari ini, atau Segera ke IGD) dan apa yang harus dilakukan, sesuai aturan penilai di database. Ikuti jumlah tanda sesuai kriteria; satu tanda yang belum memenuhi kriteria cukup disebut Pantau.",
        "4. Sebut kemungkinan dari yang paling sering, memakai frekuensi alami seperti \"3 dari 10 bayi\". Kondisi langka hanya disebut bila ciri pembedanya ada pada cerita pengguna, selalu dengan angka kejadiannya.",
        "5. Jangan memberi vonis pasti; sebut pemeriksaan yang memastikan bila ada di database. Jangan memberi dosis obat selain yang tertulis di database.",
        "6. Jangan menakut-nakuti; tanpa kata dramatis. Maksimal sekitar 180 kata, kalimat pendek, tanpa tabel.",
        "Usia anak menurut profil: " + (d === null ? "tidak diketahui" : Age.label(d) + " (" + d + " hari)") + ". Tanggal hari ini: " + Clock.today() + ".",
        "DATABASE (JSON):", JSON.stringify(this.database()),
        "PERTANYAAN ORANG TUA:", question.trim()
      ].join("\n");
    }
  }

  class CheckerView extends View {
    constructor(app) { super(app); this.sessions = {}; this.id = null; }
    session(id) {
      const checker = this.kb.checker(id);
      if (!checker) return null;
      let s = this.sessions[id];
      if (!s || s.checker.def !== checker.def) { const old = s; s = this.sessions[id] = new CheckerSession(checker, this.profile); if (old) { s.answers = old.answers; s.step = old.step; } }
      return s;
    }
    render(id) {
      this.id = id;
      const s = this.session(id);
      if (!s) return this.page('<p>Keluhan ini belum ada di database.</p>' + Html.back("cek", "Semua keluhan"));
      const def = s.checker.def;
      let body = Html.back("cek", "Semua keluhan") + "<h1>" + Html.esc(def.title) + "</h1>";
      if (def.needsAge && !this.profile.hasAge) body += '<div class="banner warn">Usia anak belum diisi, padahal beberapa kriteria bergantung pada usia. <a href="#profil">Isi tanggal lahir</a></div>';
      if (s.step === "result") body += this.result(s);
      else if (s.step === "danger") body += this.progress(s) + this.dangerStep(s);
      else body += this.progress(s) + this.questionStep(s);
      return this.page(body);
    }
    progress(s) {
      const pct = Math.round((s.position - 1) / Math.max(1, s.total) * 100);
      return '<div class="progress"><span class="small muted">Langkah ' + s.position + " dari " + s.total + '</span><div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div></div>';
    }
    dangerStep(s) {
      const qs = s.parts.danger, n = s.dangerSelected;
      return '<div class="card stack"><div class="stack-s"><p class="qbig">Pertama, adakah salah satu tanda ini?</p><p class="small muted">Ketuk yang ada. Tanda-tanda ini dicek lebih dulu karena masing-masing sudah cukup untuk segera mencari pertolongan.</p></div>' +
        '<div class="answers">' + qs.map(q => '<button type="button" class="toggle" data-danger="' + Html.esc(q.id) + '" aria-pressed="' + (s.answers[q.id] === "ya") + '"><span class="box" aria-hidden="true"></span><span>' + Html.esc(q.text) + "</span></button>").join("") + "</div>" +
        '<button type="button" class="btn-primary" data-act="danger-ok">' + (n ? "Lihat hasil" : "Tidak ada, lanjut") + "</button></div>";
    }
    questionStep(s) {
      const q = s.current;
      if (!q) return "";
      const v = s.answers[q.id];
      let ctl;
      if (q.type === "yn") {
        const opts = [["ya", "Ya"], ["tidak", "Tidak"]].concat(q.allowUnknown ? [["tdk-tahu", "Tidak tahu"]] : []);
        ctl = '<div class="answers">' + opts.map(([val, l]) => '<button type="button" data-ans="' + Html.esc(q.id) + '" data-v="' + val + '" aria-pressed="' + (v === val) + '">' + l + "</button>").join("") + "</div>";
      } else if (q.type === "choice") {
        ctl = '<div class="answers">' + q.options.map(o => '<button type="button" data-ans="' + Html.esc(q.id) + '" data-v="' + Html.esc(o.v) + '" aria-pressed="' + (v === o.v) + '">' + Html.esc(o.label) + "</button>").join("") + "</div>";
      } else {
        ctl = '<form class="stack-s" data-form="num"><div class="num-in"><input id="num-' + Html.esc(q.id) + '" inputmode="decimal" value="' + Html.esc(v || "") + '" aria-label="' + Html.esc(q.text) + '"><span class="muted">' + Html.esc(q.unit || "") + '</span></div><div class="row"><button class="btn-primary" type="submit">Lanjut</button>' + (q.optional ? '<button type="button" data-act="skip">Lewati</button>' : "") + "</div></form>";
      }
      return '<div class="card stack"><label class="qbig"' + (q.type === "number" ? ' for="num-' + Html.esc(q.id) + '"' : "") + ">" + Html.esc(q.text) + "</label>" + (q.help ? '<p class="small muted">' + Html.esc(q.help) + "</p>" : "") + ctl + "</div>" +
        '<div class="navrow"><button type="button" class="btn-ghost" data-act="back">‹ Kembali</button>' + (q.type === "yn" ? '<button type="button" class="btn-ghost" data-act="skip">Lewati</button>' : "") + "</div>";
    }
    result(s) {
      const r = s.assessment, lv = r.levelInfo;
      const main = r.summary || (r.reasons[0] && r.reasons[0].text) || "";
      const mainSrc = r.summary ? r.summarySrc : (r.reasons[0] ? r.reasons[0].src : []);
      // Pesan utama di atas (CDC Clear Communication Index): tingkat, tindakan, lalu alasannya.
      let h = '<div class="result r-' + r.level + '" aria-live="polite"><div class="stack-s">' + Html.levelChip(r.level) + "<h2>" + Html.esc(lv.action) + "</h2>" +
        (r.summary && r.headline !== lv.name ? '<p class="eyebrow">' + Html.esc(r.headline) + "</p>" : "") +
        '<p class="main-msg">' + Html.esc(main) + "</p>" + this.sources(mainSrc) + "</div></div>";
      if (s.skippedByUrgent) h += '<p class="small muted">Pertanyaan lain dilewati karena sudah ada tanda yang perlu segera ditangani.</p>';
      const more = r.reasons.slice(1);
      if (more.length) h += '<div class="card stack-s"><h3>Alasan lain</h3>' + more.map(x => "<div><p>" + Html.esc(x.text) + "</p>" + this.sources(x.src) + "</div>").join("") + "</div>";
      r.notes.forEach(n => { h += '<div class="banner"><p>' + Html.esc(n.text) + "</p>" + this.sources(n.src) + "</div>"; });
      if (!r.isUrgent) {
        if (r.differentials.length) h += '<div class="card stack-s"><h3>Kemungkinan, dari yang paling sering</h3>' +
          r.differentials.map(d => '<div class="diff"><p class="diff-h"><strong>' + Html.esc(d.name) + '</strong><span class="freq">' + Html.esc(d.freq) + "</span></p><p class=\"small\">" + Html.esc(d.features) + "</p>" + this.sources(d.src) + "</div>").join("") + "</div>";
        if (r.care.length) h += '<div class="card stack-s"><h3>Yang bisa dilakukan sekarang</h3><ul class="items">' + r.care.map(x => "<li>" + Html.esc(x.t) + this.sources(x.src) + "</li>").join("") + "</ul></div>";
        if (r.escalate.length) h += '<div class="card stack-s"><h3>Periksakan bila kemudian muncul</h3><ul class="items">' + r.escalate.map(x => "<li>" + Html.esc(x) + "</li>").join("") + "</ul></div>";
      }
      const rows = s.reviewRows;
      h += '<div class="card"><details class="review"><summary>Jawaban Anda (' + rows.length + ")</summary>" +
        rows.map(x => '<div class="review-row"><div><p class="small">' + Html.esc(x.q.text) + '</p><p class="small"><strong>' + Html.esc(x.label) + '</strong></p></div><button type="button" data-goto="' + Html.esc(x.q.id) + '">Ubah</button></div>').join("") + "</details></div>";
      h += '<div class="navrow"><button type="button" class="btn-ghost" data-act="back">‹ Kembali</button><button type="button" data-act="restart">Mulai ulang</button></div>';
      h += '<p class="small muted">Hasil ini berupa kemungkinan berdasarkan kriteria resmi, bukan vonis.' + (r.level <= 2 ? " Bila Anda tetap khawatir, periksakan anak meski hasilnya hijau atau kuning." : "") + "</p>";
      return h;
    }
    onClick(t) {
      const s = this.id && this.sessions[this.id];
      if (!s) return false;
      if (t.dataset.danger) { s.toggleDanger(t.dataset.danger); return true; }
      if (t.dataset.ans) { s.answer(t.dataset.ans, t.dataset.v); window.scrollTo(0, 0); return true; }
      if (t.dataset.goto) { s.goTo(t.dataset.goto); return true; }
      const act = t.dataset.act;
      if (act === "danger-ok") { s.confirmDanger(); window.scrollTo(0, 0); return true; }
      if (act === "back") { s.back(); return true; }
      if (act === "skip") { s.next(); return true; }
      if (act === "restart") { s.reset(); return true; }
      return false;
    }
    onSubmit(form) {
      const s = this.id && this.sessions[this.id];
      if (!s || form.dataset.form !== "num" || !s.current) return false;
      const val = form.querySelector("input").value.trim();
      if (val === "") { s.next(); return true; }
      s.answer(s.current.id, val); return true;
    }
    prefill(id, qid, value) { const s = this.session(id); if (s) s.answers[qid] = value; }
  }

  class BreathView extends View {
    constructor(app) {
      super(app);
      this.counter = new BreathCounter(() => this.tick(), () => this.app.render());
    }
    tick() {
      const l = document.getElementById("b-left"); if (l) l.textContent = this.counter.left + " detik";
      const fg = document.querySelector(".ring .c-fg");
      if (fg) { const C = 2 * Math.PI * 52; fg.setAttribute("stroke-dashoffset", (C - C * (this.counter.left / 60)).toFixed(1)); }
    }
    render() {
      const c = this.counter, d = this.profile.ageDays, th = BreathCounter.threshold(d);
      const C = 2 * Math.PI * 52, off = C * (c.left / 60);
      let res = "";
      if (c.done) {
        const fast = th && c.count >= th.min;
        res = '<div class="result r-' + (fast ? th.level : 1) + '"><div class="stack-s"><h2>' + c.count + "×/menit</h2>" +
          (th ? "<p>" + (fast ? "Di atas ambang napas cepat WHO untuk usia ini (" + Html.esc(th.label) + ")." : "Di bawah ambang napas cepat WHO untuk usia ini (" + Html.esc(th.label) + ").") + "</p>" + this.sources(th.src)
            : '<p class="muted">Aplikasi belum punya ambang terverifikasi untuk usia ini' + (d === null ? " (usia belum diisi)" : "") + ".</p>") +
          '<button type="button" class="btn-primary" data-act="use-rr">Lanjut ke penilaian batuk & napas</button></div></div>';
      }
      return this.page("<h1>Hitung napas</h1>" +
        '<p class="muted">Hitung saat anak tenang atau tidur, tidak sedang menangis. Satu kali perut atau dada naik-turun = satu napas. Ketuk tombol besar setiap satu napas selama 60 detik.</p>' +
        '<div class="card counter"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="c-bg" cx="60" cy="60" r="52"/><circle class="c-fg" cx="60" cy="60" r="52" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C - off).toFixed(1) + '"/></svg>' +
        '<div class="mid"><span class="big" id="b-count" aria-live="polite">' + c.count + '</span><span class="muted small" id="b-left">' + (c.running ? c.left + " detik" : c.done ? "selesai" : "60 detik") + "</span></div></div>" +
        (c.running ? '<button class="btn-primary tap" data-act="tap" type="button">Napas</button><button type="button" class="btn-ghost" data-act="cancel">Batalkan</button>'
          : '<button class="btn-primary tap" data-act="start" type="button">' + (c.done ? "Hitung ulang" : "Mulai 60 detik") + "</button>") +
        "</div>" + res + (th ? '<p class="small muted">Ambang napas cepat WHO untuk usia ' + Html.esc(Age.label(d)) + ": " + Html.esc(th.label) + ".</p>" : ""));
    }
    onClick(t) {
      const a = t.dataset.act;
      if (a === "start") { this.counter.start(); return true; }
      if (a === "tap") { this.counter.tap(); const el = document.getElementById("b-count"); if (el) el.textContent = this.counter.count; return "keep"; }
      if (a === "cancel") { this.counter.reset(); return true; }
      if (a === "use-rr") { this.app.views.checker.prefill("napas", "rr", String(this.counter.count)); location.hash = "#cek-napas"; return "keep"; }
      return false;
    }
  }

  class AskView extends View {
    constructor(app) { super(app); this.q = ""; this.text = ""; this.busy = false; this.err = ""; this.ctl = null; }
    linkify(t) {
      const short = s => { const i = s.indexOf(" — "); return i > 0 ? s.slice(0, i) : s; };
      return Html.esc(t).replace(/\[([a-z0-9_]+)\]/g, (m, id) => { const s = this.kb.source(id); return s ? '<a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">[' + Html.esc(short(s.title)) + "]</a>" : m; });
    }
    render() {
      if (!(this.source instanceof CloudSource)) return this.page('<h1>Tanya</h1><div class="card stack-s"><p>Fitur tanya dijawab Claude dan hanya tersedia di versi online.</p>' + this.app.views.data.onlineLink() + "</div>");
      return this.page("<h1>Tanya</h1>" +
        '<p class="muted">Dijawab Claude hanya dari isi database aplikasi ini, dengan sumbernya. Bila jawabannya belum ada, Claude akan bilang begitu, dan pertanyaan Anda bisa dicatat untuk diriset.</p>' +
        (this.source.canAsk ? "" : '<div class="banner warn">Fitur tanya membutuhkan izin Claude di halaman ini dan belum tersedia di tampilan ini.</div>') +
        '<form data-form="ask" class="card stack"><label for="t-q">Pertanyaan</label><textarea id="t-q" placeholder="Contoh: bayi 2 minggu gumoh setelah menyusu tapi masih lapar, perlu ke dokter?">' + Html.esc(this.q) + "</textarea>" +
        '<div class="row"><button class="btn-primary" type="submit"' + (this.busy || !this.source.canAsk ? " disabled" : "") + ">" + (this.busy ? "Menjawab…" : "Tanya") + "</button>" + (this.busy ? '<button type="button" data-act="stop">Hentikan</button>' : "") + "</div></form>" +
        (this.err ? '<div class="banner warn">' + Html.esc(this.err) + "</div>" : "") +
        (this.text ? '<div class="card stack-s"><p class="eyebrow">Jawaban</p><div class="answer" id="t-ans">' + this.linkify(this.text) + "</div>" + (this.busy ? "" : '<div class="row"><button type="button" data-act="save-q">Catat untuk diriset</button></div>') + "</div>" : ""));
    }
    onInput(t) { if (t.id === "t-q") this.q = t.value; }
    onSubmit(form) { if (form.dataset.form !== "ask") return false; this.q = form.querySelector("textarea").value; this.ask(); return true; }
    async ask() {
      if (!this.q.trim() || this.busy) return;
      this.busy = true; this.text = ""; this.err = ""; this.app.render();
      this.ctl = new AbortController();
      try {
        const out = await this.source.ask(this.q, this.profile.ageDays, ({ text }) => { this.text = text; const el = document.getElementById("t-ans"); if (el) el.innerHTML = this.linkify(text); else this.app.render(); }, this.ctl.signal);
        this.text = out.text + (out.truncated ? "\n\n(Jawaban terpotong. Coba pertanyaan yang lebih spesifik.)" : "");
      } catch (e) {
        const c = e && e.code;
        this.err = c === "not_granted" ? "Izin untuk Claude di halaman ini ditolak, jadi fitur tanya tidak bisa dipakai di tampilan ini." : c === "rate_limited" ? "Terlalu banyak pertanyaan dalam waktu singkat. Coba lagi beberapa saat lagi." : c === "cancelled" ? "" : "Jawaban gagal dimuat. Periksa koneksi lalu coba lagi.";
      }
      this.busy = false; this.app.render();
    }
    async onClick(t) {
      if (t.dataset.act === "stop") { if (this.ctl) this.ctl.abort(); return "keep"; }
      if (t.dataset.act === "save-q") {
        try { await this.source.saveQuestion(this.q.trim()); Toast.show("Dicatat. Akan diriset pada pemeriksaan berikutnya."); }
        catch (e) { Toast.show(e && e.code === "permission_denied" ? "Anda tidak punya izin mencatat pertanyaan." : "Gagal mencatat."); }
        return "keep";
      }
      return false;
    }
  }
