    }
  }

  class MilestoneView extends View {
    constructor(app) { super(app); this.tab = null; }
    render() {
      const ms = this.kb.milestones.slice().sort((a, b) => a.months - b.months);
      if (!ms.length) return this.page("<p>Data perkembangan belum ada.</p>");
      const d = this.profile.ageDays, ageM = d === null ? null : d / 30.4375;
      if (!this.tab) { const cur = ageM === null ? ms[0] : ms.filter(m => m.months <= ageM + 0.01).pop() || ms[0]; this.tab = cur.id; }
      const m = ms.find(x => x.id === this.tab) || ms[0];
      const checked = LocalStore.get("ab.ms", {});
      const names = { sosial: "Sosial & emosi", bahasa: "Bahasa & komunikasi", kognitif: "Belajar & berpikir", gerak: "Gerak & fisik" };
      const all = Object.values(m.d).flat(), done = all.filter(t => checked[m.id + "|" + t]).length;
      const isAgeTab = ageM !== null && m.months <= ageM + 0.01;
      return this.page(Html.back("lainnya", "Lainnya") + "<h1>Perkembangan</h1>" +
        '<p class="muted">Daftar CDC 2022 berisi kemampuan yang dicapai paling sedikit 3 dari 4 anak pada usia tersebut. Bila anak belum mencapai salah satunya, sampaikan ke dokter saat kontrol.</p>' + this.sources(["cdc_milestones"]) +
        '<div class="tabs" role="group" aria-label="Usia">' + ms.map(x => '<button type="button" data-ms="' + Html.esc(x.id) + '" aria-pressed="' + (x.id === m.id) + '">' + Html.esc(x.label) + "</button>").join("") + "</div>" +
        '<div class="card stack-s"><div class="row" style="justify-content:space-between"><h2>' + Html.esc(m.label) + '</h2><span class="muted small">' + done + " dari " + all.length + " tercapai</span></div>" +
        Object.keys(names).filter(k => m.d[k] && m.d[k].length).map(k => '<div><p class="eyebrow" style="margin-top:8px">' + names[k] + "</p>" +
          m.d[k].map((t, i) => { const id = "ms-" + m.id + "-" + k + "-" + i; return '<div class="check"><input type="checkbox" id="' + id + '" data-mscheck="' + Html.esc(m.id + "|" + t) + '"' + (checked[m.id + "|" + t] ? " checked" : "") + '><label for="' + id + '">' + Html.esc(t) + "</label></div>"; }).join("") + "</div>").join("") + "</div>" +
        (isAgeTab && done < all.length ? '<div class="banner">Ada ' + (all.length - done) + " kemampuan yang belum dicentang. Itu belum berarti ada masalah; dokter akan menilainya dengan alat skrining resmi. Bila anak kehilangan kemampuan yang sebelumnya sudah bisa, konsultasikan lebih cepat.</div>" : "") +
        '<p class="small muted">Anak lahir prematur dinilai dengan usia koreksi.</p>');
    }
    onClick(t) { if (t.dataset.ms) { this.tab = t.dataset.ms; return true; } return false; }
    onChange(t) { if (t.dataset.mscheck) { const c = LocalStore.get("ab.ms", {}); if (t.checked) c[t.dataset.mscheck] = true; else delete c[t.dataset.mscheck]; LocalStore.set("ab.ms", c); return true; } return false; }
  }

  class ImmunizationView extends View {
    render() {
      const im = this.kb.imunisasi;
      if (!im) return this.page("<p>Jadwal imunisasi belum ada.</p>");
      return this.page(Html.back("lainnya", "Lainnya") + '<h1>Imunisasi</h1><div class="banner warn">' + Html.esc(im.note) + "</div>" +
        '<div class="card">' + Html.table({ head: ["Usia", "Vaksin"], rows: im.rows }) + this.sources(im.src) + "</div>" +
        '<div class="card stack-s"><h3>Vitamin A (gratis)</h3><p>Setiap Februari dan Agustus di posyandu atau puskesmas. Kapsul biru untuk 6–11 bulan, kapsul merah untuk 12–59 bulan.</p>' + this.sources(["kemenkes_vita"]) + "</div>");
    }
  }

  class MedicineView extends View {
    render() {
      const names = { hindari: "Hindari", dokter: "Lewat dokter", info: "Info", program: "Program resmi" };
      const cls = { hindari: "lv-3", program: "lv-1" };
      return this.page(Html.back("lainnya", "Lainnya") + "<h1>Keamanan obat</h1>" +
        '<p class="muted">Berisi obat yang perlu dihindari pada usia tertentu dan dosis program kesehatan resmi. Dosis obat umum seperti paracetamol sengaja tidak dimuat karena bergantung berat badan dan sediaan; ikuti label, apoteker, atau dokter.</p>' +
        this.kb.byOrder(this.kb.obat).map(o => '<div class="card stack-s"><div class="row" style="justify-content:space-between"><h3>' + Html.esc(o.name) + '</h3><span class="lv ' + (cls[o.status] || "lv-2") + '">' + Html.esc(names[o.status] || o.status) + "</span></div>" +
          '<p class="small muted">Usia: ' + Html.esc(o.age) + "</p><p>" + Html.esc(o.t) + "</p>" + this.sources(o.src) + "</div>").join(""));
    }
  }

  class ProfileView extends View {
    render() {
      return this.page(Html.back("lainnya", "Lainnya") + "<h1>Profil anak</h1>" +
        '<form data-form="profil" class="card stack"><div class="stack-s"><label for="p-nama">Nama panggilan (opsional)</label><input id="p-nama" value="' + Html.esc(this.profile.name) + '" autocomplete="off"></div>' +
        '<div class="stack-s"><label for="p-lahir">Tanggal lahir</label><input id="p-lahir" type="date" max="' + Clock.today() + '" value="' + Html.esc(this.profile.birth) + '"></div>' +
        '<button class="btn-primary" type="submit">Simpan</button></form><p class="small muted">Disimpan di perangkat ini saja, dipakai untuk menghitung usia pada setiap penilaian.</p>');
    }
    onSubmit(form) {
      if (form.dataset.form !== "profil") return false;
      this.profile.save(form.querySelector("#p-nama").value.trim(), form.querySelector("#p-lahir").value);
      this.app.views.milestone.tab = null; Toast.show("Profil disimpan."); location.hash = "#beranda"; return true;
    }
  }

  class DataView extends View {
    onlineLink() {
      return this.source instanceof AndroidSource ? '<button type="button" data-act="online">Buka versi online</button>' : '<a href="' + ONLINE_URL + '" target="_blank" rel="noopener">Buka versi online</a>';
    }
    modeBlock() {
      const src = this.source;
      if (src instanceof CloudSource) {
        return '<div class="card stack-s"><h3>Versi offline</h3><p class="small">Satu file HTML dengan tampilan yang sama dan data saat ini sudah tertanam di dalamnya. Simpan di HP, lalu buka dengan Chrome; bisa dipakai tanpa internet. Fitur Tanya dan persetujuan usulan tetap hanya di versi online.</p>' +
          '<div class="row"><button type="button" class="btn-primary" data-act="export-offline"' + (src.canExportOffline ? "" : " disabled") + ">Unduh versi offline</button></div></div>" +
          '<div class="card stack-s"><h3>Data untuk aplikasi Android</h3><p class="small">Aplikasi Android menyimpan salinan data supaya tetap bisa dipakai tanpa internet. Setelah menyetujui usulan, unduh data terbaru, lalu di aplikasi Android buka Lainnya → Sumber & pembaruan → Impor file data.</p>' +
          '<div class="row"><button type="button" data-act="export"' + (src.canExport ? "" : " disabled") + ">Unduh data untuk APK</button></div>" + (src.canExport ? "" : '<p class="small muted">Unduhan tidak tersedia di tampilan ini.</p>') + "</div>";
      }
      if (src instanceof AndroidSource) {
        return '<div class="card stack"><h3>Perbarui data di perangkat ini</h3>' + (src.status ? '<div class="banner">' + Html.esc(src.status) + "</div>" : "") +
          '<div class="stack-s"><label for="k-url">Alamat file data (opsional)</label><input id="k-url" inputmode="url" placeholder="https://raw.githubusercontent.com/…/kb.json" value="' + Html.esc(src.bridge.getUrl()) + '"><p class="small muted">Bila diisi, aplikasi memeriksa data baru di alamat ini setiap kali dibuka.</p></div>' +
          '<div class="row"><button type="button" class="btn-primary" data-act="refresh">Periksa pembaruan</button><button type="button" data-act="import">Impor file data</button></div>' +
          '<p class="small">Tanya dan persetujuan usulan ada di versi online. ' + this.onlineLink() + '</p><p class="small muted">Data baru selalu diperiksa dulu; file yang memuat pernyataan tanpa sumber ditolak.</p></div>';
      }
      return '<div class="card stack-s"><h3>Versi offline</h3>' + (src.status ? '<div class="banner">' + Html.esc(src.status) + "</div>" : "") +
        '<p class="small">Data ' + (src.origin === "impor" ? "dari file yang Anda impor" : "tertanam di file ini") + '. Untuk data terbaru, buka versi online lalu unduh ulang versi offline, atau impor file data dari sana.</p>' +
        '<div class="row"><button type="button" data-act="import">Impor file data</button></div><p class="small">' + this.onlineLink() + '</p><p class="small muted">Data baru selalu diperiksa dulu; file yang memuat pernyataan tanpa sumber ditolak.</p></div>';
    }
    usulan(u, actionable) {
      const kind = u.type === "pertanyaan" ? "Pertanyaan untuk diriset" : "Pembaruan data";
      const st = { disetujui: "Disetujui", ditolak: "Ditolak", diriset: "Sudah diriset" }[u.status] || "Baru";
      return '<div class="card stack-s"><div class="row" style="justify-content:space-between"><span class="eyebrow">' + kind + '</span><span class="small muted">' + st + " · " + Html.esc(String(u.createdAt || "").slice(0, 10)) + "</span></div>" +
        "<p><strong>" + Html.esc(u.title || u.question || "") + "</strong></p>" + (u.summary ? '<p class="small">' + Html.esc(u.summary) + "</p>" : "") + (u.catatan ? '<p class="small muted">' + Html.esc(u.catatan) + "</p>" : "") +
        (Array.isArray(u.sources) && u.sources.length ? '<p class="src">Sumber: ' + u.sources.map(s => '<a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">' + Html.esc(s.title) + "</a>").join(" · ") + "</p>" : "") +
        (actionable && this.source.canApprove ? '<div class="row">' + (u.type !== "pertanyaan" && u.target ? '<button class="btn-primary" type="button" data-approve="' + Html.esc(u._id) + '">Setujui</button>' : "") + '<button type="button" data-reject="' + Html.esc(u._id) + '">' + (u.type === "pertanyaan" ? "Hapus dari antrean" : "Tolak") + "</button></div>" : "") + "</div>";
    }
    render() {
      const kb = this.kb, m = kb.meta, cloud = this.source instanceof CloudSource;
      const us = kb.usulan.slice().sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
      const pend = us.filter(u => u.status === "baru"), done = us.filter(u => u.status !== "baru").slice(0, 10);
      const log = kb.changelog.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const srcs = Object.entries(kb.sources).sort((a, b) => a[1].title.localeCompare(b[1].title));
      return this.page(Html.back("lainnya", "Lainnya") + "<h1>Sumber & pembaruan</h1>" +
        (m ? '<div class="card stack-s"><p><strong>Versi data ' + Html.esc(m.version) + '</strong></p><p class="small muted">Diverifikasi ' + Html.esc(m.verifiedDate) + " · pemeriksaan sumber terakhir " + Html.esc(m.lastCheck || "-") + '</p><p class="small">' + Html.esc(m.note || "") + "</p></div>" : "") +
        this.modeBlock() +
        '<div class="card stack-s"><h3>Cara data diperbarui</h3><ul class="items small"><li>Setiap tanggal 1, Claude memeriksa pedoman terbaru dari IDAI, Kemenkes, WHO, AAP, CDC, dan FDA, lalu menulis usulan perubahan beserta sumbernya.</li><li>Usulan tidak langsung mengubah data. Pemilik meninjau dan menyetujui; usulan yang memuat pernyataan tanpa sumber ditolak otomatis.</li><li>Pertanyaan yang belum terjawab di menu Tanya bisa dicatat untuk diriset.</li></ul></div>' +
        (cloud ? '<div class="stack-s"><h2>Usulan menunggu (' + pend.length + ")</h2>" + (pend.length ? pend.map(u => this.usulan(u, true)).join("") : '<p class="muted small">Tidak ada usulan baru.</p>') + "</div>" + (done.length ? '<div class="stack-s"><h3>Usulan yang sudah diputuskan</h3>' + done.map(u => this.usulan(u, false)).join("") + "</div>" : "") : "") +
        '<div class="stack-s"><h2>Riwayat perubahan</h2><div class="card stack-s">' + (log.length ? log.map(l => "<div><p><strong>" + Html.esc(l.title) + '</strong> <span class="muted small">' + Html.esc(l.date) + '</span></p><p class="small">' + Html.esc(l.text) + "</p></div>").join("") : '<p class="muted small">Belum ada.</p>') + "</div></div>" +
        '<div class="stack-s"><h2>Daftar sumber (' + srcs.length + ')</h2><div class="card"><ul class="items small">' + srcs.map(([id, s]) => '<li><a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">' + Html.esc(s.title) + "</a>" + (s.type === "sekunder" ? '<span class="tag">sekunder</span>' : "") + "</li>").join("") + "</ul></div></div>");
    }
    async onClick(t) {
      const src = this.source;
      const run = async (fn, okMsg) => { try { await fn(); if (okMsg) Toast.show(okMsg); } catch (e) { Toast.show((e && e.message) || "Gagal."); } };
      if (t.dataset.approve) { const u = this.kb.usulan.find(x => x._id === t.dataset.approve); if (u) await run(() => src.approve(u), "Disetujui dan diterapkan."); return "keep"; }
      if (t.dataset.reject) { const u = this.kb.usulan.find(x => x._id === t.dataset.reject); if (u) await run(() => src.reject(u), "Usulan ditolak."); return "keep"; }
      const a = t.dataset.act;
      if (a === "export") { await run(() => src.exportForApk(), "Data diunduh."); return "keep"; }
      if (a === "export-offline") { await run(() => src.exportOffline(), "Versi offline diunduh."); return "keep"; }
      if (a === "online") { src.bridge.open(ONLINE_URL); return "keep"; }
      if (a === "refresh") { const u = document.getElementById("k-url"); if (u) src.bridge.setUrl(u.value.trim()); src.status = "Memeriksa…"; this.app.render(); await src.refresh(false); return true; }
      if (a === "import") { await src.importFile(); return true; }
      return false;
    }
  }

  // =============================================================
  // Aplikasi
  // =============================================================
  class Router {
    static parse() {
      const h = (location.hash || "#beranda").slice(1) || "beranda";
      const prefixes = [["cek-", "checker"], ["panduan-", "guide"]];
      for (const [p, name] of prefixes) if (h.startsWith(p)) return { name, param: h.slice(p.length), raw: h };
      const map = { beranda: "home", cek: "checkers", napas: "breath", tanya: "ask", lainnya: "more", panduan: "guides", tumbuh: "milestone", imunisasi: "immunization", obat: "medicine", data: "data", profil: "profile", tentang: "about" };
      return { name: map[h] || "home", param: null, raw: h };
    }
  }

  class App {
    constructor() {
      this.root = document.getElementById("app");
      this.navEl = document.getElementById("nav");
      this.kb = new KnowledgeBase();
      this.profile = new Profile();
      this.source = new DataSource(this.kb);
      this.state = "loading";
      this.views = {
        home: new HomeView(this), checkers: new CheckerListView(this), checker: new CheckerView(this), breath: new BreathView(this),
        ask: new AskView(this), more: new MoreView(this), guides: new GuideListView(this), guide: new GuideView(this),
        milestone: new MilestoneView(this), immunization: new ImmunizationView(this), medicine: new MedicineView(this),
        data: new DataView(this), profile: new ProfileView(this), about: new AboutView(this), consent: new ConsentView(this)
      };
      this.route = Router.parse();
      this.bindEvents();
    }
    pickSource() {
      if (window.AndroidKB) return new AndroidSource(this.kb, new AndroidBridge(window.AndroidKB));
      if (window.claude && typeof window.claude.use === "function" && !StaticSource.embedded()) return new CloudSource(this.kb, window.claude);
      return new StaticSource(this.kb);
    }
    start() {
      const go = () => {
        this.source = this.pickSource();
        this.renderNav();
        this.source.start(() => { this.state = this.kb.isEmpty ? "empty" : "ready"; this.render(); }, () => { this.state = "failed"; this.render(); });
      };
      this.renderNav();
      if (window.AndroidKB || (window.claude && window.claude.use) || StaticSource.embedded()) go(); else setTimeout(go, 1500);
    }
    get needsConsent() { return this.state === "ready" && !Consent.accepted; }
    get currentView() { return this.needsConsent ? this.views.consent : (this.views[this.route.name] || this.views.home); }
    updateAds() {
      if (this.source instanceof AndroidSource) this.source.bridge.setAdsAllowed(this.state === "ready" && !this.needsConsent && AdPolicy.allowed(this.route.name));
    }
    renderNav() {
      const cloud = this.source instanceof CloudSource;
      const ICON = App.ICON;
      const fourth = cloud ? ["tanya", "Tanya", "tanya"] : ["panduan", "Panduan", "panduan"];
      const items = [["beranda", "Beranda", "beranda"], ["cek", "Cek Gejala", "cek"], ["napas", "Napas", "napas"], fourth, ["lainnya", "Lainnya", "lainnya"]];
      const r = this.route;
      const group = (r.name === "checker" || r.name === "checkers") ? "cek" : (!cloud && (r.name === "guides" || r.name === "guide")) ? "panduan" :
        ["guides", "guide", "milestone", "immunization", "medicine", "data", "profile", "more", "about"].includes(r.name) ? "lainnya" : r.raw;
      this.navEl.parentElement.hidden = this.needsConsent;
      this.navEl.innerHTML = items.map(([id, label, icon]) => '<a href="#' + id + '"' + (group === id ? ' aria-current="page"' : "") + ">" + ICON[icon] + "<span>" + label + "</span></a>").join("");
    }
    stateScreen() {
      const v = this.views.home;
      if (this.state === "failed") return v.page(this.source instanceof CloudSource || this.source.constructor === DataSource
        ? '<div class="card stack-s"><h2>Database belum terbaca</h2><p class="muted">Halaman ini membutuhkan akun claude.ai yang sudah masuk dan akses ke artifak ini. Buka ulang halaman setelah masuk.</p></div>'
        : '<div class="card stack-s"><h2>Data belum terbaca</h2><p class="muted">File data tidak ditemukan atau tidak lolos pemeriksaan sumber.</p></div>');
      if (this.state === "empty") return v.page('<div class="card stack-s"><h2>Database masih kosong</h2><p class="muted">Basis pengetahuan belum diisi. Setelah diisi, isinya muncul di sini otomatis.</p></div>');
      return null;
    }
    render() {
      this.renderNav();
      this.updateAds();
      if (this.state === "loading") return;
      const screen = this.stateScreen();
      const active = document.activeElement, focusId = active && active.id, sel = active && active.selectionStart;
      this.root.innerHTML = screen || this.currentView.render(this.route.param);
      if (focusId) { const el = document.getElementById(focusId); if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) { /* jenis input tanpa seleksi */ } } }
    }
    bindEvents() {
      window.addEventListener("hashchange", () => { const prev = this.route.raw; this.route = Router.parse(); if (this.route.raw !== prev) window.scrollTo(0, 0); this.render(); });
      document.addEventListener("click", async e => {
        const t = e.target.closest("button, a");
        if (!t || !this.root.contains(t)) return;
        const res = await this.currentView.onClick(t);
        if (res === true) this.render();
      });
      document.addEventListener("input", e => this.currentView.onInput(e.target));
      document.addEventListener("change", e => { const v = this.currentView; if (v.onChange && v.onChange(e.target)) this.render(); });
      document.addEventListener("submit", e => { e.preventDefault(); if (this.currentView.onSubmit(e.target)) this.render(); });
    }
  }
  App.ICON = {
    beranda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
    cek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/></svg>',
    napas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
    tanya: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2M12 14.5v.01"/></svg>',
    panduan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
    lainnya: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'
  };

  const app = new App();
  window.__app = app;
  app.start();
})();
</script>
