name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_ADMOB: ${{ secrets.ADMOB_APP_ID != '' && secrets.ADMOB_BANNER_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uji mesin penilaian dan validasi sumber
        run: node --test test/engine.test.js

      - name: Susun data dan halaman
        run: |
          node src/build-kb.js
          node src/build-page.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Nomor versi
        run: echo "VERSION_CODE=$((100 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Kunci tanda tangan
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: ID AdMob
        if: env.HAS_ADMOB == 'true'
        run: echo "ADMOB_ARGS=-PadmobAppId=${{ secrets.ADMOB_APP_ID }} -PadmobBannerId=${{ secrets.ADMOB_BANNER_ID }}" >> "$GITHUB_ENV"

      - name: Build APK (debug)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon $ADMOB_ARGS

      - name: Build APK dan AAB (rilis, bertanda tangan)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon $ADMOB_ARGS
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/asisten-bayi.apk
          cp app/build/outputs/bundle/release/app-release.aab ../dist/asisten-bayi.aab

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY != 'true'
        with:
          name: asisten-bayi-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: asisten-bayi-play-store
          path: dist/asisten-bayi.aab

      - name: Rilis GitHub dengan tautan unduh langsung
        if: env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.$VERSION_CODE"
          NOTES="Versi 1.0.$VERSION_CODE. Unduh asisten-bayi.apk lalu pasang di HP. Data pengetahuan diperbarui otomatis dari repo ini setiap aplikasi dibuka."
          gh release create "$TAG" dist/asisten-bayi.apk --title "Asisten Bayi 1.0.$VERSION_CODE" --notes "$NOTES" --latest
