plugins {
    id "com.android.application"
}

android {
    namespace "id.asistenbayi.app"
    compileSdk 35

    defaultConfig {
        applicationId "id.asistenbayi.app"
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName "2026.11.08-15"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
