  // =============================================================
  // Model
  // =============================================================
  /** Beberapa anak per perangkat. "ab.kids" menyimpan daftar; "ab.profile" tetap berisi anak yang aktif
      (kompatibel dengan data lama dan tes) dan menang bila keduanya berbeda. */
  class Profile {
    constructor() {
      const k = LocalStore.get("ab.kids", null), p = LocalStore.get("ab.profile", null);
      this.list = k && Array.isArray(k.list) && k.list.length ? k.list : [{ nama: "", lahir: "" }];

    }
    get cur() { return this.list[this.active]; }
    get name() { return this.cur.nama || ""; }
    get birth() { return this.cur.lahir || ""; }
    persist() { LocalStore.set("ab.kids", { list: this.list, active: this.active }); LocalStore.set("ab.profile", { nama: this.name, lahir: this.birth }); }

    select(i) { if (i >= 0 && i < this.list.length) { this.active = i; this.persist(); } }
    /** Kunci checklist perkembangan anak aktif. Anak pertama dari versi lama tanpa id tetap memakai "ab.ms". */
    get msKey() { return this.cur.id ? "ab.ms." + this.cur.id : "ab.ms"; }
    add() { this.list.push({ id: Date.now().toString(36), nama: "", lahir: "" }); this.active = this.list.length - 1; this.persist(); }
    /** Hapus anak aktif beserta checklist perkembangannya, supaya tidak ada data tertinggal di HP. */
    remove() { LocalStore.remove(this.msKey); if (this.list.length > 1) this.list.splice(this.active, 1); else this.list = [{ nama: "", lahir: "" }]; this.active = 0; this.persist(); }
    static labelOf(k) { const d = Age.days(k.lahir); return d !== null ? (k.nama ? k.nama + " · " : "") + Age.label(d) : (k.nama || "Belum diisi"); }
    get ageDays() { return Age.days(this.birth); }
    get hasAge() { return this.ageDays !== null; }
    get label() { return this.hasAge ? (this.name ? this.name + " · " : "") + Age.label(this.ageDays) : "Atur usia anak"; }
  }

  /** Basis pengetahuan yang sedang aktif, dari sumber data mana pun. */
  class KnowledgeBase {
    constructor() { this.clear(); }
    clear() { this.sources = {}; this.checkers = []; this.guides = []; this.milestones = []; this.obat = []; this.mitos = []; this.changelog = []; this.usulan = []; this.meta = null; this.imunisasi = null; }
    load(kb) {
      this.sources = kb.sources || {}; this.checkers = kb.checkers || []; this.guides = kb.guides || []; this.milestones = kb.milestones || [];
      this.obat = kb.obat || []; this.mitos = kb.mitos || []; this.changelog = kb.changelog || []; this.meta = kb.meta || null; this.imunisasi = kb.imunisasi || null;
    }
    get isEmpty() { return !this.checkers.length; }
    get isStale() { return !!this.meta && Age.monthsSince(this.meta.verifiedDate) >= (this.meta.reviewMonths || 12); }
    byOrder(list) { return list.slice().sort((a, b) => (a.order || 99) - (b.order || 99)); }
    checker(id) { const d = this.checkers.find(c => c.id === id); return d ? new SymptomChecker(d) : null; }
    guide(id) { return this.guides.find(g => g.id === id) || null; }
    source(id) { return this.sources[id] || null; }
    snapshot() {
      const strip = o => { const c = { ...o }; delete c._id; return c; };
      return { sources: this.sources, checkers: this.checkers.map(strip), guides: this.guides.map(strip), milestones: this.milestones.map(strip), obat: this.obat.map(strip), mitos: this.mitos.map(strip), imunisasi: this.imunisasi, meta: this.meta, changelog: this.changelog.map(strip) };
    }
    /** Bandingkan versi seperti "2026.11.07-10": pisah di "." dan "-", bandingkan angka. Hasil -1, 0, 1. */
    static compareVersion(a, b) {
      const part = v => String(v == null ? "" : v).split(/[.\-]/).map(x => parseInt(x, 10) || 0);
      const x = part(a), y = part(b), n = Math.max(x.length, y.length);
      for (let i = 0; i < n; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; }
      return 0;
    }
    static parse(text) {
      let kb;
      try { kb = JSON.parse(text); } catch (e) { return { error: "File bukan JSON yang valid." }; }
      if (!kb || !Array.isArray(kb.checkers) || !kb.meta) return { error: "Isi file bukan data Asisten Bayi." };
      const errs = KnowledgeValidator.validate(kb);
      if (errs.length) return { error: "Ditolak karena ada pernyataan tanpa sumber: " + errs[0] };
      return { kb };
    }
  }

  /** Satu sesi menjawab satu penilai: langkah tanda bahaya, lalu satu pertanyaan per layar. */
  class CheckerSession {
    constructor(checker, profile) { this.checker = checker; this.profile = profile; this.answers = {}; this.step = null; this.skippedByUrgent = false; this.ageOverride = null; this.reset(); }
    // Umur yang disebut di pertanyaan Tanya lebih spesifik daripada profil, jadi dipakai lebih dulu.
    get ctx() { return { ageDays: typeof this.ageOverride === "number" ? this.ageOverride : this.profile.ageDays }; }
    get parts() { return this.checker.split(this.answers, this.ctx); }
    reset() { this.answers = {}; this.skippedByUrgent = false; this.step = this.parts.danger.length ? "danger" : 0; }
    get assessment() { return this.checker.assess(this.answers, this.ctx); }
    get questions() { return this.parts.rest; }
    get total() { return this.questions.length + (this.parts.danger.length ? 1 : 0); }
    get position() { if (this.step === "danger") return 1; if (this.step === "result") return this.total; return this.step + 1 + (this.parts.danger.length ? 1 : 0); }
    get current() { return typeof this.step === "number" ? this.questions[this.step] : null; }
    toggleDanger(qid) { this.answers[qid] = this.answers[qid] === "ya" ? undefined : "ya"; }
    get dangerSelected() { return this.parts.danger.filter(q => this.answers[q.id] === "ya").length; }
    confirmDanger() {
      this.parts.danger.forEach(q => { if (this.answers[q.id] !== "ya") this.answers[q.id] = "tidak"; });
      if (this.assessment.isUrgent) { this.skippedByUrgent = this.questions.length > 0; this.step = "result"; return; }
      this.step = this.questions.length ? 0 : "result";
    }
    answer(qid, value) {
      this.answers[qid] = value;
      if (this.assessment.isUrgent) { this.skippedByUrgent = this.step !== "result" && typeof this.step === "number" && this.step < this.questions.length - 1; this.step = "result"; return; }
      this.next();
    }
    next() {
      if (typeof this.step !== "number") return;
      const qs = this.questions;
      const i = qs.indexOf(this.current);
      this.step = i + 1 < qs.length ? i + 1 : "result";
    }
    back() {
      if (this.step === "result") { this.step = this.questions.length ? this.questions.length - 1 : (this.parts.danger.length ? "danger" : 0); return; }
      if (typeof this.step === "number") { this.step = this.step > 0 ? this.step - 1 : (this.parts.danger.length ? "danger" : 0); }
    }
    goTo(qid) {
      if (this.parts.danger.some(q => q.id === qid)) { this.step = "danger"; return; }
      const i = this.questions.findIndex(q => q.id === qid);
      if (i >= 0) this.step = i;
    }
    /** Pertanyaan wajib yang dilewati tanpa jawaban; ditampilkan di hasil agar orang tua tahu hasilnya bisa kurang tepat. */
    get unanswered() { return this.questions.filter(q => !q.optional && (this.answers[q.id] === undefined || this.answers[q.id] === "")).length; }
    get reviewRows() {
      const all = this.checker.visibleQuestions(this.answers, this.ctx);
      return all.filter(q => this.answers[q.id] !== undefined && this.answers[q.id] !== "").map(q => ({ q, label: CheckerSession.answerLabel(q, this.answers[q.id]) }));
    }
    static answerLabel(q, v) {
      if (q.type === "yn") return v === "ya" ? "Ya" : v === "tidak" ? "Tidak" : "Tidak tahu";
      if (q.type === "choice") { const o = q.options.find(x => x.v === v); return o ? o.label : v; }
      return v + (q.unit ? " " + q.unit : "");
    }
  }

  /** Penghitung napas 60 detik. Ambang WHO per usia. */
  class BreathCounter {
    constructor(onTick, onDone) { this.onTick = onTick; this.onDone = onDone; this.reset(); }
    reset() { clearInterval(this.timer); this.running = false; this.left = 60; this.count = 0; this.done = false; }
    start() {
      this.reset(); this.running = true;
      const t0 = Date.now();
      this.timer = setInterval(() => {
        this.left = Math.max(0, 60 - Math.floor((Date.now() - t0) / 1000));
        if (this.left <= 0) { clearInterval(this.timer); this.running = false; this.done = true; this.onDone(); } else this.onTick();
      }, 250);
    }
    tap() { if (this.running) this.count++; }
    static threshold(days) {
      if (days === null) return null;
      if (days <= 28) return { min: 61, label: "lebih dari 60×/menit", src: ["who_newborn"], level: 4 };
      if (days < 60) return null;
      if (days < 365) return { min: 50, label: "50×/menit atau lebih", src: ["who_imci_pneu"], level: 3 };
      if (days <= 1825) return { min: 40, label: "40×/menit atau lebih", src: ["who_imci_pneu"], level: 3 };
      return null;
    }
  }

  /** Versi online: database artifak claude.ai, tanya Claude, persetujuan usulan. */
  class CloudSource extends DataSource {
    constructor(kb, claude) { super(kb); this.claude = claude; this.db = null; this.sample = null; this.downloads = null; this.editor = false; }
    get mode() { return "db"; }
    get canAsk() { return true; }
    get canAskOnline() { return !!this.sample; }
    get canApprove() { return this.editor; }
    get canExport() { return !!this.downloads; }
    async start(onReady, onFail) {
      const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map(n => this.claude.use(n)));
      this.db = db; this.sample = sample; this.downloads = downloads;
      this.editor = user ? await user.canEdit().catch(() => false) : false;
      if (!db) { onFail(); return; }
      const kb = this.kb, pending = new Set(["sources", "checkers", "guides", "milestones", "obat", "mitos", "changelog", "usulan", "meta", "imunisasi"]);
      let ready = false;
      const timer = setTimeout(() => { if (!ready) onFail(); }, 10000);
      const settle = key => { pending.delete(key); if (!pending.size && !ready) { ready = true; clearTimeout(timer); } if (ready) onReady(); };
      const fail = () => { clearTimeout(timer); onFail(); };
      const coll = (name, apply) => db.collection(name).onSnapshot(s => { apply(s.docs.map(d => ({ ...d.data(), _id: d.id }))); settle(name); }, fail);
      coll("sources", docs => { kb.sources = Object.fromEntries(docs.map(d => { const { _id, ...r } = d; return [_id, r]; })); });
      coll("checkers", docs => { kb.checkers = docs; });
      coll("guides", docs => { kb.guides = docs; });
      coll("milestones", docs => { kb.milestones = docs; });
      coll("obat", docs => { kb.obat = docs; });
      coll("mitos", docs => { kb.mitos = docs; });
      coll("changelog", docs => { kb.changelog = docs; });
      coll("usulan", docs => { kb.usulan = docs; });
      db.doc("kb/meta").onSnapshot(s => { kb.meta = s.exists ? s.data() : null; settle("meta"); }, fail);
      db.doc("kb/imunisasi").onSnapshot(s => { kb.imunisasi = s.exists ? s.data() : null; settle("imunisasi"); }, fail);
    }
    async ask(question, ageDays, onText, signal) {
      const prompt = new AskPrompt(this.kb, ageDays).build(question);
      return this.sample(prompt, { signal, cache: false, onText });
    }
    async approve(u) {
      const coll = u.target && u.target.collection, id = u.target && u.target.id;
      if (!["checkers", "guides", "milestones", "obat", "kb", "sources"].includes(coll) || !u.patch) throw new Error("Target usulan tidak dikenali.");
      const trial = JSON.parse(JSON.stringify(this.kb.snapshot()));
      Object.assign(trial.sources, u.newSources || {});
      const put = (arr) => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = u.patch; else arr.push(u.patch); };
      if (coll === "sources") trial.sources[id] = u.patch;
      else if (coll === "kb" && id === "imunisasi") trial.imunisasi = u.patch;
      else if (trial[coll]) put(trial[coll]);
      const errs = KnowledgeValidator.validate(trial);
      if (errs.length) throw new Error("Ditolak otomatis: " + errs[0]);
      for (const [sid, s] of Object.entries(u.newSources || {})) await this.db.doc("sources/" + sid).set(s);
      await this.db.doc(coll + "/" + id).set(u.patch);
      const d = Clock.today(), stamp = d.replace(/-/g, ".");
      const v = (this.kb.meta && this.kb.meta.version) || "";
      const seq = v.startsWith(stamp) ? parseInt(v.split("-")[1] || "0", 10) + 1 : 1;
      await this.db.doc("kb/meta").update({ version: stamp + "-" + seq, verifiedDate: d });
      await this.db.doc("changelog/" + d + "-" + Date.now()).set({ date: d, title: u.title || "Pembaruan data", text: u.summary || "", by: "Disetujui pemilik", usulan: u._id });
      await this.db.doc("usulan/" + u._id).update({ status: "disetujui", decidedAt: new Date().toISOString() });
    }
    async reject(u) { await this.db.doc("usulan/" + u._id).update({ status: "ditolak", decidedAt: new Date().toISOString() }); }
    async saveQuestion(q) { await this.db.collection("usulan").add({ type: "pertanyaan", question: q, title: q.slice(0, 140), status: "baru", createdAt: new Date().toISOString() }); }
    get canExportOffline() { return !!this.downloads && !!document.getElementById("offline-tpl"); }
    async exportOffline() {
      const snap = this.kb.snapshot();
      const errs = KnowledgeValidator.validate(snap);
      if (errs.length) throw new Error("Data tidak lolos pemeriksaan: " + errs[0]);
      const tpl = JSON.parse(document.getElementById("offline-tpl").textContent);
      const kbText = JSON.stringify(snap).replace(/</g, "\\u003c");
      const html = tpl.replace("/*KB_" + "EMBED*/", () => kbText);
      await this.downloads.save({ filename: "asisten-bayi-offline-" + snap.meta.version + ".html", data: html });
    }
    async exportForApk() {
      const snap = this.kb.snapshot();
      const errs = KnowledgeValidator.validate(snap);
      if (errs.length) throw new Error("Data tidak lolos pemeriksaan: " + errs[0]);
      await this.downloads.save({ filename: "asisten-bayi-data-" + snap.meta.version + ".json", data: JSON.stringify(snap) });
    }
  }

  /** Jembatan ke kode Java di aplikasi Android. */
  class AndroidBridge {
    constructor(native) { this.native = native; this.seq = 0; this.cbs = {}; window.__androidCb = (id, ok, text) => { const f = this.cbs[id]; delete this.cbs[id]; if (f) f(ok, text); }; }
    call(method, arg) { return new Promise(resolve => { const id = ++this.seq; this.cbs[id] = (ok, text) => resolve({ ok, text }); if (arg === undefined) this.native[method](id); else this.native[method](arg, id); }); }
    getKb() { return this.native.getKb(); }
    save(text) { return this.native.save(text); }
    getUrl() { return this.native.getUrl() || ""; }
    setUrl(u) { this.native.setUrl(u); }
    open(url) { this.native.openUrl(url); }
    fetch(url) { return this.call("fetchText", url); }
    pickFile() { return this.call("pickFile"); }
    listen() { return this.call("listen"); }
  }

  /** Aplikasi Android: data tersimpan di perangkat, bisa dipakai tanpa internet. */
  class AndroidSource extends DataSource {
    constructor(kb, bridge) { super(kb); this.bridge = bridge; this.status = ""; }
    get mode() { return "android"; }
    get canUpdateLocal() { return true; }
    get canAsk() { return true; }
    get canAskOnline() { return CHAT_URL.indexOf("REPLACE") < 0; }
    get canListen() { return !!(window.AndroidKB && window.AndroidKB.listen); }
    listen() { return this.bridge.listen(); }
    static deviceId() {
      try {
        let id = localStorage.getItem("ab-device");
        if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("ab-device", id); }
        return id;
      } catch (e) { return "anon"; }
    }
    /** Tanya lewat Worker: respons text/plain dialirkan; antarmuka sama dengan CloudSource.ask. */
    async ask(question, ageDays, onText, signal) {
      const cancelled = () => { const c = new Error("cancelled"); c.code = "cancelled"; return c; };
      let res;
      try {
        res = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, ageDays, deviceId: AndroidSource.deviceId() }), signal });
      } catch (e) {
        if (e && e.name === "AbortError") throw cancelled();
        throw new Error("Tidak ada koneksi. Coba cek gejala di menu Cek.");
      }
      if (res.status === 429) throw new Error("Batas pertanyaan hari ini tercapai.");
      if (!res.ok || !res.body) throw new Error("Jawaban gagal dimuat. Coba lagi nanti.");
      const reader = res.body.getReader(), dec = new TextDecoder();
      let text = "";
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          text += dec.decode(value, { stream: true });
          onText({ text });
        }
      } catch (e) {
        if (signal && signal.aborted) throw cancelled();
        if (!text) throw new Error("Tidak ada koneksi. Coba cek gejala di menu Cek.");
      }
      text += dec.decode();
      onText({ text });
      return { text, truncated: false };
    }
    start(onReady, onFail) {
      const r = KnowledgeBase.parse(this.bridge.getKb() || "");
      if (r.error) { onFail(); return; }
      this.kb.load(r.kb); onReady();
      this.refresh(true).then(changed => { if (changed) onReady(); });
    }
    accept(text, fromUrl) {
      const r = KnowledgeBase.parse(text);
      if (r.error) { this.status = r.error; return false; }
      const cur = this.kb.meta ? String(this.kb.meta.version) : "";
      if (fromUrl && cur && KnowledgeBase.compareVersion(r.kb.meta.version, cur) <= 0) { this.status = "Data sudah terbaru (versi " + cur + ")."; return false; }
      if (!this.bridge.save(text)) { this.status = "Gagal menyimpan data di perangkat."; return false; }
      this.kb.load(r.kb); this.status = "Data diperbarui ke versi " + r.kb.meta.version + "."; return true;
    }
    async refresh(silent) {
      const url = this.bridge.getUrl();
      if (!url) { if (!silent) this.status = "Alamat file data belum diisi. Gunakan Impor file data, atau isi alamatnya."; return false; }
      const res = await this.bridge.fetch(url);
      if (!res.ok) { if (!silent) this.status = "Tidak bisa mengambil data: " + res.text; return false; }
      const before = this.status, changed = this.accept(res.text, true);
      if (silent && !changed) this.status = before;
      return changed;
    }
    async importFile() { const res = await this.bridge.pickFile(); if (!res.ok) { if (res.text) this.status = res.text; return false; } return this.accept(res.text, false); }
  }

  /** File lokal / peramban biasa: data tertanam di file, bisa diganti dengan impor file data. */
  class StaticSource extends DataSource {
    constructor(kb) { super(kb); this.status = ""; this.origin = ""; }
    get canUpdateLocal() { return true; }
    get canAsk() { return true; }
    static embedded() { const el = document.getElementById("kb-embed"); return el ? el.textContent.trim() : ""; }
    static stored() { try { return localStorage.getItem("ab.kb") || ""; } catch (e) { return ""; } }
    start(onReady, onFail) {
      const pick = (...texts) => {
        let best = null;
        texts.forEach(([t, origin]) => { if (!t) return; const r = KnowledgeBase.parse(t); if (!r.error && (!best || KnowledgeBase.compareVersion(r.kb.meta.version, best.kb.meta.version) > 0)) best = { kb: r.kb, origin }; });
        return best;
      };
      const finish = best => { if (!best) { onFail(); return; } this.kb.load(best.kb); this.origin = best.origin; onReady(); };
      const local = pick([StaticSource.embedded(), "tertanam"], [StaticSource.stored(), "impor"]);
      if (local) { finish(local); return; }
      fetch("kb.json").then(r => (r.ok ? r.text() : "")).then(t => finish(pick([t, "kb.json"]))).catch(onFail);
    }
    importFile() {
      return new Promise(resolve => {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".json,application/json";
        inp.onchange = () => {
          const f = inp.files && inp.files[0];
          if (!f) { resolve(false); return; }
          const rd = new FileReader();
          rd.onload = () => {
            const r = KnowledgeBase.parse(String(rd.result));
            if (r.error) { this.status = r.error; resolve(false); return; }
            try { localStorage.setItem("ab.kb", String(rd.result)); } catch (e) { this.status = "Data terbaca, tetapi peramban ini tidak mengizinkan penyimpanan. Data hanya berlaku sampai halaman ditutup."; }
            this.kb.load(r.kb); this.origin = "impor";
            if (!this.status) this.status = "Data diperbarui ke versi " + r.kb.meta.version + ".";
            resolve(true);
          };
          rd.onerror = () => { this.status = "File tidak bisa dibaca."; resolve(false); };
          rd.readAsText(f);
        };
        inp.click();
      });
    }
  }

  /** Prompt "Tanya": Claude hanya boleh menjawab dari database. */
  class AskPrompt {
    constructor(kb, ageDays) { this.kb = kb; this.ageDays = ageDays; }
    database() {
      const kb = this.kb;
      return {
        sources: Object.fromEntries(Object.entries(kb.sources).map(([k, v]) => [k, (v.type === "sekunder" ? "[sekunder] " : "") + v.title])),
        penilai_gejala: kb.checkers.map(c => ({ id: c.id, judul: c.title, aturan: c.rules.map(r => ({ tingkat: Level.of(r.level).name, teks: r.text, src: r.src })), default: c.default, kemungkinan: c.differentials, perawatan: c.care, naik_tingkat: c.escalate })),
        panduan: kb.guides.map(g => ({ judul: g.title, bagian: g.sections })),
        obat: kb.obat, imunisasi: kb.imunisasi,
        perkembangan: kb.milestones.map(m => ({ usia: m.label, kemampuan: m.d }))
      };
    }
    build(question) {
      const d = this.ageDays;
      return [
        "Anda adalah asisten kesehatan bayi dan anak untuk orang tua di Indonesia. Jawab dalam Bahasa Indonesia yang tenang, jelas, dan sederhana.",
        "ATURAN WAJIB:",
        "1. Jawab HANYA dari DATABASE di bawah, jangan memakai pengetahuan lain. Bila tidak ada di database, tulis persis: \"Belum ada di database terverifikasi aplikasi ini.\" lalu sarankan konsultasi tenaga kesehatan bila menyangkut gejala.",
        "2. Setiap pernyataan fakta diberi kode sumber dalam kurung siku sesuai kunci sources, misalnya [who_newborn]. Jangan mengarang kode.",
        "3. Kalimat pertama adalah pesan utama: tingkat (Umum, Pantau, Periksa hari ini, atau Segera ke IGD) dan apa yang harus dilakukan, sesuai aturan penilai di database. Ikuti jumlah tanda sesuai kriteria; satu tanda yang belum memenuhi kriteria cukup disebut Pantau.",
        "4. Sebut kemungkinan dari yang paling sering, memakai frekuensi alami seperti \"3 dari 10 bayi\". Kondisi langka hanya disebut bila ciri pembedanya ada pada cerita pengguna, selalu dengan angka kejadiannya.",
        "5. Jangan memberi vonis pasti; sebut pemeriksaan yang memastikan bila ada di database. Jangan memberi dosis obat selain yang tertulis di database.",
        "6. Jangan menakut-nakuti; tanpa kata dramatis. Maksimal sekitar 180 kata, kalimat pendek, tanpa tabel.",

  class CheckerView extends View {
    constructor(app) { super(app); this.sessions = {}; this.id = null; }
    session(id) {
      const checker = this.kb.checker(id);
      if (!checker) return null;
      let s = this.sessions[id];
      if (!s || s.checker.def !== checker.def) { const old = s; s = this.sessions[id] = new CheckerSession(checker, this.profile); if (old) { s.answers = old.answers; s.step = old.step; } }
      return s;
    }
    render(id) {
      this.id = id;
      const s = this.session(id);
      if (!s) return this.page('<p>Keluhan ini belum ada di database.</p>' + Html.back("cek", "Semua keluhan"));
      const def = s.checker.def;
      let body = Html.back("cek", "Semua keluhan") + "<h1>" + Html.esc(def.title) + "</h1>";
      if (typeof s.ageOverride === "number") body += '<div class="banner">Memakai umur dari pertanyaan Anda: <strong>' + Html.esc(Age.label(s.ageOverride)) + "</strong>." + (this.profile.hasAge ? "" : ' <a href="#profil">Simpan tanggal lahir</a> agar tidak perlu ditulis lagi.') + "</div>";
      else if (def.needsAge && !this.profile.hasAge) body += '<div class="banner warn">Usia anak belum diisi, padahal beberapa kriteria bergantung pada usia. <a href="#profil">Isi tanggal lahir</a></div>';
      if (s.step === "result") body += this.result(s);
      else if (s.step === "danger") body += this.progress(s) + this.dangerStep(s);
      else body += this.progress(s) + this.questionStep(s);
      return this.page(body);
    }
    progress(s) {
      const pct = Math.round((s.position - 1) / Math.max(1, s.total) * 100);
      return '<div class="progress"><span class="small muted">Langkah ' + s.position + " dari " + s.total + '</span><div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div></div>';
    }
    dangerStep(s) {
      const qs = s.parts.danger, n = s.dangerSelected;
      return '<div class="card stack"><div class="stack-s"><p class="qbig">Pertama, adakah salah satu tanda ini?</p><p class="small muted">Ketuk yang ada. Tanda-tanda ini dicek lebih dulu karena masing-masing sudah cukup untuk segera mencari pertolongan.</p></div>' +
        '<div class="answers">' + qs.map(q => '<button type="button" class="toggle" data-danger="' + Html.esc(q.id) + '" aria-pressed="' + (s.answers[q.id] === "ya") + '"><span class="box" aria-hidden="true"></span><span>' + Html.esc(q.text) + "</span></button>").join("") + "</div>" +
        '<button type="button" class="btn-primary" data-act="danger-ok">' + (n ? "Lihat hasil" : "Tidak ada, lanjut") + "</button></div>";
    }
    questionStep(s) {
      const q = s.current;
      if (!q) return "";
      const v = s.answers[q.id];
      let ctl;
      if (q.type === "yn") {
        const opts = [["ya", "Ya"], ["tidak", "Tidak"]].concat(q.allowUnknown ? [["tdk-tahu", "Tidak tahu"]] : []);
        ctl = '<div class="answers">' + opts.map(([val, l]) => '<button type="button" data-ans="' + Html.esc(q.id) + '" data-v="' + val + '" aria-pressed="' + (v === val) + '">' + l + "</button>").join("") + "</div>";
      } else if (q.type === "choice") {
        ctl = '<div class="answers">' + q.options.map(o => '<button type="button" data-ans="' + Html.esc(q.id) + '" data-v="' + Html.esc(o.v) + '" aria-pressed="' + (v === o.v) + '">' + Html.esc(o.label) + "</button>").join("") + "</div>";
      } else {
        ctl = '<form class="stack-s" data-form="num"><div class="num-in"><input id="num-' + Html.esc(q.id) + '" inputmode="decimal" value="' + Html.esc(v || "") + '" aria-label="' + Html.esc(q.text) + '"><span class="muted">' + Html.esc(q.unit || "") + '</span></div><div class="row"><button class="btn-primary" type="submit">Lanjut</button>' + (q.optional ? '<button type="button" data-act="skip">Lewati</button>' : "") + "</div></form>";
      }
      return '<div class="card stack"><label class="qbig"' + (q.type === "number" ? ' for="num-' + Html.esc(q.id) + '"' : "") + ">" + Html.esc(q.text) + "</label>" + (q.help ? '<p class="small muted">' + Html.esc(q.help) + "</p>" : "") + ctl + "</div>" +
        '<div class="navrow"><button type="button" class="btn-ghost" data-act="back">‹ Kembali</button>' + (q.type === "yn" ? '<button type="button" class="btn-ghost" data-act="skip">Lewati</button>' : "") + "</div>";
    }
    shareButton(s, r, lv, main, mainSrc) {
      const short = t => { const i = t.indexOf(" — "); return i > 0 ? t.slice(0, i) : t; };
      const names = (mainSrc || []).map(id => this.kb.source(id)).filter(Boolean).map(x => short(x.title));
      const lines = [s.checker.def.title];
      if (this.profile.hasAge) lines.push("Usia anak: " + Age.label(this.profile.ageDays));
      lines.push(lv.action, main);
      if (names.length) lines.push("Sumber: " + names.join(", "));
      lines.push("", "Asisten Bayi · " + POWERED);
      return '<a class="btn" href="' + Html.esc("https://wa.me/?text=" + encodeURIComponent(lines.join("\n"))) + '" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Bagikan ke WA</a>';
    }
    legend() {
      const keyText = { 1: "Pola yang umum, tanpa tanda bahaya.", 2: "Satu tanda belum memenuhi kriteria. Perhatikan beberapa jam ke depan.", 3: "Bawa ke dokter hari ini.", 4: "Ada tanda bahaya. Ke IGD sekarang." };
      return '<div class="card"><details><summary>Arti hasil</summary><div class="levels-key" style="margin-top:8px">' + [1, 2, 3, 4].map(l => Html.levelChip(l) + '<span class="small">' + keyText[l] + "</span>").join("") + "</div></details></div>";
    }
    result(s) {
      const r = s.assessment, lv = r.levelInfo;
      const main = r.summary || (r.reasons[0] && r.reasons[0].text) || "";
      const mainSrc = r.summary ? r.summarySrc : (r.reasons[0] ? r.reasons[0].src : []);
      // Pesan utama di atas (CDC Clear Communication Index): tingkat, tindakan, lalu alasannya.
      let h = '<div class="result r-' + r.level + '" aria-live="polite"><div class="stack-s">' + Html.levelChip(r.level) + "<h2>" + Html.esc(lv.action) + "</h2>" +
        (r.summary && r.headline !== lv.name ? '<p class="eyebrow">' + Html.esc(r.headline) + "</p>" : "") +
        '<p class="main-msg">' + Html.esc(main) + "</p>" + this.sources(mainSrc) + "</div></div>";
      if (r.level >= 3) h += Html.emergency();
      h += this.shareButton(s, r, lv, main, mainSrc);
      if (s.skippedByUrgent) h += '<p class="small muted">Pertanyaan lain dilewati karena sudah ada tanda yang perlu segera ditangani.</p>';
      else if (s.unanswered) h += '<div class="banner warn">' + s.unanswered + " pertanyaan dilewati, jadi hasil ini bisa kurang tepat. Buka \"Jawaban Anda\" di bawah untuk melengkapinya.</div>";
      const more = r.reasons.slice(1);
      if (more.length) h += '<div class="card stack-s"><h3>Alasan lain</h3>' + more.map(x => "<div><p>" + Html.esc(x.text) + "</p>" + this.sources(x.src) + "</div>").join("") + "</div>";
      r.notes.forEach(n => { h += '<div class="banner"><p>' + Html.esc(n.text) + "</p>" + this.sources(n.src) + "</div>"; });
      if (!r.isUrgent) {
        if (r.differentials.length) h += '<div class="card stack-s"><h3>Kemungkinan, dari yang paling sering</h3>' +
          r.differentials.map(d => '<div class="diff"><p class="diff-h"><strong>' + Html.esc(d.name) + '</strong><span class="freq">' + Html.esc(d.freq) + "</span></p><p class=\"small\">" + Html.esc(d.features) + "</p>" + this.sources(d.src) + "</div>").join("") + "</div>";
        if (r.care.length) h += '<div class="card stack-s"><h3>Yang bisa dilakukan sekarang</h3><ul class="items">' + r.care.map(x => "<li>" + Html.esc(x.t) + this.sources(x.src) + "</li>").join("") + "</ul></div>";
        if (r.escalate.length) h += '<div class="card stack-s"><h3>Periksakan bila kemudian muncul</h3><ul class="items">' + r.escalate.map(x => "<li>" + Html.esc(x) + "</li>").join("") + "</ul></div>";
      }
      h += this.legend();
      const rows = s.reviewRows;
      h += '<div class="card"><details class="review"><summary>Jawaban Anda (' + rows.length + ")</summary>" +
        rows.map(x => '<div class="review-row"><div><p class="small">' + Html.esc(x.q.text) + '</p><p class="small"><strong>' + Html.esc(x.label) + '</strong></p></div><button type="button" data-goto="' + Html.esc(x.q.id) + '">Ubah</button></div>').join("") + "</details></div>";
      h += '<div class="navrow"><button type="button" class="btn-ghost" data-act="back">‹ Kembali</button><button type="button" data-act="restart">Mulai ulang</button></div>';
      h += '<p class="small muted">Hasil ini berupa kemungkinan berdasarkan kriteria resmi, bukan vonis.' + (r.level <= 2 ? " Bila Anda tetap khawatir, periksakan anak meski hasilnya hijau atau kuning." : "") + "</p>";
      return h;
    }
    onClick(t) {
      const s = this.id && this.sessions[this.id];
      if (!s) return false;
      if (t.dataset.danger) { s.toggleDanger(t.dataset.danger); return true; }
      if (t.dataset.ans) { s.answer(t.dataset.ans, t.dataset.v); window.scrollTo(0, 0); return true; }
      if (t.dataset.goto) { s.goTo(t.dataset.goto); return true; }
      const act = t.dataset.act;
      if (act === "danger-ok") { s.confirmDanger(); window.scrollTo(0, 0); return true; }
      if (act === "back") { s.back(); return true; }
      if (act === "skip") { s.next(); return true; }
      if (act === "restart") { s.reset(); return true; }
      return false;
    }
    onSubmit(form) {
      const s = this.id && this.sessions[this.id];
      if (!s || form.dataset.form !== "num" || !s.current) return false;
      const val = form.querySelector("input").value.trim();
      if (val === "") { s.next(); return true; }
      s.answer(s.current.id, val); return true;
    }
    prefill(id, qid, value) { const s = this.session(id); if (s) s.answers[qid] = value; }
  }

  class BreathView extends View {
    constructor(app) {
      super(app);
      this.counter = new BreathCounter(() => this.tick(), () => { BreathView.buzz([200, 100, 200]); this.releaseWake(); this.app.render(); });
      this.wake = null;
    }
    /** Getar singkat: mata orang tua ke dada anak, bukan ke layar. Diam saja bila tidak didukung. */
    static buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* abaikan */ } }
    /** Jaga layar tetap menyala selama 60 detik penghitungan. */
    async holdWake() { try { if (navigator.wakeLock) this.wake = await navigator.wakeLock.request("screen"); } catch (e) { this.wake = null; } }
    releaseWake() { try { if (this.wake) this.wake.release(); } catch (e) { /* abaikan */ } this.wake = null; }
    tick() {
      const l = document.getElementById("b-left"); if (l) l.textContent = this.counter.left + " detik";
      const fg = document.querySelector(".ring .c-fg");
      if (fg) { const C = 2 * Math.PI * 52; fg.setAttribute("stroke-dashoffset", (C - C * (this.counter.left / 60)).toFixed(1)); }
    }
    render() {
      const c = this.counter, d = this.profile.ageDays, th = BreathCounter.threshold(d);
      const C = 2 * Math.PI * 52, off = C * (c.left / 60);
      let res = "";
      if (c.done) {
        const fast = th && c.count >= th.min;
        res = '<div class="result r-' + (fast ? th.level : 1) + '"><div class="stack-s"><h2>' + c.count + "×/menit</h2>" +
          (th ? "<p>" + (fast ? "Di atas ambang napas cepat WHO untuk usia ini (" + Html.esc(th.label) + ")." : "Di bawah ambang napas cepat WHO untuk usia ini (" + Html.esc(th.label) + ").") + "</p>" + this.sources(th.src)
            : '<p class="muted">Aplikasi belum punya ambang terverifikasi untuk usia ini' + (d === null ? " (usia belum diisi)" : "") + ".</p>") +
          '<button type="button" class="btn-primary" data-act="use-rr">Lanjut ke cek batuk & napas</button></div></div>';
      }
      return this.page("<h1>Hitung napas</h1>" +
        '<p class="muted">Hitung saat anak tenang atau tidur, tidak sedang menangis. Satu kali perut atau dada naik-turun = satu napas. Ketuk tombol besar setiap satu napas selama 60 detik.</p>' +
        '<div class="card counter"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="c-bg" cx="60" cy="60" r="52"/><circle class="c-fg" cx="60" cy="60" r="52" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C - off).toFixed(1) + '"/></svg>' +
        '<div class="mid"><span class="big" id="b-count" aria-live="polite">' + c.count + '</span><span class="muted small" id="b-left">' + (c.running ? c.left + " detik" : c.done ? "selesai" : "60 detik") + "</span></div></div>" +
        (c.running ? '<button class="btn-primary tap" data-act="tap" type="button">Napas</button><button type="button" class="btn-ghost" data-act="cancel">Batalkan</button>'
          : '<button class="btn-primary tap" data-act="start" type="button">' + (c.done ? "Hitung ulang" : "Mulai 60 detik") + "</button>") +
        "</div>" + res + (th ? '<p class="small muted">Ambang napas cepat WHO untuk usia ' + Html.esc(Age.label(d)) + ": " + Html.esc(th.label) + ".</p>" : ""));
    }
    onClick(t) {
      const a = t.dataset.act;
      if (a === "start") { this.counter.start(); this.holdWake(); return true; }
      if (a === "tap") { this.counter.tap(); if (this.counter.running) BreathView.buzz(15); const el = document.getElementById("b-count"); if (el) el.textContent = this.counter.count; return "keep"; }
      if (a === "cancel") { this.counter.reset(); this.releaseWake(); return true; }
      if (a === "use-rr") { this.app.views.checker.prefill("napas", "rr", String(this.counter.count)); location.hash = "#cek-napas"; return "keep"; }
      return false;
    }
  }

  class AskView extends View {
    constructor(app) { super(app); this.q = ""; this.text = ""; this.busy = false; this.err = ""; this.ctl = null; this.hits = []; this.res = null; this.sel = null; this._eng = null; this._engKey = null; }
    linkify(t) {
      const short = s => { const i = s.indexOf(" — "); return i > 0 ? s.slice(0, i) : s; };
      return Html.esc(t).replace(/\[([a-z0-9_]+)\]/g, (m, id) => { const s = this.kb.source(id); return s ? '<a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">[' + Html.esc(short(s.title)) + "]</a>" : m; });
    }
    static get TOPICS() {
      return [["Demam", "Bayi saya demam, suhunya "], ["Diare", "Bayi saya diare sejak "], ["Batuk pilek", "Bayi saya batuk pilek sejak "], ["Obat aman?", "Apakah obat ini aman untuk bayi saya: "],
        ["MPASI", "Bagaimana memulai MPASI untuk bayi saya? "], ["Imunisasi", "Imunisasi apa yang perlu bayi saya sekarang? "], ["Katanya… bener nggak?", "Katanya … bener nggak? Yang saya dengar: "]];
    }
    /** Cadangan saat offline: pemeriksaan/panduan yang judulnya cocok dengan kata di pertanyaan (maks 3). */
    matchTopics(q) {
      const text = String(q || "").toLowerCase();
      const hit = (title) => String(title || "").toLowerCase().split(/[^a-z0-9]+/).some(w => w.length >= 4 && text.includes(w));
      const out = [];
      this.kb.checkers.forEach(c => { if (hit(c.title)) out.push(["#cek-" + c.id, c.title]); });
      this.kb.guides.forEach(g => { if (hit(g.title)) out.push(["#panduan-" + g.id, g.title]); });
      return out.slice(0, 3);
    }
    engine() {
      const kb = this.kb, key = [kb.checkers, kb.guides, kb.obat, kb.mitos, kb.milestones, kb.imunisasi];
      if (!this._eng || !this._engKey || key.some((x, i) => x !== this._engKey[i])) { this._eng = new window.Engine.AskEngine(kb); this._engKey = key; }
      return this._eng;
    }
    static noteUnmatched(q) {
      try {
        const arr = JSON.parse(localStorage.getItem("ab-unmatched") || "[]");
        arr.push({ q: q, at: new Date().toISOString() });
        localStorage.setItem("ab-unmatched", JSON.stringify(arr.slice(-200)));
      } catch (e) { /* penyimpanan tidak tersedia */ }
    }
    /** Jawaban utama, selalu dari data di perangkat. */
    local() {
      const q = this.q.trim();
      if (!q) return;
      this.text = ""; this.err = ""; this.hits = []; this.res = null; this.sel = null;
      try {
        this.res = this.engine().answer(q, this.profile.ageDays);
        if (this.res.confidence === "high") this.sel = this.res.best;
        if (this.res.confidence !== "high") AskView.noteUnmatched(q);
      } catch (e) { this.err = "Pertanyaan belum bisa dicari di data aplikasi."; }
      this.app.render();
      this.revealResult();
    }
    /** Hasil (terutama tanda bahaya) sering jatuh di bawah layar HP setelah form; gulir ke sana. */
    revealResult() {
      const el = document.getElementById("t-danger") || document.getElementById("t-res");
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "start", behavior: "smooth" });
    }
    srcList(src) { return this.sources(Array.isArray(src) ? src : (src ? [src] : [])); }
    chips(ex, ageDays) {
      const c = [];
      if (typeof ageDays === "number") c.push("Umur " + Age.label(ageDays));
      if (ex && typeof ex.tempC === "number") c.push("Suhu " + String(ex.tempC).replace(".", ",") + "°C");
      if (ex && typeof ex.days === "number") c.push(ex.days + " hari");
      return c.length ? '<div class="row">' + c.map(x => '<span class="tag">' + Html.esc(x) + "</span>").join("") + "</div>" : "";
    }
    card(r) {
      if (!r) return "";
      const kb = this.kb, res = this.res;
      const link = (href, label) => '<a class="btn" href="' + Html.esc(href) + '" style="text-decoration:none">' + Html.esc(label) + "</a>";
      // Sumber tiap poin ditandai nomor [n]; daftar lengkapnya ada di bawah kartu, jadi kaitan poin-sumber tetap terlihat tanpa memanjangkan kartu.
      const acc = [];
      const ref = src => {
        const ids = (Array.isArray(src) ? src : (src ? [src] : [])).filter(id => kb.source(id));
        if (!ids.length) return "";
        const n = ids.map(id => { let i = acc.indexOf(id); if (i < 0) { acc.push(id); i = acc.length - 1; } return i + 1; });
        return ' <sup class="ref">[' + n.join(",") + "]</sup>";
      };
      const srcBox = () => {
        if (!acc.length) return "";
        return '<details class="srcbox"><summary>Sumber (' + acc.length + ")</summary><ol>" + acc.map(id => { const s = kb.source(id); return '<li><a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">' + Html.esc(s.title) + "</a>" + (s.type === "sekunder" ? '<span class="tag">sekunder</span>' : "") + "</li>"; }).join("") + "</ol></details>";
      };
      let h = "";
      if (r.type === "checker") {
        const c = kb.checkers.find(x => x.id === r.id);
        if (!c) return "";
        // c.default adalah kesimpulan "semua dijawab tidak"; sebelum ada jawaban, kesimpulan itu menyesatkan
        // (mis. "Tidak ada tanda bahaya" tepat di bawah peringatan bahaya). Tampilkan deskripsi checker saja.
        const care = Array.isArray(c.care) ? c.care : [], esc = Array.isArray(c.escalate) ? c.escalate : [];
        h = "<h3>" + Html.esc(c.title) + "</h3>" + this.chips(res.extracted, res.ageDays) +
          (c.short ? '<p class="lead">' + Html.esc(c.short) + "</p>" : "") +
          '<p class="small muted">Belum dinilai: hasil baru keluar setelah Anda menjawab pertanyaannya.</p>' +
          (care.length ? '<p class="sec">Yang bisa dilakukan</p><ul class="items">' + care.map(it => "<li>" + Html.esc(it.t) + ref(it.src) + "</li>").join("") + "</ul>" : "") +
          (esc.length ? '<div class="watch"><p class="sec">Periksakan ke dokter bila muncul</p><ul class="items">' + esc.map(t => "<li>" + Html.esc(t) + "</li>").join("") + "</ul></div>" : "") +
          '<p class="small muted">Untuk hasil yang sesuai kondisi anak, jawab beberapa pertanyaan singkat:</p>' +
          '<div class="row"><button type="button" class="btn-primary" data-start="' + Html.esc(c.id) + '">' + Html.esc("Mulai cek " + c.title) + "</button></div>" + srcBox();
      } else if (r.type === "guide") {
        const g = kb.guides.find(x => x.id === r.id);
        if (!g) return "";
        const items = [];
        (g.sections || []).forEach(sec => (sec.items || []).forEach(it => { if (items.length < 2) items.push(it); }));
        h = "<h3>" + Html.esc(g.title) + "</h3>" + (items.length ? '<ul class="items">' + items.map(it => "<li>" + Html.esc(it.t) + ref(it.src) + "</li>").join("") + "</ul>" : "") +
          '<div class="row">' + link("#panduan-" + g.id, "Buka panduan lengkap") + "</div>" + srcBox();
      } else if (r.type === "obat") {
        const o = kb.obat.find(x => x.id === r.id);
        if (!o) return "";
        const names = { hindari: "Hindari", dokter: "Lewat dokter", info: "Info", program: "Program resmi" };
        h = "<h3>" + Html.esc(o.name) + '</h3><p class="small muted">' + Html.esc(names[o.status] || o.status || "") + (o.age ? " · Usia: " + Html.esc(o.age) : "") + "</p><p>" + Html.esc(o.t) + ref(o.src) + "</p>" +
          '<div class="row">' + link("#obat", "Buka keamanan obat") + "</div>" + srcBox();
      } else if (r.type === "mitos") {
        const m = (kb.mitos || []).find(x => x.id === r.id);
        if (!m) return "";
        const v = { benar: "Benar", tidak: "Tidak benar", belum: "Belum terbukti" }[m.verdict] || "Belum terbukti";
        h = '<p><span class="lv ' + (m.verdict === "tidak" ? "lv-3" : m.verdict === "benar" ? "lv-1" : "lv-2") + '">' + Html.esc(v) + "</span></p><p><strong>" + Html.esc(m.claim) + "</strong></p><p>" + Html.esc(m.text) + ref(m.src) + "</p>" + srcBox();
      } else if (r.type === "milestone") {
        h = "<h3>" + Html.esc(r.title) + '</h3><div class="row">' + link("#tumbuh", "Buka perkembangan") + "</div>";
      } else if (r.type === "imunisasi") {
        h = "<h3>" + Html.esc(r.title) + '</h3><div class="row">' + link("#imunisasi", "Buka jadwal imunisasi") + "</div>";
      } else return "";
      return '<div class="card stack-s">' + h + "</div>";
    }
    /** Kotak tanda bahaya: tombol mengikuti level tertinggi (igd > hari > pantau; tanpa level dianggap igd). */
    static dangerBox(list, srcHtml) {
      const rank = { pantau: 1, hari: 2, igd: 3 };
      const top = list.reduce((m, d) => Math.max(m, rank[d.level] || 3), 1);
      const head = { 3: "Tanda bahaya: ke IGD sekarang", 2: "Periksakan ke dokter hari ini", 1: "Pantau di rumah" }[top];
      const cls = { 3: "r-4", 2: "r-3", 1: "r-2" }[top];
      const act = top === 3 ? Html.emergency()
        : '<div class="stack-s">' + (top === 2 ? '<a class="btn btn-big btn-primary" href="https://www.google.com/maps/search/puskesmas+atau+klinik+anak+terdekat" target="_blank" rel="noopener">Cari puskesmas / dokter terdekat</a>' : "") +
          '<p class="small">Memburuk atau muncul tanda darurat? <a href="tel:119">Telepon 119</a> · <a href="#darurat">Lihat tanda darurat</a></p></div>';
      return '<div class="result ' + cls + '" id="t-danger"><div class="stack-s"><p><strong>' + head + "</strong></p><ul class=\"items\">" +
        list.map(d => "<li>" + Html.esc(d.text) + srcHtml(d) + "</li>").join("") + "</ul>" + act + "</div></div>";
    }
    localHtml() {
      const r = this.res;
      if (!r) return "";
      let h = "";
      if (r.danger.length) h += AskView.dangerBox(r.danger, d => this.srcList(d.src));
      if (r.confidence === "high") h += this.card(this.sel || r.best);
      else if (r.confidence === "low") {
        h += '<div class="card stack-s"><p class="eyebrow">Maksudnya yang mana?</p><div class="list">' +
          r.results.slice(0, 3).map((x, i) => '<button type="button" data-pick="' + i + '">' + Html.esc(x.title) + "</button>").join("") + "</div></div>" + this.card(this.sel);
      } else {
        const mail = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Pertanyaan belum terjawab") + "&body=" + encodeURIComponent(this.q.trim());
        h += '<div class="card stack-s"><p><strong>Belum ada di data kami.</strong></p><div class="row">' +
          (this.source.saveQuestion ? '<button type="button" data-act="save-q">Kirim pertanyaan ini</button>' : '<a class="btn" href="' + Html.esc(mail) + '" style="text-decoration:none">Kirim pertanyaan ini</a>') +
          '<a class="btn" href="#darurat" style="text-decoration:none">Darurat</a></div></div>';
      }
      const showOnline = !this.busy && !this.text && this.source.canAskOnline && (this.source instanceof CloudSource || r.confidence !== "high");
      if (showOnline) h += '<div class="row"><button type="button" data-act="online-ask">Tanya lebih lanjut (online)</button></div>';
      return h;
    }
    feedbackRow() {
      if (this.busy) return "";
      const body = "Pertanyaan: " + this.q.trim() + "\n\nJawaban: " + (this.text || (this.sel ? this.sel.type + ":" + this.sel.id : "-"));
      return '<div class="fb"><span class="small muted">Membantu?</span><button type="button" class="icon-btn" data-fb="up" aria-label="Jawaban membantu">👍</button><button type="button" class="icon-btn" data-fb="down" aria-label="Jawaban kurang membantu">👎</button><a class="btn btn-text" href="' + Html.esc("mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Laporan jawaban") + "&body=" + encodeURIComponent(body)) + '">Laporkan</a>' +
        (this.text && this.source.saveQuestion ? '<button type="button" data-act="save-q">Catat untuk diriset</button>' : "") + "</div>";
    }
    render() {
      const mic = this.source.canListen;
      return this.page("<h1>Tanya</h1>" +
        '<p class="muted">Dijawab dari data terverifikasi di aplikasi ini, dengan sumbernya, tanpa internet. Bila belum ada, kami bilang terus terang.</p>' +
        '<div class="row">' + AskView.TOPICS.map((t, i) => '<button type="button" data-chip="' + i + '">' + Html.esc(t[0]) + "</button>").join("") + "</div>" +
        '<form data-form="ask" class="card stack"><label for="t-q">Pertanyaan</label><textarea id="t-q" placeholder="Contoh: bayi 2 minggu gumoh setelah menyusu tapi masih lapar, perlu ke dokter?">' + Html.esc(this.q) + "</textarea>" +
        '<div class="row"><button class="btn-primary" type="submit"' + (this.busy ? " disabled" : "") + ">" + (this.busy ? "Menjawab…" : "Tanya") + "</button>" + (mic ? '<button type="button" data-act="mic" aria-label="Ucapkan pertanyaan"' + (this.busy ? " disabled" : "") + ">Ucapkan</button>" : "") + (this.busy ? '<button type="button" data-act="stop">Hentikan</button>' : "") + "</div></form>" +
        (this.err ? '<div class="banner warn">' + Html.esc(this.err) + "</div>" : "") +
        '<div id="t-res">' + this.localHtml() + "</div>" +
        (this.hits.length ? '<div class="card stack-s"><p class="eyebrow">Mungkin membantu</p><div class="list">' + this.hits.map(([href, t]) => '<a href="' + Html.esc(href) + '"><div><div class="t">' + Html.esc(t) + "</div></div>" + Html.chev() + "</a>").join("") + "</div></div>" : "") +
        (this.text ? '<div class="card stack-s"><p class="eyebrow">Jawaban online</p><div class="answer" id="t-ans">' + this.linkify(this.text) + "</div></div>" : "") +
        (this.res || this.text ? this.feedbackRow() : ""));
    }
    onInput(t) { if (t.id === "t-q") this.q = t.value; }
    onSubmit(form) { if (form.dataset.form !== "ask") return false; this.q = form.querySelector("textarea").value; this.local(); return false; }
    async ask() {
      if (!this.q.trim() || this.busy) return;
      this.busy = true; this.text = ""; this.err = ""; this.hits = []; this.app.render();
      this.ctl = new AbortController();
      try {
        const out = await this.source.ask(this.q, this.profile.ageDays, ({ text }) => { this.text = text; const el = document.getElementById("t-ans"); if (el) el.innerHTML = this.linkify(text); else this.app.render(); }, this.ctl.signal);
        this.text = out.text + (out.truncated ? "\n\n(Jawaban terpotong. Coba pertanyaan yang lebih spesifik.)" : "");
      } catch (e) {
        const c = e && e.code;
        this.err = c === "not_granted" ? "Izin untuk Claude di halaman ini ditolak, jadi fitur tanya tidak bisa dipakai di tampilan ini." : c === "rate_limited" ? "Terlalu banyak pertanyaan dalam waktu singkat. Coba lagi beberapa saat lagi." : c === "cancelled" ? "" : (!c && this.source instanceof AndroidSource && e && e.message) ? e.message : "Jawaban gagal dimuat. Periksa koneksi lalu coba lagi.";
        if (this.source instanceof AndroidSource && c !== "cancelled") this.hits = this.matchTopics(this.q);
      }
      this.busy = false; this.app.render();
    }
    async onClick(t) {
      if (t.dataset.act === "online-ask") { this.ask(); return "keep"; }
      if (t.dataset.pick !== undefined) { const x = this.res && this.res.results[Number(t.dataset.pick)]; if (x) { this.sel = x; return true; } return false; }
      if (t.dataset.start) {
        const id = t.dataset.start, c = this.kb.checkers.find(x => x.id === id), v = this.app.views.checker, sess = v.session(id);
        if (c && sess) {
          const ex = (this.res && this.res.extracted) || {}, pre = window.Engine.AskEngine.prefill(c, ex);
          sess.ageOverride = typeof ex.ageDays === "number" ? ex.ageDays : null;
          sess.reset();
          Object.keys(pre).forEach(k => v.prefill(id, k, String(pre[k])));
        }
        location.hash = "#cek-" + id; return "keep";
      }
      if (t.dataset.act === "stop") { if (this.ctl) this.ctl.abort(); return "keep"; }
      if (t.dataset.chip !== undefined) { const c = AskView.TOPICS[Number(t.dataset.chip)]; if (c) { this.q = c[1]; return true; } return false; }
      if (t.dataset.act === "mic") {
        const r = await this.source.listen();
        if (r && r.ok && r.text) { this.q = (this.q ? this.q.trim() + " " : "") + r.text; return true; }
        if (r && r.text) Toast.show(r.text);
        return "keep";
      }
      if (t.dataset.fb) {
        try {
          const arr = JSON.parse(localStorage.getItem("ab-feedback") || "[]");
          arr.push({ t: new Date().toISOString(), v: t.dataset.fb, q: this.q.trim(), a: (this.text || (this.sel ? this.sel.type + ":" + this.sel.id : "")).slice(0, 2000) });
          localStorage.setItem("ab-feedback", JSON.stringify(arr.slice(-200)));
        } catch (e) { /* penyimpanan tidak tersedia */ }
        Toast.show("Terima kasih atas masukannya.");
        return "keep";
      }
      if (t.dataset.act === "save-q") {
        try { await this.source.saveQuestion(this.q.trim()); Toast.show("Dicatat. Akan diriset pada pemeriksaan berikutnya."); }
        catch (e) { Toast.show(e && e.code === "permission_denied" ? "Anda tidak punya izin mencatat pertanyaan." : "Gagal mencatat."); }
        return "keep";
      }
      return false;
    }
  }

  class MilestoneView extends View {

      if (!ms.length) return this.page("<p>Data perkembangan belum ada.</p>");

        '<p class="muted">Daftar CDC 2022 berisi kemampuan yang dicapai paling sedikit 3 dari 4 anak pada usia tersebut. Bila anak belum mencapai salah satunya, sampaikan ke dokter saat kontrol.</p>' + this.sources(["cdc_milestones"]) +
        '<div class="tabs" role="group" aria-label="Usia">' + ms.map(x => '<button type="button" data-ms="' + Html.esc(x.id) + '" aria-pressed="' + (x.id === m.id) + '">' + Html.esc(x.label) + "</button>").join("") + "</div>" +
        '<div class="card stack-s"><div class="row" style="justify-content:space-between"><h2>' + Html.esc(m.label) + '</h2><span class="muted small">' + done + " dari " + all.length + " tercapai</span></div>" +
        Object.keys(names).filter(k => m.d[k] && m.d[k].length).map(k => '<div><p class="eyebrow" style="margin-top:8px">' + names[k] + "</p>" +
          m.d[k].map((t, i) => { const id = "ms-" + m.id + "-" + k + "-" + i; return '<div class="check"><input type="checkbox" id="' + id + '" data-mscheck="' + Html.esc(m.id + "|" + t) + '"' + (checked[m.id + "|" + t] ? " checked" : "") + '><label for="' + id + '">' + Html.esc(t) + "</label></div>"; }).join("") + "</div>").join("") + "</div>" +
        (isAgeTab && done < all.length ? '<div class="banner">Ada ' + (all.length - done) + " kemampuan yang belum dicentang. Itu belum berarti ada masalah; dokter akan menilainya dengan alat skrining resmi. Bila anak kehilangan kemampuan yang sebelumnya sudah bisa, konsultasikan lebih cepat.</div>" : "") +

  class Theme {
    static get() { return LocalStore.get("ab.theme", "auto"); }
    static apply(v) {
      const r = document.documentElement; if (v === "light" || v === "dark") r.dataset.theme = v; else delete r.dataset.theme;
      Theme.syncBars();
    }
    /** Warna status bar & navigasi Android mengikuti tema di dalam aplikasi, bukan hanya tema HP. */
    static syncBars() {
      const v = Theme.get(), dark = v === "dark" || (v !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      try { if (window.AndroidKB && window.AndroidKB.setDark) window.AndroidKB.setDark(dark); } catch (e) { /* versi web: abaikan */ }
    }
    static set(v) { LocalStore.set("ab.theme", v); Theme.apply(v); }
  }

  class ProfileView extends View {
    constructor(app) { super(app); this.askDelete = false; }
    render() {
      const p = this.profile, many = p.list.length > 1;
      const kids = many ? '<div class="stack-s"><p class="eyebrow">Pilih anak</p><div class="answers">' +
        p.list.map((k, i) => '<button type="button" data-kid="' + i + '" aria-pressed="' + (i === p.active) + '">' + Html.esc(Profile.labelOf(k)) + "</button>").join("") + "</div></div>" : "";
      const del = this.askDelete
        ? '<div class="banner warn stack-s"><p>Hapus data ' + Html.esc(p.name || "anak ini") + ' dari perangkat ini?</p><div class="row"><button type="button" class="btn-danger" data-act="del-yes">Ya, hapus</button><button type="button" data-act="del-no">Batal</button></div></div>'
        : (many || p.name || p.birth ? '<button type="button" class="btn-ghost" data-act="del-kid">Hapus anak ini</button>' : "");
      return this.page(Html.back("lainnya", "Lainnya") + "<h1>Profil anak</h1>" + kids +
        '<form data-form="profil" class="card stack"><div class="stack-s"><label for="p-nama">Nama panggilan (opsional)</label><input id="p-nama" value="' + Html.esc(p.name) + '" autocomplete="off"></div>' +
        '<div class="stack-s"><label for="p-lahir">Tanggal lahir</label><input id="p-lahir" type="date" max="' + Clock.today() + '" value="' + Html.esc(p.birth) + '"></div>' +
        '<button class="btn-primary" type="submit">Simpan</button></form>' +
        '<div class="row"><button type="button" data-act="add-kid">+ Tambah anak</button>' + (this.askDelete ? "" : del) + "</div>" + (this.askDelete ? del : "") +
        '<p class="small muted">Disimpan di perangkat ini saja, dipakai untuk menghitung usia pada setiap penilaian.</p>');
    }
    /** Ganti anak: jawaban cek gejala dan tab perkembangan milik anak sebelumnya dibuang. */
    changed() { this.askDelete = false; this.app.views.milestone.tab = null; this.app.views.checker.sessions = {}; }
    onClick(t) {
      const p = this.profile, a = t.dataset.act;
      if (t.dataset.kid !== undefined) { p.select(+t.dataset.kid); this.changed(); Toast.show("Sekarang: " + p.label); return true; }
      if (a === "add-kid") { p.add(); this.changed(); return true; }
      if (a === "del-kid") { this.askDelete = true; return true; }
      if (a === "del-no") { this.askDelete = false; return true; }
      if (a === "del-yes") { p.remove(); this.changed(); Toast.show("Data anak dihapus."); return true; }
      return false;
    }
    onSubmit(form) {
      if (form.dataset.form !== "profil") return false;
      this.profile.save(form.querySelector("#p-nama").value.trim(), form.querySelector("#p-lahir").value);
      this.app.views.milestone.tab = null; Toast.show("Profil disimpan."); location.hash = "#beranda"; return true;
    }
  }

  class DataView extends View {
    onlineLink() {
      return this.source instanceof AndroidSource ? '<button type="button" data-act="online">Buka versi online</button>' : '<a href="' + ONLINE_URL + '" target="_blank" rel="noopener">Buka versi online</a>';
    }
    unmatchedBlock() {
      let arr = [];
      try { arr = JSON.parse(localStorage.getItem("ab-unmatched") || "[]"); } catch (e) { arr = []; }
      if (!Array.isArray(arr) || !arr.length) return "";
      const body = arr.map(x => (x && x.q) || "").filter(Boolean).join("\n").slice(0, 1500);
      const href = "mailto:" + REPORT_EMAIL + "?subject=" + encodeURIComponent("Pertanyaan belum terjawab") + "&body=" + encodeURIComponent(body);
      return '<div class="card stack-s"><h3>Pertanyaan belum terjawab</h3><p class="small">' + arr.length + ' pertanyaan di perangkat ini belum ada jawabannya di data.</p><div class="row"><a class="btn" href="' + Html.esc(href) + '" style="text-decoration:none">Kirim ke pengembang</a></div></div>';
    }
    modeBlock() {
      const src = this.source;
      if (src instanceof CloudSource) {
        return '<div class="card stack-s"><h3>Versi offline</h3><p class="small">Satu file HTML dengan tampilan yang sama dan data saat ini sudah tertanam di dalamnya. Simpan di HP, lalu buka dengan Chrome; bisa dipakai tanpa internet. Fitur Tanya dan persetujuan usulan tetap hanya di versi online.</p>' +
          '<div class="row"><button type="button" class="btn-primary" data-act="export-offline"' + (src.canExportOffline ? "" : " disabled") + ">Unduh versi offline</button></div></div>" +
          '<div class="card stack-s"><h3>Data untuk aplikasi Android</h3><p class="small">Aplikasi Android menyimpan salinan data supaya tetap bisa dipakai tanpa internet. Setelah menyetujui usulan, unduh data terbaru, lalu di aplikasi Android buka Lainnya → Sumber & pembaruan → Impor file data.</p>' +
          '<div class="row"><button type="button" data-act="export"' + (src.canExport ? "" : " disabled") + ">Unduh data untuk APK</button></div>" + (src.canExport ? "" : '<p class="small muted">Unduhan tidak tersedia di tampilan ini.</p>') + "</div>";
      }
      if (src instanceof AndroidSource) {
        return '<div class="card stack"><h3>Perbarui data di perangkat ini</h3>' + (src.status ? '<div class="banner">' + Html.esc(src.status) + "</div>" : "") +
          '<div class="stack-s"><label for="k-url">Alamat file data (opsional)</label><input id="k-url" inputmode="url" placeholder="https://raw.githubusercontent.com/…/kb.json" value="' + Html.esc(src.bridge.getUrl()) + '"><p class="small muted">Bila diisi, aplikasi memeriksa data baru di alamat ini setiap kali dibuka.</p></div>' +
          '<div class="row"><button type="button" class="btn-primary" data-act="refresh">Periksa pembaruan</button><button type="button" data-act="import">Impor file data</button></div>' +
          '<p class="small">Tanya dan persetujuan usulan ada di versi online. ' + this.onlineLink() + '</p><p class="small muted">Data baru selalu diperiksa dulu; file yang memuat pernyataan tanpa sumber ditolak.</p></div>';
      }
      return '<div class="card stack-s"><h3>Versi offline</h3>' + (src.status ? '<div class="banner">' + Html.esc(src.status) + "</div>" : "") +
        '<p class="small">Data ' + (src.origin === "impor" ? "dari file yang Anda impor" : "tertanam di file ini") + '. Untuk data terbaru, buka versi online lalu unduh ulang versi offline, atau impor file data dari sana.</p>' +
        '<div class="row"><button type="button" data-act="import">Impor file data</button></div><p class="small">' + this.onlineLink() + '</p><p class="small muted">Data baru selalu diperiksa dulu; file yang memuat pernyataan tanpa sumber ditolak.</p></div>';
    }
    usulan(u, actionable) {
      const kind = u.type === "pertanyaan" ? "Pertanyaan untuk diriset" : "Pembaruan data";
      const st = { disetujui: "Disetujui", ditolak: "Ditolak", diriset: "Sudah diriset" }[u.status] || "Baru";
      return '<div class="card stack-s"><div class="row" style="justify-content:space-between"><span class="eyebrow">' + kind + '</span><span class="small muted">' + st + " · " + Html.esc(String(u.createdAt || "").slice(0, 10)) + "</span></div>" +
        "<p><strong>" + Html.esc(u.title || u.question || "") + "</strong></p>" + (u.summary ? '<p class="small">' + Html.esc(u.summary) + "</p>" : "") + (u.catatan ? '<p class="small muted">' + Html.esc(u.catatan) + "</p>" : "") +
        (Array.isArray(u.sources) && u.sources.length ? '<p class="src">Sumber: ' + u.sources.map(s => '<a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">' + Html.esc(s.title) + "</a>").join(" · ") + "</p>" : "") +
        (actionable && this.source.canApprove ? '<div class="row">' + (u.type !== "pertanyaan" && u.target ? '<button class="btn-primary" type="button" data-approve="' + Html.esc(u._id) + '">Setujui</button>' : "") + '<button type="button" data-reject="' + Html.esc(u._id) + '">' + (u.type === "pertanyaan" ? "Hapus dari antrean" : "Tolak") + "</button></div>" : "") + "</div>";
    }
    render() {
      const kb = this.kb, m = kb.meta, cloud = this.source instanceof CloudSource;
      const us = kb.usulan.slice().sort((a, b) => String(b.createdAt || "").localeCompare(String(a.createdAt || "")));
      const pend = us.filter(u => u.status === "baru"), done = us.filter(u => u.status !== "baru").slice(0, 10);
      const log = kb.changelog.slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
      const srcs = Object.entries(kb.sources).sort((a, b) => a[1].title.localeCompare(b[1].title));
      return this.page(Html.back("lainnya", "Lainnya") + "<h1>Sumber & pembaruan</h1>" +
        (m ? '<div class="card stack-s"><p><strong>Versi data ' + Html.esc(m.version) + '</strong></p><p class="small muted">Diverifikasi ' + Html.esc(m.verifiedDate) + " · pemeriksaan sumber terakhir " + Html.esc(m.lastCheck || "-") + '</p><p class="small">' + Html.esc(m.note || "") + "</p></div>" : "") +
        this.unmatchedBlock() +
        this.modeBlock() +
        '<div class="card stack-s"><h3>Cara data diperbarui</h3><ul class="items small"><li>Setiap tanggal 1, Claude memeriksa pedoman terbaru dari IDAI, Kemenkes, WHO, AAP, CDC, dan FDA, lalu menulis usulan perubahan beserta sumbernya.</li><li>Usulan tidak langsung mengubah data. Pemilik meninjau dan menyetujui; usulan yang memuat pernyataan tanpa sumber ditolak otomatis.</li><li>Pertanyaan yang belum terjawab di menu Tanya bisa dicatat untuk diriset.</li></ul></div>' +
        (cloud ? '<div class="stack-s"><h2>Usulan menunggu (' + pend.length + ")</h2>" + (pend.length ? pend.map(u => this.usulan(u, true)).join("") : '<p class="muted small">Tidak ada usulan baru.</p>') + "</div>" + (done.length ? '<div class="stack-s"><h3>Usulan yang sudah diputuskan</h3>' + done.map(u => this.usulan(u, false)).join("") + "</div>" : "") : "") +
        '<div class="stack-s"><h2>Riwayat perubahan</h2><div class="card stack-s">' + (log.length ? log.map(l => "<div><p><strong>" + Html.esc(l.title) + '</strong> <span class="muted small">' + Html.esc(l.date) + '</span></p><p class="small">' + Html.esc(l.text) + "</p></div>").join("") : '<p class="muted small">Belum ada.</p>') + "</div></div>" +
        '<div class="stack-s"><h2>Daftar sumber (' + srcs.length + ')</h2><div class="card"><ul class="items small">' + srcs.map(([id, s]) => '<li><a href="' + Html.esc(s.url) + '" target="_blank" rel="noopener">' + Html.esc(s.title) + "</a>" + (s.type === "sekunder" ? '<span class="tag">sekunder</span>' : "") + "</li>").join("") + "</ul></div></div>" + Html.footer());
    }
    async onClick(t) {
      const src = this.source;
      const run = async (fn, okMsg) => { try { await fn(); if (okMsg) Toast.show(okMsg); } catch (e) { Toast.show((e && e.message) || "Gagal."); } };
      if (t.dataset.approve) { const u = this.kb.usulan.find(x => x._id === t.dataset.approve); if (u) await run(() => src.approve(u), "Disetujui dan diterapkan."); return "keep"; }
      if (t.dataset.reject) { const u = this.kb.usulan.find(x => x._id === t.dataset.reject); if (u) await run(() => src.reject(u), "Usulan ditolak."); return "keep"; }
      const a = t.dataset.act;
      if (a === "export") { await run(() => src.exportForApk(), "Data diunduh."); return "keep"; }
      if (a === "export-offline") { await run(() => src.exportOffline(), "Versi offline diunduh."); return "keep"; }
      if (a === "online") { src.bridge.open(ONLINE_URL); return "keep"; }
      if (a === "refresh") { const u = document.getElementById("k-url"); if (u) src.bridge.setUrl(u.value.trim()); src.status = "Memeriksa…"; this.app.render(); await src.refresh(false); return true; }
      if (a === "import") { await src.importFile(); return true; }
      return false;
    }
  }

  // =============================================================
  // Aplikasi
  // =============================================================
  class Router {
    static parse() {
      const h = (location.hash || "#beranda").slice(1) || "beranda";
      const prefixes = [["cek-", "checker"], ["panduan-", "guide"]];
      for (const [p, name] of prefixes) if (h.startsWith(p)) return { name, param: h.slice(p.length), raw: h };
      const map = { beranda: "home", darurat: "emergency", cek: "checkers", napas: "breath", tanya: "ask", lainnya: "more", panduan: "guides", tumbuh: "milestone", imunisasi: "immunization", obat: "medicine", data: "data", profil: "profile" };
      return { name: map[h] || "home", param: null, raw: h };
    }
  }

  class App {
    constructor() {
      this.root = document.getElementById("app");
      this.navEl = document.getElementById("nav");
      this.kb = new KnowledgeBase();
      this.profile = new Profile();
      Theme.apply(Theme.get());
      if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => Theme.syncBars());
      this.source = new DataSource(this.kb);
      this.state = "loading";
      this.views = {
        home: new HomeView(this), emergency: new EmergencyView(this), checkers: new CheckerListView(this), checker: new CheckerView(this), breath: new BreathView(this),
        ask: new AskView(this), more: new MoreView(this), guides: new GuideListView(this), guide: new GuideView(this),
        milestone: new MilestoneView(this), immunization: new ImmunizationView(this), medicine: new MedicineView(this),
        data: new DataView(this), profile: new ProfileView(this)
      };
      this.route = Router.parse();
      this.bindEvents();
    }
    pickSource() {
      if (window.AndroidKB) return new AndroidSource(this.kb, new AndroidBridge(window.AndroidKB));
      if (window.claude && typeof window.claude.use === "function" && !StaticSource.embedded()) return new CloudSource(this.kb, window.claude);
      return new StaticSource(this.kb);
    }
    start() {
      const go = () => {
        this.source = this.pickSource();
        this.renderNav();
        this.source.start(() => { this.state = this.kb.isEmpty ? "empty" : "ready"; this.render(); }, () => { this.state = "failed"; this.render(); });
      };
      this.renderNav();
      if (window.AndroidKB || (window.claude && window.claude.use) || StaticSource.embedded()) go(); else setTimeout(go, 1500);
    }
    get currentView() { return this.views[this.route.name] || this.views.home; }
    renderNav() {
      const cloud = this.source instanceof CloudSource;
      const ICON = App.ICON;
      const canTanya = true;
      const fourth = canTanya ? ["tanya", "Tanya", "tanya"] : ["panduan", "Panduan", "panduan"];
      const items = [["beranda", "Beranda", "beranda"], ["cek", "Cek Gejala", "cek"], ["napas", "Hitung Napas", "napas"], fourth, ["lainnya", "Lainnya", "lainnya"]];
      const r = this.route;
      const group = (r.name === "checker" || r.name === "checkers") ? "cek" : (!canTanya && (r.name === "guides" || r.name === "guide")) ? "panduan" :
        ["guides", "guide", "milestone", "immunization", "medicine", "data", "profile", "more"].includes(r.name) ? "lainnya" : r.raw;
      this.navEl.innerHTML = items.map(([id, label, icon]) => '<a href="#' + id + '"' + (group === id ? ' aria-current="page"' : "") + ">" + ICON[icon] + "<span>" + label + "</span></a>").join("");
    }
    stateScreen() {
      const v = this.views.home;
      if (this.state === "failed") return v.page(this.source instanceof CloudSource || this.source.constructor === DataSource
        ? '<div class="card stack-s"><h2>Database belum terbaca</h2><p class="muted">Halaman ini membutuhkan akun claude.ai yang sudah masuk dan akses ke artifak ini. Buka ulang halaman setelah masuk.</p></div>'
        : '<div class="card stack-s"><h2>Data belum terbaca</h2><p class="muted">File data tidak ditemukan atau tidak lolos pemeriksaan sumber.</p></div>');
      if (this.state === "empty") return v.page('<div class="card stack-s"><h2>Database masih kosong</h2><p class="muted">Basis pengetahuan belum diisi. Setelah diisi, isinya muncul di sini otomatis.</p></div>');
      return null;
    }
    render() {
      this.renderNav();
      if (this.state === "loading") return;
      const screen = this.stateScreen();
      const active = document.activeElement, focusId = active && active.id, sel = active && active.selectionStart;
      this.root.innerHTML = screen || this.currentView.render(this.route.param);
      if (focusId) { const el = document.getElementById(focusId); if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) { /* jenis input tanpa seleksi */ } } }
    }
    bindEvents() {
      window.addEventListener("hashchange", () => { const prev = this.route.raw; this.route = Router.parse(); if (this.route.raw !== prev) window.scrollTo(0, 0);
        // Pindah dari hitung napas di tengah hitungan: hentikan dan lepas kunci layar agar baterai tidak terkuras.
        const br = this.views.breath; if (this.route.name !== "breath" && br.counter.running) { br.counter.reset(); br.releaseWake(); }
        this.render(); });
      document.addEventListener("click", async e => {
        const t = e.target.closest("button, a");
        if (!t || !this.root.contains(t)) return;
        const res = await this.currentView.onClick(t);
        if (res === true) this.render();
      });
      document.addEventListener("input", e => this.currentView.onInput(e.target));
      document.addEventListener("change", e => { const v = this.currentView; if (v.onChange && v.onChange(e.target)) this.render(); });
      document.addEventListener("submit", e => { e.preventDefault(); if (this.currentView.onSubmit(e.target)) this.render(); });
    }
  }
  App.ICON = {
    beranda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>',
    cek: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-3"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 13l2 2 4-4"/></svg>',
    napas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
    tanya: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M10 9.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2M12 14.5v.01"/></svg>',
    panduan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M8 7h7"/></svg>',
    lainnya: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'
  };

  const app = new App();
  window.__app = app;
  app.start();
})();
</script>
