<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Asisten Bayi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Gaya: Material Design 3 (Google), disalin lokal agar tetap jalan offline.
   - Warna  : @material/material-color-utilities 0.4.0, SchemeTonalSpot, seed #1f6f6a (warna lama aplikasi).
   - Ukuran : token @material/web 2.5.0 (tokens/versions/v0_192: md-sys-typescale, shape, state, elevation,
              md-comp-navigation-bar, filled/outlined/text-button, outlined/elevated-card, outlined-text-field, filter-chip).
   - Huruf  : Roboto (md-ref-typeface brand/plain); Android sudah memilikinya, versi online memuat dari Google Fonts.
   Warna tingkat (lv1-lv4) sengaja tetap: maknanya hijau-kuning-oranye-merah, bukan dekorasi tema. */
:root {
  --md-sys-color-primary: #006a65; --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #9df2ea; --md-sys-color-on-primary-container: #00504c;
  --md-sys-color-secondary-container: #cce8e5; --md-sys-color-on-secondary-container: #324b49;
  --md-sys-color-tertiary-container: #d0e4ff; --md-sys-color-on-tertiary-container: #304962;
  --md-sys-color-error: #ba1a1a; --md-sys-color-on-error: #ffffff;
  --md-sys-color-error-container: #ffdad6; --md-sys-color-on-error-container: #93000a;
  --md-sys-color-surface: #f4fbf9; --md-sys-color-on-surface: #161d1c; --md-sys-color-on-surface-variant: #3f4947;
  --md-sys-color-surface-container-lowest: #ffffff; --md-sys-color-surface-container-low: #eff5f3;
  --md-sys-color-surface-container: #e9efed; --md-sys-color-surface-container-high: #e3e9e8;
  --md-sys-color-surface-container-highest: #dde4e2;
  --md-sys-color-outline: #6f7978; --md-sys-color-outline-variant: #bec9c7;
  --md-sys-color-inverse-surface: #2b3231; --md-sys-color-inverse-on-surface: #ecf2f0;
  --md-sys-color-shadow: #000000;

  --md-sys-shape-corner-extra-small: 4px; --md-sys-shape-corner-small: 8px; --md-sys-shape-corner-medium: 12px;
  --md-sys-shape-corner-large: 16px; --md-sys-shape-corner-extra-large: 28px; --md-sys-shape-corner-full: 9999px;
  --md-sys-state-hover: 0.08; --md-sys-state-pressed: 0.12;
  /* md-sys-elevation level1/level2: bayangan kunci (opasitas .3) + ambien (opasitas .15), rumus elevation/internal/_elevation.scss */
  --md-sys-elevation-1: 0 1px 2px 0 rgb(0 0 0 / .3), 0 1px 3px 1px rgb(0 0 0 / .15);
  --md-sys-elevation-2: 0 1px 2px 0 rgb(0 0 0 / .3), 0 2px 6px 2px rgb(0 0 0 / .15);
  --md-sys-motion-easing-standard: cubic-bezier(0.2, 0, 0, 1); --md-sys-motion-duration-short4: 200ms;
  --md-ref-typeface: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;

  /* Nama lama dipetakan ke peran M3, supaya markup yang ada tidak perlu berubah. */
  --bg: var(--md-sys-color-surface);
  --surface: var(--md-sys-color-surface-container-lowest);
  --ink: var(--md-sys-color-on-surface);
  --muted: var(--md-sys-color-on-surface-variant);
  --line: var(--md-sys-color-outline-variant);
  --accent: var(--md-sys-color-primary);
  --accent-ink: var(--md-sys-color-on-primary);
  --accent-soft: var(--md-sys-color-secondary-container);
  --lv1: #2e7d4f; --lv1-bg: #e5f2ea;
  --lv2: #8a6400; --lv2-bg: #fbf1d6;
  --lv3: #b0480f; --lv3-bg: #fbe7da;
  --lv4: #b3232a; --lv4-bg: #fbe2e2;
  --font-display: var(--md-ref-typeface);
  --font-body: var(--md-ref-typeface);
  --radius: var(--md-sys-shape-corner-medium);
  --nav-h: 80px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --md-sys-color-primary: #81d5ce; --md-sys-color-on-primary: #003734;
  --md-sys-color-primary-container: #00504c; --md-sys-color-on-primary-container: #9df2ea;
  --md-sys-color-secondary-container: #324b49; --md-sys-color-on-secondary-container: #cce8e5;
  --md-sys-color-tertiary-container: #304962; --md-sys-color-on-tertiary-container: #d0e4ff;
  --md-sys-color-error: #ffb4ab; --md-sys-color-on-error: #690005;
  --md-sys-color-error-container: #93000a; --md-sys-color-on-error-container: #ffdad6;
  --md-sys-color-surface: #0e1514; --md-sys-color-on-surface: #dde4e2; --md-sys-color-on-surface-variant: #bec9c7;
  --md-sys-color-surface-container-lowest: #090f0f; --md-sys-color-surface-container-low: #161d1c;
  --md-sys-color-surface-container: #1a2120; --md-sys-color-surface-container-high: #252b2a;
  --md-sys-color-surface-container-highest: #2f3635;
  --md-sys-color-outline: #889391; --md-sys-color-outline-variant: #3f4947;
  --md-sys-color-inverse-surface: #dde4e2; --md-sys-color-inverse-on-surface: #2b3231;
  --surface: var(--md-sys-color-surface-container-low);
  --lv1: #7fd1a0; --lv1-bg: #183326; --lv2: #e8c25a; --lv2-bg: #352c12;
  --lv3: #f39a62; --lv3-bg: #3a2516; --lv4: #ff8b8b; --lv4-bg: #3d1c1e;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --md-sys-color-primary: #81d5ce; --md-sys-color-on-primary: #003734;
  --md-sys-color-primary-container: #00504c; --md-sys-color-on-primary-container: #9df2ea;
  --md-sys-color-secondary-container: #324b49; --md-sys-color-on-secondary-container: #cce8e5;
  --md-sys-color-tertiary-container: #304962; --md-sys-color-on-tertiary-container: #d0e4ff;
  --md-sys-color-error: #ffb4ab; --md-sys-color-on-error: #690005;
  --md-sys-color-error-container: #93000a; --md-sys-color-on-error-container: #ffdad6;
  --md-sys-color-surface: #0e1514; --md-sys-color-on-surface: #dde4e2; --md-sys-color-on-surface-variant: #bec9c7;
  --md-sys-color-surface-container-lowest: #090f0f; --md-sys-color-surface-container-low: #161d1c;
  --md-sys-color-surface-container: #1a2120; --md-sys-color-surface-container-high: #252b2a;
  --md-sys-color-surface-container-highest: #2f3635;
  --md-sys-color-outline: #889391; --md-sys-color-outline-variant: #3f4947;
  --md-sys-color-inverse-surface: #dde4e2; --md-sys-color-inverse-on-surface: #2b3231;
  --surface: var(--md-sys-color-surface-container-low);
  --lv1: #7fd1a0; --lv1-bg: #183326; --lv2: #e8c25a; --lv2-bg: #352c12;
  --lv3: #f39a62; --lv3-bg: #3a2516; --lv4: #ff8b8b; --lv4-bg: #3d1c1e;
  color-scheme: dark; }

html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
/* body-large: 16px / 24px, tracking .03125rem */
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.5rem; letter-spacing: 0.03125rem; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: 0; }
/* headline-medium 28/36 · title-large 22/28 · title-medium 16/24 (500) */
h1 { font-size: 1.75rem; line-height: 2.25rem; font-weight: 400; }
h2 { font-size: 1.375rem; line-height: 1.75rem; font-weight: 400; }
h3 { font-size: 1rem; line-height: 1.5rem; font-weight: 500; letter-spacing: 0.009375rem; }
p { margin: 0; }
a { color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
/* body-medium 14/20 */
.small { font-size: 0.875rem; line-height: 1.25rem; letter-spacing: 0.015625rem; }
/* label-medium 12/16 (500) */
.eyebrow { font-size: 0.75rem; line-height: 1rem; letter-spacing: 0.03125rem; color: var(--md-sys-color-primary); font-weight: 500; }
/* Kartu: outlined-card M3 (surface + outline-variant 1px, corner-medium) */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--md-sys-shape-corner-medium); padding: 16px; }

/* Tombol: M3 outlined/filled/tonal/text button — corner-full, label-large 14/20 (500).
   Tinggi 48px (bukan 40px token) agar sasaran sentuh >= 48dp sesuai panduan aksesibilitas M3. */
button, .btn { position: relative; overflow: hidden; font: inherit; font-size: 0.875rem; line-height: 1.25rem; font-weight: 500; letter-spacing: 0.00625rem; cursor: pointer; border-radius: var(--md-sys-shape-corner-full); border: 1px solid var(--md-sys-color-outline); background: transparent; color: var(--md-sys-color-primary); padding: 0 24px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-sizing: border-box; transition: box-shadow var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard); }
/* State layer M3: warna isi tombol, opasitas hover .08 / pressed .12 */
button::after, .btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard); pointer-events: none; }
@media (hover: hover) { button:hover::after, .btn:hover::after { opacity: var(--md-sys-state-hover); } }
button:active::after, .btn:active::after { opacity: var(--md-sys-state-pressed); }
.btn { text-align: center; }
.btn-big { display: flex; width: 100%; min-height: 56px; font-size: 1rem; line-height: 1.5rem; border-radius: var(--md-sys-shape-corner-large); }
.btn-danger { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); border-color: transparent; }
.btn-danger:hover { box-shadow: var(--md-sys-elevation-1); }
.btn-primary { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-color: transparent; }
.btn-primary:hover { box-shadow: var(--md-sys-elevation-1); }
.btn-tonal { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; }
.btn-ghost, .btn-text { background: transparent; border-color: transparent; padding: 0 12px; }
.icon-btn { width: 48px; padding: 0; border-color: transparent; font-size: 1.25rem; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--md-sys-color-primary); outline-offset: 2px; }
button:disabled { opacity: 0.38; cursor: default; }
button:disabled::after { display: none; }
/* Kolom isian: outlined-text-field M3 (corner-extra-small, outline 1px, fokus primary 2px) */
input, select, textarea { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-extra-small); padding: 12px 16px; min-height: 56px; width: 100%; box-sizing: border-box; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--md-sys-color-primary); box-shadow: inset 0 0 0 1px var(--md-sys-color-primary); }
textarea { min-height: 112px; resize: vertical; }
label { font-weight: 500; font-size: 0.875rem; color: var(--muted); }

/* Header: top app bar (small) */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { font-family: var(--font-display); font-weight: 400; font-size: 1.375rem; line-height: 1.75rem; }
/* Chip profil: assist chip M3 (32px, corner-small, outline) */
.child-chip { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--md-sys-color-outline); border-radius: var(--md-sys-shape-corner-small); font-size: 0.875rem; font-weight: 500; color: var(--ink); text-decoration: none; white-space: nowrap; }

/* Navigasi bawah: navigation-bar M3 — tinggi 80px, surface-container, indikator aktif pil 64x32 secondary-container */
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--md-sys-color-surface-container); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.bottom .inner { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.bottom a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--md-sys-color-on-surface-variant); font-size: 0.75rem; line-height: 1rem; font-weight: 500; letter-spacing: 0.03125rem; text-align: center; }
nav.bottom a svg { width: 24px; height: 24px; padding: 4px 20px; border-radius: var(--md-sys-shape-corner-full); box-sizing: content-box; transition: background-color var(--md-sys-motion-duration-short4) var(--md-sys-motion-easing-standard); }
nav.bottom a[aria-current="page"] { color: var(--md-sys-color-on-surface); font-weight: 700; }
nav.bottom a[aria-current="page"] svg { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }

/* Daftar menu: list M3 di dalam outlined card */
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--md-sys-shape-corner-medium); background: var(--surface); overflow: hidden; }
.list a, .list button { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 16px; min-height: 56px; text-decoration: none; color: var(--ink); border: 0; border-top: 1px solid var(--line); border-radius: 0; text-align: left; font-size: 1rem; font-weight: 400; position: relative; }
.list a::after { content: ""; position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }
.list a:active::after { opacity: var(--md-sys-state-pressed); }
.list a:first-child, .list button:first-child { border-top: 0; }
.list a .t { font-weight: 500; }
.list a .s { color: var(--muted); font-size: 0.875rem; line-height: 1.25rem; }
.list a .chev { color: var(--muted); flex: none; }
.list a > div { min-width: 0; }

/* Tingkat */
.lv { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; min-height: 32px; box-sizing: border-box; border-radius: var(--md-sys-shape-corner-small); font-weight: 500; font-size: 0.875rem; }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.lv-1 { color: var(--lv1); background: var(--lv1-bg); }
.lv-2 { color: var(--lv2); background: var(--lv2-bg); }
.lv-3 { color: var(--lv3); background: var(--lv3-bg); }
.lv-4 { color: var(--lv4); background: var(--lv4-bg); }
.result { border-radius: var(--md-sys-shape-corner-medium); padding: 16px; border: 1px solid var(--line); background: var(--surface); }
.result.r-1 { border-left: 6px solid var(--lv1); }
.result.r-2 { border-left: 6px solid var(--lv2); }
.result.r-3 { border-left: 6px solid var(--lv3); }
.result.r-4 { border-left: 6px solid var(--lv4); }
.result h2 { font-size: 1.5rem; line-height: 2rem; }
.result .lv { align-self: flex-start; }
.diff { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.diff:first-of-type { border-top: 0; padding-top: 0; }
.diff-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.freq { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.levels-key { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: start; }

/* Pertanyaan: pilihan = filter chip / segmented */
.q { padding: 14px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.q:first-child { border-top: 0; padding-top: 0; }
.q .help { font-size: 0.875rem; color: var(--muted); }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 auto; min-width: 72px; border-radius: var(--md-sys-shape-corner-small); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); border-color: transparent; color: var(--md-sys-color-on-secondary-container); }
.seg.col { flex-direction: column; }
.seg.col button { justify-content: flex-start; text-align: left; }
.num-in { display: flex; gap: 8px; align-items: center; }
.num-in input { max-width: 140px; }

/* Sumber */
.src { font-size: 0.75rem; line-height: 1rem; color: var(--muted); }
.src a { color: var(--muted); }
.tag { display: inline-flex; align-items: center; font-size: 0.75rem; line-height: 1rem; padding: 2px 8px; border-radius: var(--md-sys-shape-corner-small); border: 1px solid var(--md-sys-color-outline-variant); color: var(--muted); margin-left: 4px; font-weight: 500; }
.row > .tag { margin-left: 0; }
sup.ref { font-size: 0.7rem; color: var(--md-sys-color-primary); font-weight: 500; }
details.srcbox { border-top: 1px solid var(--line); padding-top: 4px; }
details.srcbox summary { cursor: pointer; min-height: 48px; display: flex; align-items: center; font-size: 0.875rem; font-weight: 500; color: var(--md-sys-color-primary); }
details.srcbox ol { margin: 0 0 8px; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 0.875rem; line-height: 1.25rem; }
details.srcbox a { color: var(--ink); }
ul.items { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.lead { font-size: 1rem; line-height: 1.5rem; }
.sec { font-weight: 500; font-size: 0.875rem; line-height: 1.25rem; color: var(--md-sys-color-primary); letter-spacing: 0.00625rem; margin-top: 4px; }
.watch { background: var(--md-sys-color-surface-container); border-radius: var(--md-sys-shape-corner-small); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.watch .sec { color: var(--ink); margin-top: 0; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.875rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 0.75rem; }

/* Hitung napas */
.counter { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-block: 8px; }
.ring { position: relative; width: min(64vw, 240px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .c-bg { fill: none; stroke: var(--md-sys-color-secondary-container); stroke-width: 10; }
.ring .c-fg { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
.ring .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
/* display-large 57/64 */
.ring .big { font-family: var(--font-display); font-size: 3.5625rem; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 4rem; }
.tap { width: 100%; min-height: 96px; font-size: 1.125rem; border-radius: var(--md-sys-shape-corner-extra-large); }

/* Milestone: filter chip */
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tabs button { flex: none; min-height: 48px; height: 48px; padding: 0 16px; border-radius: var(--md-sys-shape-corner-small); color: var(--ink); }
.tabs button[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); border-color: transparent; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 8px 0; }
.check input { width: 24px; height: 24px; min-height: 0; flex: none; margin-top: 0; accent-color: var(--accent); }
/* Label ikut jadi area ketuk, supaya baris checkbox setinggi >= 48px tanpa celah mati. */
.check label { flex: 1; min-height: 32px; padding: 2px 0; cursor: pointer; }
button, a, summary, label, input { touch-action: manipulation; }
/* Tautan sekunder di bawah daftar: tidak bersaing dengan keluhan utama, tetap 48px untuk jari. */
.more-link { display: inline-flex; align-items: center; min-height: 48px; padding: 0 4px; font-weight: 500; }

/* Tanya */
.answer { white-space: pre-wrap; }
.skeleton { height: 14px; border-radius: 6px; background: var(--md-sys-color-surface-container-high); }
.banner { border-radius: var(--md-sys-shape-corner-medium); padding: 12px 16px; background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); font-size: 0.875rem; line-height: 1.25rem; }
.banner a { color: inherit; font-weight: 500; }
.banner.warn { background: var(--lv2-bg); color: var(--ink); }
.fb { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.fb .small { margin-right: 4px; }
/* Snackbar M3: inverse-surface, corner-extra-small */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface); padding: 14px 16px; border-radius: var(--md-sys-shape-corner-extra-small); font-size: 0.875rem; z-index: 30; max-width: calc(100% - 32px); box-shadow: var(--md-sys-elevation-2); }

.progress { display: flex; flex-direction: column; gap: 6px; }

.bar > span { display: block; height: 100%; background: var(--accent); transition: width 0.2s ease; }

.qbig { font-family: var(--font-display); font-size: 1.5rem; font-weight: 400; line-height: 2rem; text-wrap: balance; }
.answers { display: flex; flex-direction: column; gap: 8px; }
.answers button { min-height: 56px; justify-content: flex-start; text-align: left; padding: 12px 16px; font-size: 1rem; font-weight: 400; border-radius: var(--md-sys-shape-corner-medium); color: var(--ink); border-color: var(--md-sys-color-outline-variant); }
.answers button[aria-pressed="true"] { background: var(--md-sys-color-secondary-container); border-color: transparent; color: var(--md-sys-color-on-secondary-container); font-weight: 500; }
.toggle { display: flex; gap: 12px; align-items: flex-start; justify-content: flex-start; text-align: left; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: var(--md-sys-shape-corner-medium); color: var(--ink); font-weight: 400; font-size: 1rem; border-color: var(--md-sys-color-outline-variant); }
.toggle .box { flex: none; width: 18px; height: 18px; border-radius: 2px; border: 2px solid var(--md-sys-color-on-surface-variant); margin-top: 3px; display: grid; place-items: center; }
.toggle[aria-pressed="true"] { border-color: var(--lv4); background: var(--lv4-bg); }

.toggle[aria-pressed="true"] .box::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.navrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.main-msg { font-size: 1rem; line-height: 1.5rem; }

.review-row > div { min-width: 0; }
.review-row button { flex: none; min-height: 48px; padding: 0 12px; }

i","text":"Kejang berlangsung 15 menit atau lebih?","type":"yn"},{"id":"fokal","text":"Kejang hanya di satu sisi atau satu bagian tubuh?","type":"yn"},{"id":"ulang","text":"Kejang terjadi lebih dari sekali dalam 24 jam?","type":"yn"},{"id":"sadar","text":"Anak sudah kembali sadar dan merespons seperti biasa?","type":"yn"}],"rules":[{"id":"r-kejang","when":{"any":[{"yes":"demam"},{"no":"demam"}]},"level":4,"text":"Kejang termasuk tanda bahaya umum WHO, jadi anak dibawa ke fasilitas kesehatan.","src":["who_imci_danger"]},{"id":"n-sederhana","when":{"all":[{"yes":"demam"},{"age":[">=",180]},{"age":["\u003c=",1825]},{"no":"durasi"},{"no":"fokal"},{"no":"ulang"}]},"level":0,"text":"Gambaran ini sesuai kriteria kejang demam sederhana AAP: usia 6–60 bulan, seluruh tubuh, kurang dari 15 menit, tidak berulang dalam 24 jam. Kejang demam terjadi pada 2–5 dari 100 anak. Kejang demam sederhana umumnya tidak memerlukan EEG, tes darah, atau pencitraan; dokter fokus mencari sumber demam.","src":["aap_febrile"]},{"id":"n-kompleks","when":{"all":[{"yes":"demam"},{"age":[">=",180]},{"age":["\u003c=",1825]},{"any":[{"yes":"durasi"},{"yes":"fokal"},{"yes":"ulang"}]}]},"level":0,"text":"Gambaran ini sesuai kriteria kejang demam kompleks AAP (fokal, 15 menit atau lebih, atau berulang dalam 24 jam).","src":["aap_febrile"]},{"id":"n-usia","when":{"all":[{"yes":"demam"},{"any":[{"age":["\u003c",180]},{"age":[">",1825]}]}]},"level":0,"text":"Definisi kejang demam AAP berlaku untuk usia 6–60 bulan. Usia anak di luar rentang itu, jadi dokter perlu menilai penyebab lain.","src":["aap_febrile"]},{"id":"n-ulang","when":{"yes":"demam"},"level":0,"text":"Sekitar 1 dari 3 anak mengalami kejang demam lagi. Obat penurun panas tidak mengurangi risiko kejang demam berulang.","src":["febrile_recur"]}],"default":{"level":4,"title":"Bawa ke fasilitas kesehatan","text":"Kejang termasuk tanda bahaya umum WHO.","src":["who_imci_danger"]},"differentials":[],"care":[{"t":"Pertolongan pertama kejang di rumah dan "asip","asi kurang","pumping","laktasi","menyusu","asi perah","puting lecet","asi seret","asi sedikit","asi ga keluar","asi tidak keluar","kurang asi"],"examples":["asi eksklusif sampe kapan","bayi 1 bln nyusu brp kali sehari","asi kurang gmn ya bun","bayi boleh minum air putih sblm 6 bln","tanda bayi cukup asi apa"],"sections":[{"h":"Rekomendasi WHO","items":[{"t":"Mulai menyusu dalam 1 jam pertama setelah lahir.","src":["who_bf"]},{"t":"ASI saja selama 6 bulan pertama, tanpa makanan atau minuman lain, termasuk air.","src":["who_bf"]},{"t":"Lanjutkan menyusu bersama MPASI sampai 2 tahun atau lebih, sesuai permintaan bayi.","src":["who_bf"]}]},{"h":"Tanda asupan cukup (bayi baru lahir)","items":[{"t":"Menyusu 8–12 kali dalam 24 jam.","src":["cdc_newborn"]},{"t":"Mulai hari ke-5: minimal 6 popok basah sehari.","src":["cdc_newborn"]},{"t":"Berat sedikit turun di minggu pertama itu normal pada bayi ASI; bayi seharusnya kembali ke berat lahir di hari ke-10–14. Bila belum, periksakan ke bidan atau dokter.","src":["cdc_newborn"]}]}]},{"id":"mpasi","order":2,"title":"MPASI","aliases":["mpasi","makanan pendamping","makan bayi","bubur bayi","mulai makan","bayi mulai makan","tekstur makan","finger food","bayi susah makan","gtm","porsi makan bayi","bayi tolak makan"],"examples":["mpasi mulai umur brp","bb 7bln porsi mpasi brp sdm","anak gtm mpasi gmn","bayi 10 bln tekstur makanan apa","boleh kasih garam gula di mpasi ga"],"sections":[{"h":"Pedoman WHO 2023","items":[{"t":"Mulai MPASI di usia 6 bulan (180 hari) sambil tetap menyusu.","src":["who_cf"]},{"t":"Makanan hewani (daging, ikan, telur) setiap hari.","src":["who_cf"]},{"t":"Hindari makanan dan minuman tinggi gula, garam, lemak trans, dan pemanis non-gula; batasi jus.","src":["who_cf"]},{"t":"Ikuti tanda lapar dan kenyang anak (responsive feeding).","src":["who_cf"]},{"t":"Tanpa ASI: usia 6–11 bulan boleh susu formula atau susu hewani; usia 12–23 bulan susu hewani, follow-up formula tidak direkomendasikan WHO. Sebagian perhimpunan gastroenterologi anak tidak setuju dengan poin susu hewani ini.","src":["who_cf","jpgn2024"]}]},{"h":"Tabel praktis (Kemenkes)","table":{"head":["Usia","Tekstur","Frekuensi","Porsi per makan"],"rows":[["6–8 bulan","Lumat / bubur kental","2–3× makan + 1–2× selingan","Mulai 2–3 sdm sampai ½ mangkuk 250 ml"],["9–11 bulan","Cincang halus/kasar, finger food","3–4× makan + 1–2× selingan","½ sampai ¾ mangkuk"],["12–23 bulan","Makanan keluarga","3–4× makan + 1–2× selingan","¾ sampai 1 mangkuk"]]},"src":["mpasi_kemenkes"]},{"h":"Keamanan makanan","items":[{"t":"Madu dilarang sebelum usia 12 bulan dalam bentuk apa pun, termasuk produk olahan seperti kue atau madu yang dioleskan ke dot (risiko botulisme bayi). Ibu menyusui yang makan madu tidak menularkan spora lewat ASI.","src":["honey","honey_sfa","honey_fsai"]},{"t":"Di bawah 1 tahun jangan beri jus. Usia 1–3 tahun: jus tidak wajib; bila diberi, maksimal ±120 ml (4 ons) jus buah 100% per hari.","src":["aap_juice"]}]}]},{"id":"suplemen","order":3,"title":"Vitamin & suplemen","aliases":["vitamin","suplemen","vit d","vitamin d","zat besi","vitamin a","kapsul biru","kapsul merah","tetes vitamin","vit bayi","sangobion","anemia"],"examples":["bayi asi perlu vit d ga","vitamin a kapan dikasih di posyandu","zat besi bayi umur brp mulai","kapsul biru buat usia brp","bayi 5 bln perlu suplemen apa"],"sections":[{"h":"Vitamin D","items":[{"t":"400 IU per hari untuk bayi sampai usia 1 tahun (bayi ASI atau ASI sebagian); 600 IU per hari di atas 1 tahun.","src":["aap_vitd"]},{"t":"IDAI menganjurkan vitamin D sejak lahir dengan dosis yang sama.","src":["idai_vitd"]}]},{"h":"Zat besi (rekomendasi IDAI)","items":[{"t":"Bayi cukup bulan: 2 mg/kgBB/hari, usia 4 bulan–2 tahun, maksimal 15 mg/hari.","src":["idai_besi"]},{"t":"Bayi berat lahir rendah (\u003c 2.500 g): 3 mg/kgBB/hari, usia 1 bulan–2 tahun.","src":["idai_besi"]},{"t":"AAP: bayi ASI 1 mg/kgBB/hari mulai 4 bulan sampai makanan kaya besi masuk; skrining anemia di usia 12 bulan.","src":["aap_vitd"]},{"t":"Suplementasi besi rutin untuk semua bayi ASI masih diperdebatkan; beberapa lembaga di Kanada, Inggris, Eropa, dan Selandia Baru tidak menganjurkannya secara rutin. Untuk Indonesia ikuti IDAI dan konsultasikan ke dokter.","src":["dga_iron"]}]},{"h":"Vitamin A (gratis, program Kemenkes)","items":[{"t":"Diberikan setiap Februari dan Agustus di posyandu atau puskesmas.","src":["kemenkes_vita"]},{"t":"Kapsul biru 100.000 IU untuk bayi 6–11 bulan (1 kali). Kapsul merah 200.000 IU untuk anak 12–59 bulan (2 kali setahun).","src":["kemenkes_vita"]}]}]},{"id":"tidur","order":4,"title":"Tidur aman","aliases":["tidur","tidur bayi","tidur aman","tengkurap","bedong","sids","jam tidur","tidur telentang","bayi tidur tengkurap","sleep","tidur miring","bayi susah tidur","bantal bayi","tidur sama ortu"],"examples":["bayi tidur tengkurap boleh ga","bayi 3bln harusnya tidur brp jam","boleh bedong bayi pas tidur","bayi tidur seranjang sama ortu aman ga","bumper box bayi perlu ga"],"sections":[{"h":"Rekomendasi AAP 2022","items":[{"t":"Telentang setiap kali tidur sampai usia 1 tahun. Miring dan tengkurap tidak aman.","src":["aap_sleep"]},{"t":"Alas datar, keras, tidak miring. Area tidur kosong: tanpa selimut longgar, bantal, bumper, atau boneka.","src":["aap_sleep"]},{"t":"Sekamar dengan orang tua tetapi tidak seranjang, idealnya minimal 6 bulan pertama.","src":["aap_sleep"]},{"t":"Hindari tempat tidur miring, bedong atau selimut berpemberat, dan tidur di sofa atau kursi.","src":["aap_sleep"]},{"t":"Tummy time saat bayi bangun dan diawasi.","src":["aap_sleep"]}]},{"h":"Durasi tidur (WHO, termasuk tidur siang)","table":{"head":["Usia","Tidur per hari"],"rows":[["0–3 bulan","14–17 jam"],["4–11 bulan","12–16 jam"],["1–2 tahun","11–14 jam"],["3–4 tahun","10–13 jam"]]},"src":["who_activity"]}]},{"id":"layar","order":5,"title":"Layar & aktivitas","aliases":["layar","gadget","hp","nonton tv","screen time","youtube","tablet","main hp","tv","tontonan","aktivitas anak","gawai","cocomelon"],"examples":["anak 1thn boleh nonton youtube ga","screen time anak 3 thn brp jam","bayi 8bln nonton tv bahaya","anak kecanduan gadget","aktivitas fisik anak 2thn brp menit"],"sections":[{"h":"WHO 2019","table":{"head":["Usia","Aktivitas","Layar"],"rows":[["\u003c 1 tahun","Aktif beberapa kali sehari; tummy time minimal 30 menit/hari bagi yang belum bisa bergerak sendiri","Tidak dianjurkan"],["1–2 tahun","Minimal 180 menit/hari","1 tahun: tidak dianjurkan; 2 tahun: maksimal 1 jam"],["3–4 tahun","Minimal 180 menit/hari, 60 menit di antaranya intensitas sedang–berat","Maksimal 1 jam"]]},"src":["who_activity"]},{"h":"Catatan","items":[{"t":"Jangan biarkan anak terikat di stroller, kursi makan, atau gendongan lebih dari 1 jam sekaligus.","src":["who_activity"]},{"t":"WHO: layar tidak dianjurkan untuk bayi dan anak usia 1 tahun; usia 2 tahun maksimal 1 jam sehari.","src":["who_screen"]}]}]},{"id":"tersedak","order":6,"title":"Tersedak","aliases":["tersedak","keselek","ke selek","kesedak","nyangkut di tenggorokan","heimlich","bayi keselek","anak tersedak","tertelan benda","menelan koin","rjp","bayi tidak bisa napas"],"examples":["bayi keselek ga bisa nangis gmn","anak tersedak kacang tolong","bayi 8 bln tersedak mpasi","tepuk punggung bayi tersedak caranya","anak keselek tapi masih batuk"],"sections":[{"h":"Bayi di bawah 1 tahun yang tidak bisa menangis atau batuk","items":[{"t":"1. Telungkupkan bayi di lengan Anda, kepala lebih rendah dari badan, lalu beri hingga 5 tepukan di punggung di antara tulang belikat.","src":["medline_choke_infant","nhs_choke"]},{"t":"2. Bila belum keluar, balikkan bayi telentang dengan kepala lebih rendah, lalu beri hingga 5 tekanan dada dengan 2 jari di tengah dada, tepat di bawah garis puting.","src":["nhs_choke","medline_choke_infant"]},{"t":"3. Ulangi bergantian sampai benda keluar. Bila bayi tidak sadar, panggil bantuan (119/112) dan mulai RJP di alas datar dan keras.","src":["medline_choke_infant","nhs_choke"]},{"t":"Jangan lakukan hentakan perut pada bayi di bawah 1 tahun, dan jangan mencolok jari ke mulut bila bendanya tidak terlihat.","src":["acep_choke"]}]},{"h":"Anak 1 tahun ke atas","items":[{"t":"Bila anak masih bisa batuk kuat, dorong ia terus batuk.","src":["medline_choke_child","nhs_choke"]},{"t":"Bila tidak bisa bernapas, bicara, atau batuk: 5 tepukan punggung lalu 5 hentakan perut, bergantian.","src":["medline_choke_child"]}]}]},{"id":"gigi","order":7,"title":"Tumbuh gigi","aliases":["tumbuh gigi","gigi","teething","gigi pertama","ngences","gusi bengkak","gigit gigit","gigi tumbuh","anak mau tumbuh gigi","kalung gigi","dokter gigi anak","gusi"],"examples":["bayi 6 bln gigi mau tumbuh rewel","gel gusi buat bayi tumbuh gigi aman ga","kalung amber buat gigi bayi","kapan bawa anak ke dokter gigi","bayi ngences gigit gigit apa mau tumbuh gigi"],"sections":[{"h":"Yang perlu dihindari (FDA)","items":[{"t":"Jangan pakai gel atau obat oles benzokain untuk anak di bawah 2 tahun.","src":["fda_teething"]},{"t":"Jangan pakai perhiasan tumbuh gigi seperti kalung amber: FDA menerima laporan kematian dan cedera serius akibat tercekik dan tersedak.","src":["fda_jewelry"]}]},{"h":"Kontrol gigi","items":[{"t":"Kontrol pertama ke dokter gigi saat gigi pertama tumbuh atau menjelang usia 12 bulan.","src":["gigi_idai"]}]}]},{"id":"bbl","order":8,"title":"Bayi baru lahir","aliases":["baru lahir","skrining","shk","tali pusat","perawatan bayi baru lahir","tumit","skrining pendengaran","pusar bayi","hipotiroid","bayi lahir","bbl","perawatan tali pusat"],"examples":["skrining shk bayi kapan","tali pusat bayi belum lepas","bayi baru lahir dites pendengaran perlu ga","perawatan pusar bayi gmn","bayi 3 hari kuning perlu cek bilirubin"],"sections":[{"h":"Skrining","items":[{"t":"SHK (Skrining Hipotiroid Kongenital): 2–3 tetes darah tumit di usia 48–72 jam, gratis di fasilitas kesehatan. Bila positif, diobati sebelum usia 1 bulan.","src":["kemenkes_shk","kemenkes_shk_2022"]},{"t":"Skrining pendengaran: sebelum usia 1 bulan; bila tidak lolos, diagnosis sebelum 3 bulan dan intervensi sebelum 6 bulan.","src":["jcih"]}]},{"h":"Perawatan","items":[{"t":"Tali pusat dirawat bersih dan kering.","src":["who_cord"]},{"t":"Kuning: AAP menganjurkan semua bayi diperiksa bilirubin di usia 24–48 jam. Kuning dalam 24 jam pertama, urin gelap, atau tinja pucat perlu diperiksa.","src":["aap_bili","nhs_jaundice"]}]}]},{"id":"tumbuh","order":9,"title":"Pertumbuhan","aliases":["stunting","pertumbuhan","berat badan","bb","tinggi badan","tb","kurus","gizi","bb tidak naik","pendek","kurva","growth","bb turun","gizi buruk"],"examples":["bb anak ga naik 2 bulan","stunting itu apa","anak 2thn tinggi 80cm pendek ga","bayi kurus gmn","cara ukur panjang badan bayi"],"sections":[{"h":"Stunting (standar WHO)","items":[{"t":"Stunting: panjang/tinggi badan menurut umur di bawah −2 SD median WHO; stunting berat di bawah −3 SD.","src":["stunting"]},{"t":"Ukur panjang berbaring untuk anak di bawah 2 tahun, tinggi berdiri untuk 2 tahun ke atas.","src":["stunting"]},{"t":"Ukur tinggi juga, bukan hanya berat. Masa paling menentukan adalah sejak kehamilan sampai usia 2 tahun.","src":["stunting"]}]}]},{"id":"aman","order":10,"title":"Pencegahan cedera","aliases":["cedera","jatuh","tenggelam","kecelakaan","luka bakar","keracunan","bahaya rumah","child proofing","jatuh dari kasur","kepala kebentur","terjatuh","obat terkunci","baby proofing"],"examples":["bayi jatuh dari kasur gmn","anak deket kolam bahaya","bayi minum sabun keracunan","cara aman simpen obat dr anak","anak kebentur kepala muntah"],"sections":[{"h":"WHO","items":[{"t":"Anak usia 0–4 tahun punya angka tenggelam tertinggi. Risiko naik saat anak dekat air tanpa pengawasan aktif orang dewasa.","src":["who_drowning"]},{"t":"Penyebab utama kematian akibat cedera pada anak: kecelakaan lalu lintas, tenggelam, luka bakar, jatuh, dan keracunan.","src":["who_injury"]},{"t":"Simpan obat, bahan kimia, dan pembersih terkunci dan jauh dari jangkauan anak.","src":["aap_poison"]}]}]},{"id":"ibu","order":11,"title":"Kesehatan ibu","aliases":["baby blues","depresi pascapersalinan","ppd","ibu sedih","stres ibu","postpartum","capek mental","nangis terus ibu","kesehatan ibu","ibu baru","burnout","mood swing"],"examples":["baby blues sampe kapan","aku sering nangis habis lahiran normal ga","ppd tanda tandanya apa","ibu pengen nyakitin bayi","stres ngurus bayi gmn"],"sections":[{"h":"Baby blues atau depresi pascapersalinan?","table":{"head":["","Baby blues","Depresi pascapersalinan"],"rows":[["Kejadian","Sekitar 8 dari 10 ibu","Sekitar 1–2 dari 10 ibu"],["Mulai","2–3 hari setelah melahirkan","Beberapa minggu sampai 1 tahun setelah melahirkan"],["Lama","Sampai ± 2 minggu","Berbulan-bulan atau lebih"],["Gejala","Mood naik-turun, cemas, menangis, sulit tidur","Lebih berat: putus asa, kehilangan minat, mudah marah, sulit konsentrasi, pikiran menyakiti bayi"]]},"src":["ppd"]},{"h":"Kapan mencari bantuan","items":[{"t":"Gejala lebih dari 2 minggu, makin berat, atau mengganggu merawat diri dan bayi: hubungi dokter, bidan, atau psikolog.","src":["nimh_ppd","ppd"]},{"t":"Ada pikiran menyakiti diri atau bayi: cari bantuan hari ini.","src":["nimh_ppd"]}]}]},{"id":"skrining","order":12,"title":"Skrining perkembangan","aliases":["skrining perkembangan","autis","mchat","m-chat","speech delay","telat bicara","terlambat bicara","tumbuh kembang","kembang anak","autisme","anak telat jalan","developmental"],"examples":["anak 2thn belum bicara autis ga","mchat itu apa","skrining perkembangan umur brp","anak 18 bln gak nunjuk benda","speech delay gmn"],"sections":[{"h":"Jadwal (AAP)","items":[{"t":"Skrining perkembangan umum di usia 9, 18, dan 30 bulan.","src":["cdc_autism"]},{"t":"Skrining autisme (misalnya M-CHAT-R) di usia 18 dan 24 bulan untuk semua anak.","src":["cdc_autism"]}]}]},{"id":"lapar","order":13,"title":"Tanda lapar & kenyang","aliases":["tanda lapar","tanda kenyang","masih lapar","masih haus","bayi lapar","bayi kenyang","ngemut       const danger = DangerDetector.detect(norm, { ageDays, tempC: extracted.tempC, drugs: extracted.drugs });
      let results = this.index.search(text, 1000);
      const ms = this.kb.milestones || [];
      if (ageDays !== null && ms.length && norm.split(" ").some(x => AskEngine.DEV_WORDS[x])) {
        const months = ageDays / 30.4375;
        let near = ms[0];
        ms.forEach(m => { if (Math.abs(m.months - months) < Math.abs(near.months - months)) near = m; });
        const hit = results.filter(r => r.type === "milestone" && r.id === near.id)[0];
        if (hit) hit.score = Math.round((hit.score + AskEngine.MILESTONE_BONUS) * 1000) / 1000;
        else results.push({ type: "milestone", id: near.id, title: "Perkembangan " + near.label, score: AskEngine.MILESTONE_BONUS });
        results.sort((a, b) => b.score - a.score);
      }
      results = results.slice(0, 5);
      let confidence = "none";
      if (results.length) {
        const top = results[0].score, second = results.length > 1 ? results[1].score : 0;
        confidence = top >= AskEngine.HIGH_SCORE && top >= AskEngine.HIGH_RATIO * second ? "high" : "low";
      }
      let best = results.length ? Object.assign({}, results[0]) : null;
      if (best && best.type === "checker") {
        const c = (this.kb.checkers || []).filter(x => x.id === best.id)[0];

  AskEngine.MILESTONE_BONUS = 4;
  AskEngine.DEV_WORDS = { bisa: 1, belum: 1, jalan: 1, berjalan: 1, lari: 1, bicara: 1, merangkak: 1, tengkurap: 1, duduk: 1, berdiri: 1, perkembangan: 1, harusnya: 1, seharusnya: 1, tonggak: 1, milestone: 1, lancar: 1, merespons: 1, senyum: 1, tersenyum: 1, mengoceh: 1 };

  class Profile {

  /** Basis pengetahuan yang sedang aktif, dari sumber data mana pun. */
  class KnowledgeBase {
    constructor() { this.clear(); }
    clear() { this.sources = {}; this.checkers = []; this.guides = []; this.milestones = []; this.obat = []; this.mitos = []; this.changelog = []; this.usulan = []; this.meta = null; this.imunisasi = null; }
    load(kb) {
      this.sources = kb.sources || {}; this.checkers = kb.checkers || []; this.guides = kb.guides || []; this.milestones = kb.milestones || [];
      this.obat = kb.obat || []; this.mitos = kb.mitos || []; this.changelog = kb.changelog || []; this.meta = kb.meta || null; this.imunisasi = kb.imunisasi || null;
    }
    get isEmpty() { return !this.checkers.length; }
    get isStale() { return !!this.meta && Age.monthsSince(this.meta.verifiedDate) >= (this.meta.reviewMonths || 12); }
    byOrder(list) { return list.slice().sort((a, b) => (a.order || 99) - (b.order || 99)); }
    checker(id) { const d = this.checkers.find(c => c.id === id); return d ? new SymptomChecker(d) : null; }
    guide(id) { return this.guides.find(g => g.id === id) || null; }
    source(id) { return this.sources[id] || null; }
    snapshot() {
      const strip = o => { const c = { ...o }; delete c._id; return c; };
      return { sources: this.sources, checkers: this.checkers.map(strip), guides: this.guides.map(strip), milestones: this.milestones.map(strip), obat: this.obat.map(strip), mitos: this.mitos.map(strip), imunisasi: this.imunisasi, meta: this.meta, changelog: this.changelog.map(strip) };
    }
    /** Bandingkan versi seperti "2026.11.07-10": pisah di "." dan "-", bandingkan angka. Hasil -1, 0, 1. */
    static compareVersion(a, b) {
      const part = v => String(v == null ? "" : v).split(/[.\-]/).map(x => parseInt(x, 10) || 0);
      const x = part(a), y = part(b), n = Math.max(x.length, y.length);
      for (let i = 0; i < n; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d < 0 ? -1 : 1; }
      return 0;
    }
    static parse(text) {
      let kb;
      try { kb = JSON.parse(text); } catch (e) { return { error: "File bukan JSON yang valid." }; }
      if (!kb || !Array.isArray(kb.checkers) || !kb.meta) return { error: "Isi file bukan data Asisten Bayi." };
      const errs = KnowledgeValidator.validate(kb);
      if (errs.length) return { error: "Ditolak karena ada pernyataan tanpa sumber: " + errs[0] };
      return { kb };
    }
  }

  /** Satu sesi menjawab satu penilai: langkah tanda bahaya, lalu satu pertanyaan per layar. */
  class CheckerSession {
    constructor(checker, profile) { this.checker = checker; this.profile = profile; this.answers = {}; this.step = null; this.skippedByUrgent = false; this.ageOverride = null; this.reset(); }
    // Umur yang disebut di pertanyaan Tanya lebih spesifik daripada profil, jadi dipakai lebih dulu.
    get ctx() { return { ageDays: typeof this.ageOverride === "number" ? this.ageOverride : this.profile.ageDays }; }
    get parts() { return this.checker.split(this.answers, this.ctx); }
    reset() { this.answers = {}; this.skippedByUrgent = false; this.step = this.parts.danger.length ? "danger" : 0; }
    get assessment() { return this.checker.assess(this.answers, this.ctx); }
    get questions() { return this.parts.rest; }
    get total() { return this.questions.length + (this.parts.danger.length ? 1 : 0); }
    get position() { if (this.step === "danger") return 1; if (this.step === "result") return this.total; return this.step + 1 + (this.parts.danger.length ? 1 : 0); }
    get current() { return typeof this.step === "number" ? this.questions[this.step] : null; }
    toggleDanger(qid) { this.answers[qid] = this.answers[qid] === "ya" ? undefined : "ya"; }
    get dangerSelected() { return this.parts.danger.filter(q => this.answers[q.id] === "ya").length; }
    confirmDanger() {
      this.parts.danger.forEach(q => { if (this.answers[q.id] !== "ya") this.answers[q.id] = "tidak"; });
      if (this.assessment.isUrgent) { this.skippedByUrgent = this.questions.length > 0; this.step = "result"; return; }
      this.step = this.questions.length ? 0 : "result";
    }
    answer(qid, value) {
      this.answers[qid] = value;
      if (this.assessment.isUrgent) { this.skippedByUrgent = this.step !== "result" && typeof this.step === "number" && this.step < this.questions.length - 1; this.step = "result"; return; }
      this.next();
    }
    next() {
      if (typeof this.step !== "number") return;
      const qs = this.questions;
      const i = qs.indexOf(this.current);
      this.step = i + 1 < qs.length ? i + 1 : "result";
    }
    back() {
      if (this.step === "result") { this.step = this.questions.length ? this.questions.length - 1 : (this.parts.danger.length ? "danger" : 0); return; }
      if (typeof this.step === "number") { this.step = this.step > 0 ? this.step - 1 : (this.parts.danger.length ? "danger" : 0); }
    }
    goTo(qid) {
      if (this.parts.danger.some(q => q.id === qid)) { this.step = "danger"; return; }
      const i = this.questions.findIndex(q => q.id === qid);
      if (i >= 0) this.step = i;
    }
    /** Pertanyaan wajib yang dilewati tanpa jawaban; ditampilkan di hasil agar orang tua tahu hasilnya bisa kurang tepat. */
    get unanswered() { return this.questions.filter(q => !q.optional && (this.answers[q.id] === undefined || this.answers[q.id] === "")).length; }
    get reviewRows() {
      const all = this.checker.visibleQuestions(this.answers, this.ctx);
      return all.filter(q => this.answers[q.id] !== undefined && this.answers[q.id] !== "").map(q => ({ q, label: CheckerSession.answerLabel(q, this.answers[q.id]) }));
    }
    static answerLabel(q, v) {
      if (q.type === "yn") return v === "ya" ? "Ya" : v === "tidak" ? "Tidak" : "Tidak tahu";
      if (q.type === "choice") { const o = q.options.find(x => x.v === v); return o ? o.label : v; }
      return v + (q.unit ? " " + q.unit : "");
    }
  }

  /** Penghitung napas 60 detik. Ambang WHO per usia. */
  class BreathCounter {
    constructor(onTick, onDone) { this.onTick = onTick; this.onDone = onDone; this.reset(); }
    reset() { clearInterval(this.timer); this.running = false; this.left = 60; this.count = 0; this.done = false; }
    start() {
      this.reset(); this.running = true;
      const t0 = Date.now();
      this.timer = setInterval(() => {
        this.left = Math.max(0, 60 - Math.floor((Date.now() - t0) / 1000));
        if (this.left <= 0) { clearInterval(this.timer); this.running = false; this.done = true; this.onDone(); } else this.onTick();
      }, 250);
    }
    tap() { if (this.running) this.count++; }
    static threshold(days) {
      if (days === null) return null;
      if (days <= 28) return { min: 61, label: "lebih dari 60×/menit", src: ["who_newborn"], level: 4 };
      if (days < 60) return null;
      if (days < 365) return { min: 50, label: "50×/menit atau lebih", src: ["who_imci_pneu"], level: 3 };
      if (days <= 1825) return { min: 40, label: "40×/menit atau lebih", src: ["who_imci_pneu"], level: 3 };
      return null;
    }
  }

  // =============================================================

  // =============================================================
  class DataSource {
    constructor(kb) { this.kb = kb; }
    get mode() { return "static"; }
    get canAsk() { return false; }

  /** Versi online: database artifak claude.ai, tanya Claude, persetujuan usulan. */
  class CloudSource extends DataSource {
    constructor(kb, claude) { super(kb); this.claude = claude; this.db = null; this.sample = null; this.downloads = null; this.editor = false; }
    get mode() { return "db"; }
    get canAsk() { return true; }
    get canAskOnline() { return !!this.sample; }
    get canApprove() { return this.editor; }
    get canExport() { return !!this.downloads; }
    async start(onReady, onFail) {
      const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map(n => this.claude.use(n)));
      this.db = db; this.sample = sample; this.downloads = downloads;
      this.editor = user ? await user.canEdit().catch(() => false) : false;
      if (!db) { onFail(); return; }
      const kb = this.kb, pending = new Set(["sources", "checkers", "guides", "milestones", "obat", "mitos", "changelog", "usulan", "meta", "imunisasi"]);
      let ready = false;
      const timer = setTimeout(() => { if (!ready) onFail(); }, 10000);
      const settle = key => { pending.delete(key); if (!pending.size && !ready) { ready = true; clearTimeout(timer); } if (ready) onReady(); };
      const fail = () => { clearTimeout(timer); onFail(); };
      const coll = (name, apply) => db.collection(name).onSnapshot(s => { apply(s.docs.map(d => ({ ...d.data(), _id: d.id }))); settle(name); }, fail);
      coll("sources", docs => { kb.sources = Object.fromEntries(docs.map(d => { const { _id, ...r } = d; return [_id, r]; })); });
      coll("checkers", docs => { kb.checkers = docs; });
      coll("guides", docs => { kb.guides = docs; });
      coll("milestones", docs => { kb.milestones = docs; });
      coll("obat", docs => { kb.obat = docs; });
      coll("mitos", docs => { kb.mitos = docs; });
      coll("changelog", docs => { kb.changelog = docs; });
      coll("usulan", docs => { kb.usulan = docs; });
      db.doc("kb/meta").onSnapshot(s => { kb.meta = s.exists ? s.data() : null; settle("meta"); }, fail);
      db.doc("kb/imunisasi").onSnapshot(s => { kb.imunisasi = s.exists ? s.data() : null; settle("imunisasi"); }, fail);
    }
    async ask(question, ageDays, onText, signal) {
      const prompt = new AskPrompt(this.kb, ageDays).build(question);
      return this.sample(prompt, { signal, cache: false, onText });
    }
    async approve(u) {
      const coll = u.target && u.target.collection, id = u.target && u.target.id;
      if (!["checkers", "guides", "milestones", "obat", "kb", "sources"].includes(coll) || !u.patch) throw new Error("Target usulan tidak dikenali.");
      const trial = JSON.parse(JSON.stringify(this.kb.snapshot()));
      Object.assign(trial.sources, u.newSources || {});
      const put = (arr) => { const i = arr.findIndex(x => x.id === id); if (i >= 0) arr[i] = u.patch; else arr.push(u.patch); };
      if (coll === "sources") trial.sources[id] = u.patch;
      else if (coll === "kb" && id === "imunisasi") trial.imunisasi = u.patch;
      else if (trial[coll]) put(trial[coll]);
      const errs = KnowledgeValidator.validate(trial);
      if (errs.length) throw new Error("Ditolak otomatis: " + errs[0]);
      for (const [sid, s] of Object.entries(u.newSources || {})) await this.db.doc("sources/" + sid).set(s);
      await this.db.doc(coll + "/" + id).set(u.patch);
      const d = Clock.today(), stamp = d.replace(/-/g, ".");
      const v = (this.kb.meta && this.kb.meta.version) || "";
      const seq = v.startsWith(stamp) ? parseInt(v.split("-")[1] || "0", 10) + 1 : 1;
      await this.db.doc("kb/meta").update({ version: stamp + "-" + seq, verifiedDate: d });
      await this.db.doc("changelog/" + d + "-" + Date.now()).set({ date: d, title: u.title || "Pembaruan data", text: u.summary || "", by: "Disetujui pemilik", usulan: u._id });
      await this.db.doc("usulan/" + u._id).update({ status: "disetujui", decidedAt: new Date().toISOString() });
    }
    async reject(u) { await this.db.doc("usulan/" + u._id).update({ status: "ditolak", decidedAt: new Date().toISOString() }); }
    async saveQuestion(q) { await this.db.collection("usulan").add({ type: "pertanyaan", question: q, title: q.slice(0, 140), status: "baru", createdAt: new Date().toISOString() }); }
    get canExportOffline() { return !!this.downloads && !!document.getElementById("offline-tpl"); }
    async exportOffline() {
      const snap = this.kb.snapshot();
      const errs = KnowledgeValidator.validate(snap);
      if (errs.length) throw new Error("Data tidak lolos pemeriksaan: " + errs[0]);
      const tpl = JSON.parse(document.getElementById("offline-tpl").textContent);
      const kbText = JSON.stringify(snap).replace(/</g, "\\u003c");
      const html = tpl.replace("/*KB_" + "EMBED*/", () => kbText);
      await this.downloads.save({ filename: "asisten-bayi-offline-" + snap.meta.version + ".html", data: html });
    }
    async exportForApk() {
      const snap = this.kb.snapshot();
      const errs = KnowledgeValidator.validate(snap);
      if (errs.length) throw new Error("Data tidak lolos pemeriksaan: " + errs[0]);
      await this.downloads.save({ filename: "asisten-bayi-data-" + snap.meta.version + ".json", data: JSON.stringify(snap) });
    }
  }

  /** Jembatan ke kode Java di aplikasi Android. */
  class AndroidBridge {
    constructor(native) { this.native = native; this.seq = 0; this.cbs = {}; window.__androidCb = (id, ok, text) => { const f = this.cbs[id]; delete this.cbs[id]; if (f) f(ok, text); }; }
    call(method, arg) { return new Promise(resolve => { const id = ++this.seq; this.cbs[id] = (ok, text) => resolve({ ok, text }); if (arg === undefined) this.native[method](id); else this.native[method](arg, id); }); }
    getKb() { return this.native.getKb(); }
    save(text) { return this.native.save(text); }
    getUrl() { return this.native.getUrl() || ""; }
    setUrl(u) { this.native.setUrl(u); }
    open(url) { this.native.openUrl(url); }
    fetch(url) { return this.call("fetchText", url); }
    pickFile() { return this.call("pickFile"); }
    listen() { return this.call("listen"); }
  }

  /** Aplikasi Android: data tersimpan di perangkat, bisa dipakai tanpa internet. */
  class AndroidSource extends DataSource {
    constructor(kb, bridge) { super(kb); this.bridge = bridge; this.status = ""; }
    get mode() { return "android"; }
    get canUpdateLocal() { return true; }
    get canAsk() { return true; }
    get canAskOnline() { return CHAT_URL.indexOf("REPLACE") < 0; }
    get canListen() { return !!(window.AndroidKB && window.AndroidKB.listen); }
    listen() { return this.bridge.listen(); }
    static deviceId() {
      try {
        let id = localStorage.getItem("ab-device");
        if (!id) { id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("ab-device", id); }
        return id;
      } catch (e) { return "anon"; }
    }
    /** Tanya lewat Worker: respons text/plain dialirkan; antarmuka sama dengan CloudSource.ask. */
    async ask(question, ageDays, onText, signal) {
      const cancelled = () => { const c = new Error("cancelled"); c.code = "cancelled"; return c; };
      let res;
      try {
        res = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question, ageDays, deviceId: AndroidSource.deviceId() }), signal });
      } catch (e) {
        if (e && e.name === "AbortError") throw cancelled();
        throw new Error("Tidak ada koneksi. Coba cek gejala di menu Cek.");
      }
      if (res.status === 429) throw new Error("Batas pertanyaan hari ini tercapai.");
      if (!res.ok || !res.body) throw new Error("Jawaban gagal dimuat. Coba lagi nanti.");
      const reader = res.body.getReader(), dec = new TextDecoder();
      let text = "";
      try {
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          text += dec.decode(value, { stream: true });
          onText({ text });
        }
      } catch (e) {
        if (signal && signal.aborted) throw cancelled();
        if (!text) throw new Error("Tidak ada koneksi. Coba cek gejala di menu Cek.");
      }
      text += dec.decode();
      onText({ text });
      return { text, truncated: false };
    }
    start(onReady, onFail) {
      const r = KnowledgeBase.parse(this.bridge.getKb() || "");
      if (r.error) { onFail(); return; }
      this.kb.load(r.kb); onReady();
      this.refresh(true).then(changed => { if (changed) onReady(); });
    }
    accept(text, fromUrl) {
      const r = KnowledgeBase.parse(text);
      if (r.error) { this.status = r.error; return false; }
      const cur = this.kb.meta ? String(this.kb.meta.version) : "";
      if (fromUrl && cur && KnowledgeBase.compareVersion(r.kb.meta.version, cur) <= 0) { this.status = "Data sudah terbaru (versi " + cur + ")."; return false; }
      if (!this.bridge.save(text)) { this.status = "Gagal menyimpan data di perangkat."; return false; }
      this.kb.load(r.kb); this.status = "Data diperbarui ke versi " + r.kb.meta.version + "."; return true;
    }
    async refresh(silent) {
      const url = this.bridge.getUrl();
      if (!url) { if (!silent) this.status = "Alamat file data belum diisi. Gunakan Impor file data, atau isi alamatnya."; return false; }
      const res = await this.bridge.fetch(url);
      if (!res.ok) { if (!silent) this.status = "Tidak bisa mengambil data: " + res.text; return false; }
      const before = this.status, changed = this.accept(res.text, true);
      if (silent && !changed) this.status = before;
      return changed;
    }
    async importFile() { const res = await this.bridge.pickFile(); if (!res.ok) { if (res.text) this.status = res.text; return false; } return this.accept(res.text, false); }
  }

  /** File lokal / peramban biasa: data tertanam di file, bisa diganti dengan impor file data. */
  class StaticSource extends DataSource {
    constructor(kb) { super(kb); this.status = ""; this.origin = ""; }
    get canUpdateLocal() { return true; }
    get canAsk() { return true; }
    static embedded() { const el = document.getElementById("kb-embed"); return el ? el.textContent.trim() : ""; }
    static stored() { try { return localStorage.getItem("ab.kb") || ""; } catch (e) { return ""; } }
    start(onReady, onFail) {
      const pick = (...texts) => {
        let best = null;
        texts.forEach(([t, origin]) => { if (!t) return; const r = KnowledgeBase.parse(t); if (!r.error && (!best || KnowledgeBase.compareVersion(r.kb.meta.version, best.kb.meta.version) > 0)) best = { kb: r.kb, origin }; });
        return best;
      };
      const finish = best => { if (!best) { onFail(); return; } this.kb.load(best.kb); this.origin = best.origin; onReady(); };
      const local = pick([StaticSource.embedded(), "tertanam"], [StaticSource.stored(), "impor"]);
      if (local) { finish(local); return; }
      fetch("kb.json").then(r => (r.ok ? r.text() : "")).then(t => finish(pick([t, "kb.json"]))).catch(onFail);
    }
    importFile() {
      return new Promise(resolve => {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".json,application/json";
        inp.onchange = () => {
          const f = inp.files && inp.files[0];
          if (!f) { resolve(false); return; }
          const rd = new FileReader();
          rd.onload = () => {
            const r = KnowledgeBase.parse(String(rd.result));
            if (r.error) { this.status = r.error; resolve(false); return; }
            try { localStorage.setItem("ab.kb", String(rd.result)); } catch (e) { this.status = "Data terbaca, tetapi peramban ini tidak mengizinkan penyimpanan. Data hanya berlaku sampai halaman ditutup."; }
            this.kb.load(r.kb); this.origin = "impor";
            if (!this.status) this.status = "Data diperbarui ke versi " + r.kb.meta.version + ".";
            resolve(true);
          };
          rd.onerror = () => { this.status = "File tidak bisa dibaca."; resolve(false); };
          rd.readAsText(f);
        };
        inp.click();
      });
    }
  }

  class CheckerView extends View {
    constructor(app) { super(app); this.sessions = {}; this.id = null; }
    session(id) {
      const checker = this.kb.checker(id);
      if (!checker) return null;
      let s = this.sessions[id];
      if (!s || s.checker.def !== checker.def) { const old = s; s = this.sessions[id] = new CheckerSession(checker, this.profile); if (old) { s.answers = old.answers; s.step = old.step; } }
      return s;
    }
    render(id) {
      this.id = id;
      const s = this.session(id);
      if (!s) return this.page('<p>Keluhan ini belum ada di database.</p>' + Html.back("cek", "Semua keluhan"));
      const def = s.checker.def;
      let body = Html.back("cek", "Semua keluhan") + "<h1>" + Html.esc(def.title) + "</h1>";
      if (typeof s.ageOverride === "number") body += '<div class="banner">Memakai umur dari pertanyaan Anda: <strong>' + Html.esc(Age.label(s.ageOverride)) + "</strong>." + (this.profile.hasAge ? "" : ' <a href="#profil">Simpan tanggal lahir</a> agar tidak perlu ditulis lagi.') + "</div>";
      else if (def.needsAge && !this.profile.hasAge) body += '<div class="banner warn">Usia anak belum diisi, padahal beberapa kriteria bergantung pada usia. <a href="#profil">Isi tanggal lahir</a></div>';
      if (s.step === "result") body += this.result(s);
      else if (s.step === "danger") body += this.progress(s) + this.dangerStep(s);
      else body += this.progress(s) + this.questionStep(s);
      return this.page(body);
    }
    progress(s) {
      const pct = Math.round((s.position - 1) / Math.max(1, s.total) * 100);
      return '<div class="progress"><span class="small muted">Langkah ' + s.position + " dari " + s.total + '</span><div class="bar" aria-hidden="true"><span style="width:' + pct + '%"></span></div></div>';
    }
    dangerStep(s) {
      const qs = s.parts.danger, n = s.dangerSelected;
      return '<div class="card stack"><div class="stack-s"><p class="qbig">Pertama, adakah salah satu tanda ini?</p><p class="small muted">Ketuk yang ada. Tanda-tanda ini dicek lebih dulu karena masing-masing sudah cukup untuk segera mencari pertolongan.</p></div>' +
        '<div class="answers">' + qs.map(q => '<button type="button" class="toggle" data-danger="' + Html.esc(q.id) + '" aria-pressed="' + (s.answers[q.id] === "ya") + '"><span class="box" aria-hidden="true"></span><span>' + Html.esc(q.text) + "</span></button>").join("") + "</div>" +
        '<button type="button" class="btn-primary" data-act="danger-ok">' + (n ? "Lihat hasil" : "Tidak ada, lanjut") + "</button></div>";
    }
    questionStep(s) {
      const q = s.current;
      if (!q) return "";
      const v = s.answers[q.id];
      let ctl;
      if (q.type === "yn") {
        const opts = [["ya", "Ya"], ["tidak", "Tidak"]].concat(q.allowUnknown ? [["tdk-tahu", "Tidak tahu"]] : []);
        ctl = '<div class="answers">' + opts.map(([val, l]) => '<button type="button" data-ans="' + Html.esc(q.id) + '" data-v="' + val + '" aria-pressed="' + (v === val) + '">' + l + "</button>").join("") + "</div>";
      } else if (q.type === "choice") {
        ctl = '<div class="answers">' + q.options.map(o => '<button type="button" data-ans="' + Html.esc(q.id) + '" data-v="' + Html.esc(o.v) + '" aria-pressed="' + (v === o.v) + '">' + Html.esc(o.label) + "</button>").join("") + "</div>";
      } else {
        ctl = '<form class="stack-s" data-form="num"><div class="num-in"><input id="num-' + Html.esc(q.id) + '" inputmode="decimal" value="' + Html.esc(v || "") + '" aria-label="' + Html.esc(q.text) + '"><span class="muted">' + Html.esc(q.unit || "") + '</span></div><div class="row"><button class="btn-primary" type="submit">Lanjut</button>' + (q.optional ? '<button type="button" data-act="skip">Lewati</button>' : "") + "</div></form>";
      }
      return '<div class="card stack"><label class="qbig"' + (q.type === "number" ? ' for="num-' + Html.esc(q.id) + '"' : "") + ">" + Html.esc(q.text) + "</label>" + (q.help ? '<p class="small muted">' + Html.esc(q.help) + "</p>" : "") + ctl + "</div>" +
        '<div class="navrow"><button type="button" class="btn-ghost" data-act="back">‹ Kembali</button>' + (q.type === "yn" ? '<button type="button" class="btn-ghost" data-act="skip">Lewati</button>' : "") + "</div>";

    shareButton(s, r, lv, main, mainSrc) {
      const short = t => { const i = t.indexOf(" — "); return i > 0 ? t.slice(0, i) : t; };
      const names = (mainSrc || []).map(id => this.kb.source(id)).filter(Boolean).map(x => short(x.title));
      const lines = [s.checker.def.title];
      if (this.profile.hasAge) lines.push("Usia anak: " + Age.label(this.profile.ageDays));
      lines.push(lv.action, main);
      if (names.length) lines.push("Sumber: " + names.join(", "));
      lines.push("", "Asisten Bayi · " + POWERED);
      return '<a class="btn" href="' + Html.esc("https://wa.me/?text=" + encodeURIComponent(lines.join("\n"))) + '" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">Bagikan ke WA</a>';
    }
    legend() {
      const keyText = { 1: "Pola yang umum, tanpa tanda bahaya.", 2: "Satu tanda belum memenuhi kriteria. Perhatikan beberapa jam ke depan.", 3: "Bawa ke dokter hari ini.", 4: "Ada tanda bahaya. Ke IGD sekarang." };
      return '<div class="card"><details><summary>Arti hasil</summary><div class="levels-key" style="margin-top:8px">' + [1, 2, 3, 4].map(l => Html.levelChip(l) + '<span class="small">' + keyText[l] + "</span>").join("") + "</div></details></div>";
    }
    result(s) {
      const r = s.assessment, lv = r.levelInfo;
      const main = r.summary || (r.reasons[0] && r.reasons[0].text) || "";
      const mainSrc = r.summary ? r.summarySrc : (r.reasons[0] ? r.reasons[0].src : []);
      // Pesan utama di atas (CDC Clear Communication Index): tingkat, tindakan, lalu alasannya.
      let h = '<div class="result r-' + r.level + '" aria-live="polite"><div class="stack-s">' + Html.levelChip(r.level) + "<h2>" + Html.esc(lv.action) + "</h2>" +
        (r.summary && r.headline !== lv.name ? '<p class="eyebrow">' + Html.esc(r.headline) + "</p>" : "") +
        '<p class="main-msg">' + Html.esc(main) + "</p>" + this.sources(mainSrc) + "</div></div>";
      if (r.level >= 3) h += Html.emergency();
      h += this.shareButton(s, r, lv, main, mainSrc);
      if (s.skippedByUrgent) h += '<p class="small muted">Pertanyaan lain dilewati karena sudah ada tanda yang perlu segera ditangani.</p>';
      else if (s.unanswered) h += '<div class="banner warn">' + s.unanswered + " pertanyaan dilewati, jadi hasil ini bisa kurang tepat. Buka \"Jawaban Anda\" di bawah untuk melengkapinya.</div>";
      const more = r.reasons.slice(1);
      if (more.length) h += '<div class="card stack-s"><h3>Alasan lain</h3>' + more.map(x => "<div><p>" + Html.esc(x.text) + "</p>" + this.sources(x.src) + "</div>").join("") + "</div>";
      r.notes.forEach(n => { h += '<div class="banner"><p>' + Html.esc(n.text) + "</p>" + this.sources(n.src) + "</div>"; });
      if (!r.isUrgent) {
        if (r.differentials.length) h += '<div class="card stack-s"><h3>Kemungkinan, dari yang paling sering</h3>' +
          r.differentials.map(d => '<div class="diff"><p class="diff-h"><strong>' + Html.esc(d.name) + '</strong><span class="freq">' + Html.esc(d.freq) + "</span></p><p class=\"small\">" + Html.esc(d.features) + "</p>" + this.sources(d.src) + "</div>").join("") + "</div>";
        if (r.care.length) h += '<div class="card stack-s"><h3>Yang bisa dilakukan sekarang</h3><ul class="items">' + r.care.map(x => "<li>" + Html.esc(x.t) + this.sources(x.src) + "</li>").join("") + "</ul></div>";
        if (r.escalate.length) h += '<div class="card stack-s"><h3>Periksakan bila kemudian muncul</h3><ul class="items">' + r.escalate.map(x => "<li>" + Html.esc(x) + "</li>").join("") + "</ul></div>";
      }
      h += this.legend();
      const rows = s.reviewRows;
      h += '<div class="card"><details class="review"><summary>Jawaban Anda (' + rows.length + ")</summary>" +
        rows.map(x => '<div class="review-row"><div><p class="small">' + Html.esc(x.q.text) + '</p><p class="small"><strong>' + Html.esc(x.label) + '</strong></p></div><button type="button" data-goto="' + Html.esc(x.q.id) + '">Ubah</button></div>').join("") + "</details></div>";
      h += '<div class="navrow"><button type="button" class="btn-ghost" data-act="back">‹ Kembali</button><button type="button" data-act="restart">Mulai ulang</button></div>';
      h += '<p class="small muted">Hasil ini berupa kemungkinan berdasarkan kriteria resmi, bukan vonis.' + (r.level <= 2 ? " Bila Anda tetap khawatir, periksakan anak meski hasilnya hijau atau kuning." : "") + "</p>";
      return h;
    }
    onClick(t) {
      const s = this.id && this.sessions[this.id];
      if (!s) return false;
      if (t.dataset.danger) { s.toggleDanger(t.dataset.danger); return true; }
      if (t.dataset.ans) { s.answer(t.dataset.ans, t.dataset.v); window.scrollTo(0, 0); return true; }
      if (t.dataset.goto) { s.goTo(t.dataset.goto); return true; }
      const act = t.dataset.act;
      if (act === "danger-ok") { s.confirmDanger(); window.scrollTo(0, 0); return true; }
      if (act === "back") { s.back(); return true; }
      if (act === "skip") { s.next(); return true; }
      if (act === "restart") { s.reset(); return true; }
      return false;
    }
    onSubmit(form) {
      const s = this.id && this.sessions[this.id];
      if (!s || form.dataset.form !== "num" || !s.current) return false;
      const val = form.querySelector("input").value.trim();
      if (val === "") { s.next(); return true; }
      s.answer(s.current.id, val); return true;
    }
    prefill(id, qid, value) { const s = this.session(id); if (s) s.answers[qid] = value; }
  }

  class BreathView extends View {
    constructor(app) {
      super(app);
      this.counter = new BreathCounter(() => this.tick(), () => { BreathView.buzz([200, 100, 200]); this.releaseWake(); this.app.render(); });
      this.wake = null;
    }
    /** Getar singkat: mata orang tua ke dada anak, bukan ke layar. Diam saja bila tidak didukung. */
    static buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* abaikan */ } }
    /** Jaga layar tetap menyala selama 60 detik penghitungan. */
    async holdWake() { try { if (navigator.wakeLock) this.wake = await navigator.wakeLock.request("screen"); } catch (e) { this.wake = null; } }
    releaseWake() { try { if (this.wake) this.wake.release(); } catch (e) { /* abaikan */ } this.wake = null; }
    tick() {
      const l = document.getElementById("b-left"); if (l) l.textContent = this.counter.left + " detik";
      const fg = document.querySelector(".ring .c-fg");
      if (fg) { const C = 2 * Math.PI * 52; fg.setAttribute("stroke-dashoffset", (C - C * (this.counter.left / 60)).toFixed(1)); }
    }
    render() {
      const c = this.counter, d = this.profile.ageDays, th = BreathCounter.threshold(d);
      const C = 2 * Math.PI * 52, off = C * (c.left / 60);
      let res = "";
      if (c.done) {
        const fast = th && c.count >= th.min;
        res = '<div class="result r-' + (fast ? th.level : 1) + '"><div class="stack-s"><h2>' + c.count + "×/menit</h2>" +

      if (t.dataset.approve) { const u = this.kb.usulan.find(x => x._id === t.dataset.approve); if (u) await run(() => src.approve(u), "Disetujui dan diterapkan."); return "keep"; }
      if (t.dataset.reject) { const u = this.kb.usulan.find(x => x._id === t.dataset.reject); if (u) await run(() => src.reject(u), "Usulan ditolak."); return "keep"; }
      const a = t.dataset.act;
      if (a === "export") { await run(() => src.exportForApk(), "Data diunduh."); return "keep"; }
      if (a === "export-offline") { await run(() => src.exportOffline(), "Versi offline diunduh."); return "keep"; }

      if (a === "import") { await src.importFile(); return true; }
      return false;
    }

  class Router {
    static parse() {
      const h = (location.hash || "#beranda").slice(1) || "beranda";
      const prefixes = [["cek-", "checker"], ["panduan-", "guide"]];
      for (const [p, name] of prefixes) if (h.startsWith(p)) return { name, param: h.slice(p.length), raw: h };
      const map = { beranda: "home", darurat: "emergency", cek: "checkers", napas: "breath", tanya: "ask", lainnya: "more", panduan: "guides", tumbuh: "milestone", imunisasi: "immunization", obat: "medicine", data: "data", profil: "profile" };
      return { name: map[h] || "home", param: null, raw: h };
    }
  }

  class App {
    constructor() {
      this.root = document.getElementById("app");
      this.navEl = document.getElementById("nav");
      this.kb = new KnowledgeBase();
      this.profile = new Profile();
      Theme.apply(Theme.get());
      this.source = new DataSource(this.kb);
      this.state = "loading";
      this.views = {
        home: new HomeView(this), emergency: new EmergencyView(this), checkers: new CheckerListView(this), checker: new CheckerView(this), breath: new BreathView(this),
        ask: new AskView(this), more: new MoreView(this), guides: new GuideListView(this), guide: new GuideView(this),
        milestone: new MilestoneView(this), immunization: new ImmunizationView(this), medicine: new MedicineView(this),
        data: new DataView(this), profile: new ProfileView(this)
      };
      this.route = Router.parse();
      this.bindEvents();
    }
    pickSource() {
      if (window.AndroidKB) return new AndroidSource(this.kb, new AndroidBridge(window.AndroidKB));
      if (window.claude && typeof window.claude.use === "function" && !StaticSource.embedded()) return new CloudSource(this.kb, window.claude);
      return new StaticSource(this.kb);
    }
    start() {
      const go = () => {
        this.source = this.pickSource();
        this.renderNav();
        this.source.start(() => { this.state = this.kb.isEmpty ? "empty" : "ready"; this.render(); }, () => { this.state = "failed"; this.render(); });
      };
      this.renderNav();
      if (window.AndroidKB || (window.claude && window.claude.use) || StaticSource.embedded()) go(); else setTimeout(go, 1500);
    }
    get currentView() { return this.views[this.route.name] || this.views.home; }
    renderNav() {
      const cloud = this.source instanceof CloudSource;
      const ICON = App.ICON;
      const canTanya = true;
      const fourth = canTanya ? ["tanya", "Tanya", "tanya"] : ["panduan", "Panduan", "panduan"];
      const items = [["beranda", "Beranda", "beranda"], ["cek", "Cek Gejala", "cek"], ["napas", "Hitung Napas", "napas"], fourth, ["lainnya", "Lainnya", "lainnya"]];
      const r = this.route;
      const group = (r.name === "checker" || r.name === "checkers") ? "cek" : (!canTanya && (r.name === "guides" || r.name === "guide")) ? "panduan" :
        ["guides", "guide", "milestone", "immunization", "medicine", "data", "profile", "more"].includes(r.name) ? "lainnya" : r.raw;
      this.navEl.innerHTML = items.map(([id, label, icon]) => '<a href="#' + id + '"' + (group === id ? ' aria-current="page"' : "") + ">" + ICON[icon] + "<span>" + label + "</span></a>").join("");
    }
    stateScreen() {
      const v = this.views.home;
      if (this.state === "failed") return v.page(this.source instanceof CloudSource || this.source.constructor === DataSource
        ? '<div class="card stack-s"><h2>Database belum terbaca</h2><p class="muted">Halaman ini membutuhkan akun claude.ai yang sudah masuk dan akses ke artifak ini. Buka ulang halaman setelah masuk.</p></div>'
        : '<div class="card stack-s"><h2>Data belum terbaca</h2><p class="muted">File data tidak ditemukan atau tidak lolos pemeriksaan sumber.</p></div>');
      if (this.state === "empty") return v.page('<div class="card stack-s"><h2>Database masih kosong</h2><p class="muted">Basis pengetahuan belum diisi. Setelah diisi, isinya muncul di sini otomatis.</p></div>');
      return null;
    }
    render() {
      this.renderNav();
      if (this.state === "loading") return;
      const screen = this.stateScreen();
      const active = document.activeElement, focusId = active && active.id, sel = active && active.selectionStart;
      this.root.innerHTML = screen || this.currentView.render(this.route.param);
      if (focusId) { const el = document.getElementById(focusId); if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (e) { /* jenis input tanpa seleksi */ } } }
    }
    bindEvents() {
      window.addEventListener("hashchange", () => { const prev = this.route.raw; this.route = Router.parse(); if (this.route.raw !== prev) window.scrollTo(0, 0);
        // Pindah dari hitung napas di tengah hitungan: hentikan dan lepas kunci layar agar baterai tidak terkuras.
        const br = this.views.breath; if (this.route.name !== "breath" && br.counter.running) { br.counter.reset(); br.releaseWake(); }
        this.render(); });
      document.addEventListener("click", async e => {
        const t = e.target.closest("button, a");
        if (!t || !this.root.contains(t)) return;
        const res = await this.currentView.onClick(t);
        if (res === true) this.render();
      });
      document.addEventListener("input", e => this.currentView.onInput(e.target));
      document.addEventListener("change", e => { const v = this.currentView; if (v.onChange && v.onChange(e.target)) this.render(); });
      document.addEventListener("submit", e => { e.preventDefault(); if (this.currentView.onSubmit(e.target)) this.render(); });
    }
  }
